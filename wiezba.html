            <path d="M170 296 Q178 300 186 296" fill="none" stroke-width="3" opacity=".6"/>
          </g></svg>
        <g fill="none" stroke="#141414" stroke-width="3"></g>
        
        <g id="rStArm" style="transform-origin:56px -290px">
          <path d="M56 -290 L56 -150" stroke-width="30"/><path d="M56 -290 L56 -150" stroke="#e8b08a" stroke-width="22"/>
          <path d="M56 -292 L58 -246" stroke-width="40"/><path d="M56 -292 L58 -246" stroke="#1f2a44" stroke-width="32"/>
          <circle cx="56" cy="-140" r="14" fill="#e8b08a"/></g>
      </g>
    <ellipse class="flush" cx="0" cy="-370" rx="54" ry="66" fill="#ff2020" opacity="0"/></g></g></g></g>

    <g id="fx"></g>
   </g>
    <g id="bubbles" style="display:none"></g>
    <g id="pows"></g>
  </g>

  </g>

<script src="intro2.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scSite"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    a: { el: "aSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 170, vPitch: 0.8, vRate: 1.2 },
    r: { el: "rSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 210, vPitch: 0.95, vRate: 1.2 },
    z: { el: "zs", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 120, vPitch: 0.35, vRate: 1.1 },
    i: { el: "inv", x: 0, y: 0, s: 1, head: 300, pitch: 160, vPitch: 0.7, vRate: 1.15, mouthO: "iMO", mouthC: "iMC" }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  // nagrane kwestie (kierowca): odtwarzane wolniej i bez zachowania wysokosci = bardzo niski, gruby glos
  const CLIPS = {
    "Dzień dobry, panie inwestorze! Dziś dach będzie!": { src: "glosy/wiezba/01_callum.mp3", rate: 1 },
    "To samo pan mówił w poniedziałek.": { src: "glosy/wiezba/02_daniel.mp3", rate: 1 },
    "Halo? Tak, skup złomu… Miedź po dwadzieścia osiem.": { src: "glosy/wiezba/03_roger.mp3", rate: 1 },
    "A ten pan na dachu to kto?": { src: "glosy/wiezba/04_daniel.mp3", rate: 1 },
    "Wspólnik. Ze złomowiska.": { src: "glosy/wiezba/05_callum.mp3", rate: 1 },
    "A tamten przy betoniarce?": { src: "glosy/wiezba/06_daniel.mp3", rate: 1 },
    "Andrzej? On się tak kręci.": { src: "glosy/wiezba/07_callum.mp3", rate: 1 },
    "Ja tu pilnuję betoniarki!": { src: "glosy/wiezba/08_charlie.mp3", rate: 1 },
    "Daj krokiew, zakładamy ostatnią!": { src: "glosy/wiezba/09_callum.mp3", rate: 1 },
    "Trzymam, trzymam.": { src: "glosy/wiezba/10_roger.mp3", rate: 1 },
    "Panowie, ja tu płacę od metra! Kiedy to będzie gotowe?": { src: "glosy/wiezba/11_daniel.mp3", rate: 1 },
    "Szefie, jak skończymy, to będzie.": { src: "glosy/wiezba/12_callum.mp3", rate: 1 },
    "Halo? Skup złomu, słucham!": { src: "glosy/wiezba/13_roger.mp3", rate: 1 },
    "No i w pizdu wylądował.": { src: "glosy/wiezba/14_roger.mp3", rate: 1 },
    "MÓJ BUS!!!": { src: "glosy/wiezba/15_callum.mp3", rate: 1 },
    "Za szybę to ja nie płacę.": { src: "glosy/wiezba/16_daniel.mp3", rate: 1 },
    "Ale wszedł równo. Jak w masło.": { src: "glosy/wiezba/17_charlie.mp3", rate: 1 }
  };

  const DEEP = 0.55;
  const clipEls = {};   // tylko wczytanie z wyprzedzeniem, nigdy nie grane
  // 3 odtwarzacze na wszystkie kwestie; na starcie odblokowane krotka cisza (bez puszczania nagran)
  const SILENT = "data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQIAAACAgA==";
  const voices = [new Audio(), new Audio(), new Audio()];
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){ const a = new Audio(); a.preload = "auto"; a.src = src; clipEls[src] = a; }
    return { src, rate };
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(clipFor);
    voices.forEach(v => { v.src = SILENT; v.play().catch(() => {}); });
  }
  function playClip(c){
    const v = voices.find(x => x.paused || x.ended) || voices[0];
    return new Promise(res => {
      v.pause(); v.src = c.src; v.playbackRate = c.rate;
      v.preservesPitch = v.mozPreservesPitch = v.webkitPreservesPitch = c.rate === 1;
      const guard = setTimeout(res, 15000);
      v.onended = v.onerror = () => { clearTimeout(guard); res(); };
      v.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  // narysowane glowy bohaterow: usta otwieraja sie i zamykaja przy mowieniu
  function flap(w, on){
    const el = $(w.el), mC = el && el.querySelector(".mC"), mO = el && el.querySelector(".mO");
    if (!mO) return;
    clearInterval(w._flap);
    let open = false;
    const set = o => { mC.style.display = o ? "none" : ""; mO.style.display = o ? "" : "none";
      mO.style.transformBox = "fill-box"; mO.style.transformOrigin = "50% 0";
      mO.style.transform = o ? `scaleY(${0.55 + Math.random() * 0.5})` : ""; };
    if (on) w._flap = setInterval(() => set(open = !open), 110);
    else set(false);
  }
  function talking(k, on){
    const w = who[k];
    if (w.img){
      if (on) w._talk = $(w.el).querySelector(".bob").animate(
        [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(-8px) scaleY(1.02)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
      flap(w, on);
      return;
    }
    clearInterval(w._talk);
    let open = false;
    if (on) w._talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    else { $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = ""; }
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){
    const w = who[k], tx = w.x, ty = w.y - w.head;
    const b = makeBubble(tx, ty, lines, shift);
    await anim(b.g, [{ transform: `translate(${tx}px,${ty}px) scale(0)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }],
               { duration: 200, easing: "cubic-bezier(.3,1.6,.6,1)" });
    if (instant){ b.spans.forEach((s, i) => s.textContent = lines[i]); return b; }
    talking(k, true);
    const spoken = speak(lines.join(" "), w, { pitch, rate });
    for (let i = 0; i < lines.length; i++){
      for (const ch of lines[i]){
        b.spans[i].textContent += ch;
        if (ch !== " " && !spoken) sfx.voice(w.pitch);
        await sleep(spoken ? 45 : 58);
      }
    }
    if (spoken) await spoken;
    talking(k, false);
    return b;
  }
  async function unsay(b){
    await anim(b.g, [{ transform: `translate(${b.tipX}px,${b.tipY}px) scale(1)` }, { transform: `translate(${b.tipX}px,${b.tipY}px) scale(0)` }], { duration: 150 });
    b.g.remove();
  }
  async function line(k, lines, hold = 1600, shift = 0, opts){
    const b = await say(k, lines, shift, opts);
    await sleep(hold); await unsay(b); await sleep(250);
  }

  // ---------- rekwizyty ----------
  let wheelAnims = [];
  function spinWheels(dir, period = 0.5){
    wheelAnims.forEach(a => a.cancel()); wheelAnims = [];
    if (!dir) return;
    document.querySelectorAll("#bus .bw").forEach(w => wheelAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${dir * 360}deg)` }],
                { duration: period * 1000, iterations: Infinity })));
  }
  let busX = 1750;
  async function busDrive(x, dur, easing = "cubic-bezier(.2,.7,.35,1)", y = 494){
    const from = busT(busX, y); busX = x;
    await anim($("bus"), [{ transform: from }, { transform: busT(x, y) }], { duration: dur, easing });
  }
  function exhaust(y = 494){ return setInterval(() => puff(busX + 600, y + 250, { r: 18, dur: 1000, dx: 50, dy: -40, color: "#9a9a9a" }), 140); }

  // wykrywacz: pierscienie przy talerzu wykrywacza + pisk, coraz szybciej
  async function detector(times){
    const hx = who.s2.x + 86, hy = who.s2.y - 26;
    for (let i = 0; i < times; i++){
      sfx.beep();
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", hx); c.setAttribute("cy", hy); c.setAttribute("r", 20);
      c.setAttribute("fill", "none"); c.setAttribute("stroke", "#ffd23f"); c.setAttribute("stroke-width", "6");
      c.style.transformOrigin = `${hx}px ${hy}px`;
      $("detFx").append(c);
      c.animate([{ transform: "scale(.4)", opacity: 1 }, { transform: "scale(3)", opacity: 0 }], { duration: 600, fill: "forwards" })
       .finished.then(() => c.remove()).catch(() => {});
      await sleep(Math.max(90, 520 - i * 38));
    }
  }

  // papierosy: czubek wzgledem stop postaci
  const CIG_TIP = { s1: [32, -252], s2: [16, -285], m: [36, -270] };
  let cigSmoke = null;
  function smokeCigs(on, ks = ["s1", "s2"]){
    clearInterval(cigSmoke);
    ["s1", "s2", "m"].forEach(k => $(who[k].el).querySelector(".cig").style.display = on && ks.includes(k) ? "" : "none");
    if (!on) return;

    pl("rSeat", 600, JY - 2 + 165 * 0.5, 0.5, 1); $("rSeatW").style.display = "";
    hammering(true);
    await sleep(1500);
    await R("Daj krokiew, zakładamy ostatnią!", 100);
    // Andrzej z taczka kreci sie w tle
    $("barrow").style.display = "";
    const bw = (async () => {
      put("aSt", 900, 860, 0.58, -1); await armTo("aSt", -60, 200);
      for (const [x0, x1] of [[900, 300], [300, 1000]]){
        const f = x1 < x0 ? -1 : 1; P.aSt.f = f; draw("aSt");
        const w = walk("aSt", x1, 3400);
        await tween(3400, k => { const x = x0 + (x1 - x0) * k; $("barrow").setAttribute("transform", `translate(${x + f * 110},870) scale(${f * 0.7},0.7)`); });
        await w;
      }
      await armTo("aSt", 0, 200);
    })();
    hammering(false);
    kr(715, JY - 40, 0);
    await Z("Trzymam, trzymam.", 200, -40);
    await I(["Panowie, ja tu płacę od metra!", "Kiedy to będzie gotowe?"], 200);
    await R("Szefie, jak skończymy, to będzie.", 300);
    // telefon
    ring(); await sleep(600);
    await Z("Halo? Skup złomu, słucham!", 0, -40);
    // puszcza krokiew
    whoosh(0.6);
    const [gx, gy] = glass();
    const sx = ER - 40, sy = WT - 10;
    await path([[715, JY - 40, 0, 0], [800, JY - 20, 25, 0.25], [860, JY - 10, 44, 0.4]], 700, t => t * t);
    woodBonk(); pow("BONK!", 870, JY - 60, { size: 70, hold: 400 }); shake(6, 200);
    // zjezdza po krokwi (spada na dach)
    noise(0.8, { freq: 1600, q: 2, vol: 0.2, sweepTo: 600 });
    await path([[860, JY - 10, 44, 0], [sx, sy, 44, 1]], 800, t => t * t);
    // leci w szybe busa
    whoosh(0.8);
    await path([[sx, sy, 44, 0], [(sx + gx) / 2 - 40, sy - 140, 150, 0.45], [gx + 150 * Math.cos(208 * Math.PI / 180), gy + 150 * Math.sin(208 * Math.PI / 180), 208, 1]], 900);
    glassS(); $("crack").style.display = ""; shake(14, 400);
    pow("BRZDĘK!", gx, gy - 140, { size: 90, col: "#bfe2ff", hold: 900 });
    bits(gx, gy, 18, { color: "#bfe2ff", spread: 160, up: 160, size: 8 });
    await sleep(1000);
    await bw.catch(() => {});
    mixer(false); rattle(false);
    await sleep(800);
    // cisza i komentarz
    await camTo(830, 300, 1.8, 600);
    await Z("No i w pizdu wylądował.", 900, -40);
    await camTo(800, 450, 1, 600);
    await R("MÓJ BUS!!!", 300);
    await I("Za szybę to ja nie płacę.", 400);
    $("barrow").style.display = "none"; put("aSt", gx - 110, 885, 0.6, 1);
    await A(["Ale wszedł równo.", "Jak w masło."], 900);
    $("fade").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: "forwards" });
    await sleep(900);
    if (!h) await ziomkiOutro();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
