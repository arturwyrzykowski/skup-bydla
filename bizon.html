<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scYard"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    a: { el: "aSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 170, vPitch: 0.8, vRate: 1.5 },
    r: { el: "rSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 210, vPitch: 0.95, vRate: 1.5 },
    s: { el: "sSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 90, vPitch: 0.2, vRate: 1.45 },
    u: { el: "ubij", x: 0, y: 0, s: 1, head: 300, pitch: 150, vPitch: 0.55, vRate: 1.4, mouthO: "uMouthO", mouthC: "uMouthC" },
    y: { el: "syn", x: 0, y: 0, s: 1, head: 300, pitch: 230, vPitch: 1.2, vRate: 1.5, mouthO: "synMouthO", mouthC: "synMouthC" },
    z: { el: "zlom", img: true, x: 0, y: 0, s: 1, head: 200, pitch: 120, vPitch: 0.3, vRate: 1.2 },
    f: { el: "gruby", x: 0, y: 0, s: 1, head: 260, pitch: 330, vPitch: 1.7, vRate: 1.65, mouthO: "fMO", mouthC: "fMC" },
    c: { el: "chudy", x: 0, y: 0, s: 1, head: 420, pitch: 100, vPitch: 0.45, vRate: 1.45, mouthO: "cMO", mouthC: "cMC" }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }

  function holderAt(x0, y0, x1, y1){ $("holder").style.display = ""; $("hBody").setAttribute("d", `M${x0} ${y0} L${x0 + (x1 - x0) * 0.55} ${y0 + (y1 - y0) * 0.55}`); $("hRod").setAttribute("d", `M${x0 + (x1 - x0) * 0.55} ${y0 + (y1 - y0) * 0.55} L${x1} ${y1}`);
    $("cable").setAttribute("d", `M1060 800 Q${(x0 + 1060) / 2} 900 ${x0} ${y0}`); }
  async function weld(x, y, ms, big = 1){
    const t0 = performance.now(), arc = $("arc");
    arc.setAttribute("cx", x); arc.setAttribute("cy", y);
    while (performance.now() - t0 < ms){
      arc.setAttribute("r", (8 + Math.random() * 14) * big); arc.setAttribute("opacity", 0.6 + Math.random() * 0.4);
      $("flash").setAttribute("fill", "#dff4ff"); $("flash").style.opacity = (0.05 + Math.random() * 0.12) * big;
      crackle();
      if (Math.random() < 0.5) bits(x, y, 2, { color: "#ffd23f", spread: 90 * big, up: 70 * big, size: 3 });
      await sleep(60);
    }
    arc.setAttribute("r", 0); $("flash").style.opacity = 0;
  }
  // ---------- stol + walek ----------
  const T = { x: 910, y: 760 };
  function tableAt(x, y, r = 0){ T.x = x; T.y = y; $("table").style.display = ""; $("table").style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`; }
  function shaftAt(x, y, r = 0){ $("shaft").style.display = ""; $("shaft").style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`; }
  const fat = id => $("fMad").style.display = id ? "" : "none";

  function reset(){
    if (tts) tts.cancel();
    document.getAnimations().forEach(a => a.cancel());
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = ""; $("pows").innerHTML = "";
    scene("scYard"); camSet();
    ["aStW", "rStW", "sStW", "table", "shaft", "holder", "wmask", "phone", "seam", "fEyesX", "fMad", "uDirt"].forEach(id => $(id) && ($(id).style.display = "none"));
    $("fEyes").style.display = ""; $("cable").setAttribute("d", ""); $("arc").setAttribute("r", 0);
    ["shL", "shR", "tTop"].forEach(id => $(id).style.transform = "");
    document.querySelectorAll("#tLegs .tl").forEach(l => l.style.transform = "");
    $("knob").style.transform = "rotate(-60deg)";
    ["aSt", "rSt", "sSt"].forEach(id => { $(id + "Arm").style.transform = ""; legs(id, 0, 0); });
    document.querySelectorAll(".flush").forEach(f => f.style.opacity = 0);
    $("flash").style.opacity = 0; $("flash").setAttribute("fill", "#fff"); $("fade").style.opacity = 0;
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    const h = location.hash;
    if (!h) await ziomkiIntro2("NAPRAWA BIZONA", 13, 3, 1);

    // ===== ustawienie postaci =====
    pl("syn", 130, 812, 0.5);
    pl("zlom", 470, 872, 0.5, 1, -90);
    put("sSt", 600, 880, 0.62, 1);
    put("aSt", 760, 884, 0.62, 1);
    pl("gruby", 1230, 886, 0.62, -1);
    pl("chudy", 1350, 862, 0.6, -1);
    pl("ubij", 1480, 872, 0.56, -1);
    const smoke = setInterval(() => puff(Q.syn.x + 58 * 0.5, Q.syn.y - 348 * 0.5, { r: 6, dur: 1500, dx: 14, dy: -70, color: "#cfcfcf" }), 400);
    const drunkBob = $("zlom").querySelector(".bob").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-3deg)" }], { duration: 900, direction: "alternate", iterations: Infinity });
    await sleep(500);

    await F("s", "sSt", 470, "No i wałek się urwał.");
    await U(["To nie zadziała.", "Trzeba wyjąć silnik."]);
    await F("a", "aSt", 470, "Jaki silnik? Przyspawamy i będzie.");

    // Triwet przynosi stol
    put("rSt", 1750, 884, 0.62, -1);
    tableAt(1750, 760 - 290 * 0.62 - 20);
    const carry = (async () => { await walk("rSt", 1060, 2200); })();
    const tc = setInterval(() => tableAt(P.rSt.x - 10, 884 - 290 * 0.62 - 150), 30);
    await carry; clearInterval(tc);
    await tween(400, k => tableAt(1050 - 140 * k, (884 - 290 * 0.62 - 150) + (760 - (884 - 290 * 0.62 - 150)) * k));
    thud();
    await F("r", "rSt", 470, "Stół jest!", 100);
    // walek na stol
    clank(); shaftAt(905, 738);
    await sleep(300);

    // Triwet nagrywa na YT
    await walk("rSt", 1110, 400);
    await armTo("rSt", -150, 250);
    const ph = $("phone"); ph.style.display = ""; ph.style.transform = `translate(${P.rSt.x - 30}px,${884 - 360 * 0.62}px)`;
    const recB = $("recD").animate([{ opacity: 1 }, { opacity: 0.1 }], { duration: 400, direction: "alternate", iterations: Infinity });
    await F("r", "rSt", 470, ["Siema, dzisiaj spawamy bizona,", "łapka w górę!"], 100, -40);
    // gruby sie wkurwia
    fat(1); $("gruby").querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-30px)" }, { transform: "translateY(0)" }], { duration: 220, iterations: 3 });
    await F("f", "gruby", 400, ["Wypierdalaj mnie z tym,", "bo kopa zajebię!"], 100, 60);
    await anim($("fLegR"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-60deg)" }, { transform: "rotate(0deg)" }], { duration: 350 });
    thud(); fat(0);
    await walk("rSt", 1170, 300);
    // pijany zlomiarz majaczy
    await F("z", "zlom", 120, ["Brrhm… szszprychy…", "mmmuha… blblbl…"], 150, 120);
    await U("Mówię wam, trzeba wyjąć silnik.");

    // ===== Andrzej spawa =====
    const mk = $("wmask"); mk.style.display = ""; mk.style.transform = `translate(${P.aSt.x + 4}px,${884 - 373 * 0.62}px) scale(0.62)`;
    await armTo("aSt", -70, 250);
    holderAt(806, 720, 900, 740);
    $("seam").style.display = "";
    await weld(902, 740, 2600);
    mk.style.display = "none"; $("holder").style.display = "none"; $("cable").setAttribute("d", "");
    armTo("aSt", 0, 200);
    await F("a", "aSt", 470, "Gotowe. Trzyma jak marzenie.");
    // podnosi walek... i walek sie urywa
    await armTo("aSt", -60, 200);
    await tween(500, k => shaftAt(905, 738 - 70 * k));
    tone(140, 0.8, "sawtooth", 0.04, 110);
    await sleep(900);
    tone(900, 0.06, "square", 0.06); pow("TRZASK!", 905, 560, { size: 70, col: "#fff", hold: 400 });
    $("seam").style.display = "none";
    await Promise.all([
      anim($("shL"), [{ transform: "translate(0,0) rotate(0deg)" }, { transform: "translate(-40px,140px) rotate(-40deg)" }], { duration: 420, easing: "ease-in" }),
      anim($("shR"), [{ transform: "translate(0,0) rotate(0deg)" }, { transform: "translate(50px,140px) rotate(35deg)" }], { duration: 420, easing: "ease-in" })]);
    clank(); setTimeout(clank, 90); shake(6, 200);
    armTo("aSt", 0, 200);
    await F("s", "sSt", 470, "Ale żeś, kurwa, przyspawał.", 250);
    await U("Mówiłem. Trzeba wyjąć silnik.");

    // ===== chudy podkreca prad =====
    $("shL").getAnimations().forEach(a => a.cancel()); $("shR").getAnimations().forEach(a => a.cancel());
    shaftAt(905, 738); $("seam").style.display = "";
    await F("c", "chudy", 640, ["Prądu za mało.", "Dajcie, podkręcę na maksa."], 100);
    await anim($("knob"), [{ transform: "rotate(-60deg)" }, { transform: "rotate(80deg)" }], { duration: 500 });
    $("knob").style.transform = "rotate(80deg)"; tone(200, 0.5, "sawtooth", 0.05, 600);

    // ===== gruby spawa bez maski =====
    await F("f", "gruby", 400, "Dawaj, ja to zrobię!");
    await Promise.all([walk("aSt", 660, 500), walk("sSt", 520, 500)]); P.aSt.f = 1; draw("aSt");
    const g0 = Q.gruby.x;
    $("gruby").querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-14px)" }], { duration: 160, direction: "alternate", iterations: 10 });
    await tween(1600, k => pl("gruby", g0 + (790 - g0) * k, 886, 0.62, 1));
    $("fArmR").style.transform = "rotate(-40deg)";
    holderAt(870, 790, 902, 744);
    await F("f", "gruby", 400, "To jest sakramencki błysk!", 50);
    // mega blysk
    const big = weld(902, 744, 2200, 2.4);
    await sleep(1500);
    $("flash").setAttribute("fill", "#fff");
    await big;
    $("holder").style.display = "none"; $("cable").setAttribute("d", "");
    await anim($("flash"), [{ opacity: 1 }, { opacity: 1, offset: 0.4 }, { opacity: 0 }], { duration: 1800 });
    $("fEyes").style.display = "none"; $("fEyesX").style.display = "";
    await F("f", "gruby", 400, "Nic nie widzę! Kurwa, nic nie widzę!", 100);
    await U("A mówiłem, trzeba wyjąć silnik.");
    // gruby po omacku opiera sie o stol -> stol sie zalamuje
    $("fArmL").style.transform = "rotate(90deg)"; $("fArmR").style.transform = "rotate(-90deg)";
    const gx = Q.gruby.x;
    await tween(900, k => pl("gruby", gx + 60 * k + Math.sin(k * 12) * 8, 886, 0.62, 1));
    tone(160, 0.6, "sawtooth", 0.05, 90);
    await sleep(400);
    const legsT = [...document.querySelectorAll("#tLegs .tl")];
    pow("KRACH!", 910, 600, { size: 110, col: "#ffb13b" });
    thud(); clank(); shake(14, 400);
    await Promise.all([
      ...legsT.map((l, i) => anim(l, [{ transform: "rotate(0deg)" }, { transform: `rotate(${i < 2 ? 70 : -70}deg)` }], { duration: 300, easing: "ease-in" })),
      anim($("tTop"), [{ transform: "translate(0,0) rotate(0deg)" }, { transform: "translate(0,100px) rotate(6deg)" }], { duration: 300, easing: "ease-in" }),
      tween(300, k => { shaftAt(905, 738 + 128 * k, 6 * k); pl("gruby", gx + 60, 886 + 20 * k, 0.62, 1); })
    ]);
    bits(910, 870, 10, { color: "#a8763e", spread: 180, up: 120, size: 8 });
    $("fArmL").style.transform = ""; $("fArmR").style.transform = "";
    await sleep(500);
    await U(["No to teraz to już na pewno", "trzeba wyjąć silnik."], 200);
    await F("y", "syn", 490, ["Na chuj wam ten bizon,", "i tak nie pojedzie."], 150, 120);
    $("zlom").querySelector(".bob").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-14deg)" }, { transform: "rotate(0deg)" }], { duration: 700 });
    await F("z", "zlom", 120, "Nzdrowie… hyyp…", 150, 120);
    await F("r", "rSt", 470, "Dajcie suba!", 400, -40);
    clearInterval(smoke); drunkBob.cancel(); recB.cancel();
    $("fade").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: "forwards" });
    await sleep(600);
    if (!h) await ziomkiOutro();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
