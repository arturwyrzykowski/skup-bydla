<script src="intro.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scWinter", "scGarage", "scVillage", "scPOV", "scCrash"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  // pozycje dymkow ustawiane w trakcie (x, y = punkt pod glowa, head = wysokosc glowy nad y)
  const who = {
    a:  { el: "aTalk", img: true, x: 800, y: 700, s: 1, head: 300, pitch: 170, vPitch: 0.7, vRate: 1.1 },
    s:  { el: "sTalk", img: true, x: 700, y: 700, s: 1, head: 300, pitch: 85, vPitch: 0, vRate: 0.85 },
    r:  { el: "rTalk", img: true, x: 300, y: 700, s: 1, head: 300, pitch: 210, vPitch: 0.95, vRate: 1.1 },
    sA: { el: "stA", img: true, x: 0, y: 800, s: 1, head: 280, pitch: 170, vPitch: 0.7, vRate: 1.1 },
    sR: { el: "stR", img: true, x: 0, y: 800, s: 1, head: 270, pitch: 210, vPitch: 0.95, vRate: 1.1 },
    sS: { el: "stS", img: true, x: 0, y: 800, s: 1, head: 275, pitch: 85, vPitch: 0, vRate: 0.85 }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).getAnimations().forEach(a => a.cancel()); $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  // nagrane kwestie (kierowca): odtwarzane wolniej i bez zachowania wysokosci = bardzo niski, gruby glos
  const CLIPS = {
    "Artur, dawaj, odkręć go!": { src: "glosy/skuter/01_laura.mp3", rate: 1 },
    "Trzymaj się, Siket!": { src: "glosy/skuter/02_charlie.mp3", rate: 1 },
    "Kurwaaa!": { src: "glosy/skuter/03_charlie.mp3", rate: 1 },
    "O kurwa! Żyjecie?!": { src: "glosy/skuter/04_callum.mp3", rate: 1 },
    "Po chuj ja z tobą jechałem…": { src: "glosy/skuter/05_laura.mp3", rate: 1 },
    "Lód był!": { src: "glosy/skuter/06_charlie.mp3", rate: 1 },
    "Ha ha ha! Ale dachowanie!": { src: "glosy/skuter/07_callum.mp3", rate: 1 },
    "Czekajcie, kurwa! Czekajcie na mnie!": { src: "glosy/skuter/08_laura.mp3", rate: 1 },
    "Ciii… tylko cicho.": { src: "glosy/skuter/09_callum.mp3", rate: 1 },
    "Wsiadać, szybko!": { src: "glosy/skuter/10_laura.mp3", rate: 1 },
    "Gaś światła, gaś!": { src: "glosy/skuter/11_laura.mp3", rate: 1 },
    "Słup!": { src: "glosy/skuter/12_callum.mp3", rate: 1 },
    "W dupę… drugi wypadek w jeden dzień.": { src: "glosy/skuter/13_laura.mp3", rate: 1 }
  };

  const DEEP = 0.55;
  const clipEls = {};   // tylko wczytanie z wyprzedzeniem, nigdy nie grane
  // 3 odtwarzacze na wszystkie kwestie; na starcie odblokowane krotka cisza (bez puszczania nagran)
  const SILENT = "data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQIAAACAgA==";
  const voices = [new Audio(), new Audio(), new Audio()];
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){ const a = new Audio(); a.preload = "auto"; a.src = src; clipEls[src] = a; }
    return { src, rate };
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(clipFor);
    voices.forEach(v => { v.src = SILENT; v.play().catch(() => {}); });
  }
  function playClip(c){
    const v = voices.find(x => x.paused || x.ended) || voices[0];
    return new Promise(res => {
      v.pause(); v.src = c.src; v.playbackRate = c.rate;
      v.preservesPitch = v.mozPreservesPitch = v.webkitPreservesPitch = c.rate === 1;
      const guard = setTimeout(res, 15000);
      v.onended = v.onerror = () => { clearTimeout(guard); res(); };
      v.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  // narysowane glowy bohaterow: usta otwieraja sie i zamykaja przy mowieniu
  function flap(w, on){
    const el = $(w.el), mC = el && el.querySelector(".mC"), mO = el && el.querySelector(".mO");
    if (!mO) return;
    clearInterval(w._flap);
    let open = false;
    const set = o => { mC.style.display = o ? "none" : ""; mO.style.display = o ? "" : "none";
      mO.style.transformBox = "fill-box"; mO.style.transformOrigin = "50% 0";
      mO.style.transform = o ? `scaleY(${0.55 + Math.random() * 0.5})` : ""; };
    if (on) w._flap = setInterval(() => set(open = !open), 110);
    else set(false);
  }
  function talking(k, on){
    const w = who[k];
    if (w.img){
      if (on) w._talk = $(w.el).querySelector(".bob").animate(
        [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(-8px) scaleY(1.02)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
      flap(w, on);
      return;
    }
    clearInterval(w._talk);
    let open = false;
    if (on) w._talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    else { $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = ""; }
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){
    const w = who[k], tx = w.x, ty = w.y - w.head;
    const b = makeBubble(tx, ty, lines, shift);
    await anim(b.g, [{ transform: `translate(${tx}px,${ty}px) scale(0)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }],
               { duration: 200, easing: "cubic-bezier(.3,1.6,.6,1)" });
    if (instant){ b.spans.forEach((s, i) => s.textContent = lines[i]); return b; }
    talking(k, true);
    const spoken = speak(lines.join(" "), w, { pitch, rate });
    for (let i = 0; i < lines.length; i++){
      for (const ch of lines[i]){
        b.spans[i].textContent += ch;
        if (ch !== " " && !spoken) sfx.voice(w.pitch);
        await sleep(spoken ? 45 : 58);
      }
    }
    if (spoken) await spoken;
    talking(k, false);
    return b;
  }
  async function unsay(b){
    await anim(b.g, [{ transform: `translate(${b.tipX}px,${b.tipY}px) scale(1)` }, { transform: `translate(${b.tipX}px,${b.tipY}px) scale(0)` }], { duration: 150 });
    b.g.remove();
  }
  async function line(k, lines, hold = 1600, shift = 0, opts){
    const b = await say(k, lines, shift, opts);
    await sleep(hold); await unsay(b); await sleep(250);
  }

  // ---------- rekwizyty ----------
  let wheelAnims = [];
  function spinWheels(dir, period = 0.5){
    wheelAnims.forEach(a => a.cancel()); wheelAnims = [];
    if (!dir) return;
    document.querySelectorAll("#bus .bw").forEach(w => wheelAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${dir * 360}deg)` }],
                { duration: period * 1000, iterations: Infinity })));

    const engA = twoStroke(), engR = twoStroke();
    engA.set(150, 0.07, 0.4); engR.set(135, 0.05, 0.4);
    forest(1); wheels("scA", 0.25); wheels("scR", 0.25); bounce("scA", true); bounce("scR", true);
    const exA = exhaustPuffs("scA"), exR = exhaustPuffs("scR");
    scMove("scR", 330, 3000);
    await scMove("scA", 820, 3000);
    await sleep(600);
    talkAt("s", 820 - 120 + 0, 700 - 48, 250); talkAt("a", 820 - 40, 700 - 48, 250);
    await line("s", ["Artur, dawaj,", "odkręć go!"], 300, -80);
    engA.set(230, 0.1, 0.5); setSpeed(1.8); wheels("scA", 0.12);
    await line("a", ["Trzymaj się,", "Siket!"], 300, 60);
    await sleep(500);

    // ===== lod na drodze =====
    const ice = $("ice"); ice.style.display = "";
    await anim(ice, [{ transform: "translateX(1800px)" }, { transform: "translateX(830px)" }], { duration: 900, easing: "linear" });
    // tyl ucieka: skuter mysli, ze jest bokiem - wezyk
    noise(1.6, { freq: 2700, q: 9, vol: 0.35, sweepTo: 1600 }); tone(1800, 1.4, "sawtooth", 0.02, 1100);
    anim(ice, [{ transform: "translateX(830px)" }, { transform: "translateX(-400px)" }], { duration: 1200, easing: "linear" });
    const tilt = $("scA").querySelector(".tilt");
    bounce("scA", false);
    const kurwa = say("a", ["Kurwaaa!!!"], 60, { instant: true });
    speak("Kurwaaa!", who.a, { pitch: 1.3, rate: 1.4 });
    const wob = [0, -8, 10, -14, 18, -22, 26];
    for (let i = 1; i < wob.length; i++){
      await anim(tilt, [{ transform: `rotate(${wob[i - 1]}deg)` }, { transform: `rotate(${wob[i]}deg)` }], { duration: 170, easing: "ease-in-out" });
      snowSpray(sc.scA.x - 130, 700, 4);
    }
    unsay(await kurwa);
    setSpeed(0.6);

    // ===== zjazd do rowu i dachowanie =====
    clearInterval(exA); engA.set(320, 0.1, 0.2);
    const x0 = sc.scA.x;
    // ostatnia chwila na drodze
    await anim($("scA"), [{ transform: scT(x0, 700) }, { transform: scT(x0 + 90, 730, 20) }], { duration: 260, easing: "ease-in" });
    tilt.getAnimations().forEach(a => a.cancel()); tilt.style.transform = "rotate(26deg)";
    snowSpray(x0 + 120, 740, 10, 1);
    // jezdzcy odpadaja
    document.querySelectorAll("#scA .rider").forEach(r => r.style.display = "none");
    const fA = $("flyA"), fS = $("flyS");
    fA.style.display = ""; fS.style.display = "";
    const flyT = (x, y, s) => `translate(${x}px,${y}px) scale(${s})`;
    anim(fA, [{ transform: flyT(x0 + 60, 682, 0.62) }, { transform: flyT(x0 + 260, 470, 0.62), offset: 0.45 }, { transform: flyT(1400, 860, 0.62) }], { duration: 1300, easing: "ease-in-out" });
    anim(fA.querySelector(".spin"), [{ transform: "rotate(0deg)" }, { transform: "rotate(560deg)" }], { duration: 1300, easing: "ease-out" });
    anim(fS, [{ transform: flyT(x0 - 20, 682, 0.62) }, { transform: flyT(x0 - 40, 500, 0.62), offset: 0.45 }, { transform: flyT(560, 870, 0.62) }], { duration: 1400, easing: "ease-in-out" });
    anim(fS.querySelector(".spin"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-470deg)" }], { duration: 1400, easing: "ease-out" });
    // skuter koziolkuje w dol do rowu
    wheels("scA", 0.08);
    await anim($("scA"), [
      { transform: scT(x0 + 90, 730, 20) },
      { transform: scT(x0 + 170, 700, 120), offset: 0.3 },
      { transform: scT(x0 + 200, 790, 250), offset: 0.6 },
      { transform: scT(x0 + 230, 740, 330), offset: 0.8 },
      { transform: scT(x0 + 250, 700, 540) }], { duration: 1500, easing: "ease-in" });
    sc.scA.x = x0 + 250; sc.scA.y = 700;
    sfx.thud(); sfx.clank(); tone(70, 0.4, "sine", 0.5, 35); shake(18, 500);
    snowSpray(x0 + 250, 850, 16, 1); snowSpray(x0 + 250, 850, 16, -1);
    // chlopaki w zaspach
    fA.style.display = "none"; fS.style.display = "none";
    snowSpray(1400, 850, 14, 1); snowSpray(560, 860, 14, -1); sfx.thud();
    $("snowA").style.display = ""; $("snowS").style.display = "";
    const kick = $("snowA").querySelector(".kick").animate([{ transform: "rotate(-8deg)" }, { transform: "rotate(8deg)" }], { duration: 260, direction: "alternate", iterations: 12 });
    // silnik sie dlawi, kola sie kreca, klakson sie zacina
    engA.set(90, 0.05, 0.6);
    setTimeout(() => engA.stop(0.5), 900);
    wheels("scA", 0.35);
    const horn = setInterval(() => { tone(415, 0.18, "square", 0.04); tone(523, 0.18, "square", 0.03); }, 700);
    const hl = $("scA").querySelector(".hl").animate([{ opacity: 1 }, { opacity: 0.1 }], { duration: 180, direction: "alternate", iterations: Infinity });

    // ===== Radek sie zatrzymuje =====
    clearInterval(exR);
    forest(0); bounce("scR", false); wheels("scR", 0);
    engR.set(70, 0.03, 0.8);
    await scMove("scR", 480, 1400, "ease-out");
    sfx.brake();
    await sleep(500);
    talkAt("r", 480 - 40, 652, 250);
    await line("r", ["O kurwa!", "Żyjecie?!"], 400, -40);
    talkAt("s", 560, 830, 80);
    await line("s", ["Po chuj ja z tobą", "jechałem…"], 400, 60);
    talkAt("a", 1400, 720, 30);
    await line("a", ["Lód był!"], 500, -60, { rate: 1.3 });
    await line("r", ["Ha ha ha!", "Ale dachowanie!"], 900, -40, { rate: 1.3 });
    clearInterval(horn); hl.cancel(); kick.cancel(); wheels("scA", 0);

    // Artur wylazi z zaspy, stawia skuter i wsiada
    await fadeTo(() => {
      $("snowA").style.display = "none"; $("snowS").style.display = "none";
      scAt("scA", 900, 700); document.querySelectorAll("#scA .rider").forEach(r => r.style.display = "");
      $("sRide").style.display = "none";
      $("runS").style.display = "none";
    });
    const e2 = twoStroke(); e2.set(160, 0.08, 0.3); engR.set(160, 0.07, 0.3);
    await sleep(500);
    // oba na jednym kole
    const wheelie = (id) => anim($(id).querySelector(".tilt"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-28deg)" }], { duration: 500, easing: "ease-out" });
    $("scA").querySelector(".tilt").style.transformOrigin = "-130px 0px"; $("scR").querySelector(".tilt").style.transformOrigin = "-130px 0px";
    e2.set(280, 0.12, 0.3); engR.set(280, 0.1, 0.3);
    await Promise.all([wheelie("scA"), wheelie("scR")]);
    wheels("scA", 0.1); wheels("scR", 0.1);
    // ===== POSCIG: kamera jedzie za nimi, otoczenie rozmazane =====
    const rs = $("runS");
    const blurOn = on => ["bgFar", "bgNear", "roadMarks"].forEach(id => on ? $(id).setAttribute("filter", "url(#mblur)") : $(id).removeAttribute("filter"));
    forest(1); setSpeed(4); blurOn(true);
    const wind = noise(11, { freq: 700, q: 0.5, vol: 0.18, sweepTo: 1200 });
    const lines = setInterval(() => {
      for (let k = 0; k < 3; k++){
        const l = document.createElementNS(NS, "line"), y = 80 + Math.random() * 760, w = 150 + Math.random() * 300;
        l.setAttribute("x1", 1700); l.setAttribute("y1", y); l.setAttribute("x2", 1700 + w); l.setAttribute("y2", y);
        l.setAttribute("stroke", "#fff"); l.setAttribute("stroke-width", 3 + Math.random() * 4); l.setAttribute("stroke-linecap", "round"); l.setAttribute("opacity", "0.8");
        $("fx").append(l);
        l.animate([{ transform: "translateX(0)" }, { transform: `translateX(${-2200 - w}px)` }], { duration: 380 + Math.random() * 200, fill: "forwards" })
         .finished.then(() => l.remove()).catch(() => {});
      }
    }, 70);
    // skutery kolysza sie w kadrze (kamera za nimi)
    const posA = t => 1050 + Math.sin(t * 1.3) * 60, posR = t => 780 + Math.sin(t * 1.1 + 1) * 70;
    let tt = 0, raf, sx = 0;
    const exA2 = setInterval(() => puff(sc.scA.x - 215, sc.scA.y - 66, { r: 12, dur: 500, dx: -220, dy: -10, color: "#c9c9c9" }), 90);
    const exR2 = setInterval(() => puff(sc.scR.x - 215, sc.scR.y - 66, { r: 12, dur: 500, dx: -220, dy: -10, color: "#c9c9c9" }), 90);
    let exitA = 0, exitR = 0, sikX = -250;
    const frame = () => {
      tt += 0.016;
      const ax = posA(tt) + exitA, rx = posR(tt) + exitR;
      sc.scA.x = ax; sc.scR.x = rx;
      $("scA").style.transform = scT(ax, 700 + Math.sin(tt * 9) * 3); $("scR").style.transform = scT(rx, 700 + Math.sin(tt * 8 + 2) * 3);
      rs.style.transform = `translate(${sikX}px,770px)`; who.s.x = sikX;
      raf = requestAnimationFrame(frame);
    };
    frame();
    // Siket startuje z lewej, jeszcze normalnymi nogami
    rs.style.display = "";
    const o = { duration: 140, direction: "alternate", iterations: Infinity };
    const la = [rs.querySelector(".legL").animate([{ transform: "rotate(40deg)" }, { transform: "rotate(-40deg)" }], o),
                rs.querySelector(".legR").animate([{ transform: "rotate(-40deg)" }, { transform: "rotate(40deg)" }], o),
                rs.querySelector(".bob").animate([{ transform: "translateY(0) rotate(10deg)" }, { transform: "translateY(-14px) rotate(10deg)" }], o)];
    const tween = (from, to, ms, set, ease = t => t) => new Promise(res => { const t0 = performance.now();
      const st = now => { const k = Math.min(1, (now - t0) / ms); set(from + (to - from) * ease(k)); if (k < 1) requestAnimationFrame(st); else res(); }; requestAnimationFrame(st); });
    await tween(-250, 220, 1500, v => sikX = v);
    talkAt("s", 220, 690, 0);
    const cz = say("s", ["Czekajcie, kurwa!", "Czekajcie na mnie!"], 120);
    await tween(220, 300, 1800, v => { sikX = v; who.s.x = v; });
    unsay(await cz);
    // Strus Pedziwiatr
    la.forEach(a => a.cancel());
    rs.querySelectorAll(".legL, .legR").forEach(l => l.style.display = "none");
    const rr = rs.querySelector(".rr"); rr.style.display = "";
    const spinL = rr.querySelector(".rrSpin").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 70, iterations: Infinity });
    const lean = rs.querySelector(".bob").animate([{ transform: "rotate(24deg) translateY(0)" }, { transform: "rotate(24deg) translateY(-6px)" }], { duration: 50, direction: "alternate", iterations: Infinity });
    const meep = (t) => { const a = ac(), o2 = a.createOscillator(), g = a.createGain(); o2.type = "triangle";
      o2.frequency.setValueAtTime(1500, t); o2.frequency.exponentialRampToValueAtTime(1150, t + 0.12);
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14); o2.connect(g); g.connect(a.destination); o2.start(t); o2.stop(t + 0.16); };
    const dust = setInterval(() => puff(sikX - 40, 750, { r: 22 + Math.random() * 14, dur: 700, dx: -260, dy: -20, color: "#e8eef7" }), 50);
    const rrSound = setInterval(() => noise(0.04, { freq: 3200, q: 1, vol: 0.1 }), 40);
    setSpeed(6);
    // dogania Radka, jedzie leb w leb, dogania Artura
    await tween(300, 700, 1600, v => sikX = v, t => t * t);
    await sleep(900);
    await tween(700, 1000, 1400, v => sikX = v);
    talkAt("s", 1000, 690, 0);
    { const t = ac().currentTime; meep(t); meep(t + 0.2); }
    const pip = await say("s", ["PIP PIP!"], 0, { instant: true });
    await sleep(700); unsay(pip);
    // zostawia ich w kurzu
    noise(0.8, { freq: 800, q: 1, vol: 0.4, sweepTo: 4000 });
    await tween(1000, 2300, 700, v => sikX = v, t => t * t);
    await sleep(500);
    { const t = ac().currentTime; meep(t); meep(t + 0.2); }
    // skutery tez wypadaja z kadru
    await tween(0, 1400, 1800, v => { exitA = v; exitR = v * 1.1; }, t => t * t);
    cancelAnimationFrame(raf); clearInterval(lines); clearInterval(dust); clearInterval(rrSound); clearInterval(exA2); clearInterval(exR2);
    spinL.cancel(); lean.cancel(); rr.style.display = "none"; rs.style.display = "none";
    rs.querySelectorAll(".legL, .legR").forEach(l => l.style.display = "");
    blurOn(false); setSpeed(1.5);
    e2.stop(0.8); engR.stop(0.8);
    await sleep(1200); forest(0);
    await nightPart();
    await sleep(800);
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  async function playNight(){ reset(); ac(); $("startScreen").hidden = true; $("endScreen").hidden = true; await nightPart(); $("endScreen").hidden = false; $("againBtn").focus(); }
  const start = () => { unlockSpeech(); unlockClips(); location.hash === "#noc" ? playNight() : play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
