<script src="intro2.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scExt", "scShop", "scBack", "scVillage", "scCross"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    a: { el: "aSt", img: true, x: 300, y: 820, s: 1, head: 400, pitch: 170, vPitch: 0.8, vRate: 1.15 },
    r: { el: "rSt", img: true, x: 500, y: 820, s: 1, head: 400, pitch: 210, vPitch: 0.95, vRate: 1.05 },
    s: { el: "sSt", img: true, x: 700, y: 820, s: 1, head: 400, pitch: 90, vPitch: 0.2, vRate: 0.9 },
    k: { el: "kas", x: 1100, y: 880, s: 1, head: 380, pitch: 330, vPitch: 1.4, vRate: 1.1, mouthO: "kasMO", mouthC: "kasMC" }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  // nagrane kwestie (kierowca): odtwarzane wolniej i bez zachowania wysokosci = bardzo niski, gruby glos
  const CLIPS = {
    "Panowie, obejrzałem na jutubie potężny trening nóg.": { src: "glosy/nogi/01_laura.mp3", rate: 1 },
    "Dzisiaj robimy.": { src: "glosy/nogi/02_laura.mp3", rate: 1 },
    "U Sławka?": { src: "glosy/nogi/03_callum.mp3", rate: 1 },
    "A gdzie indziej.": { src: "glosy/nogi/04_charlie.mp3", rate: 1 },
    "Dzień dobry.": { src: "glosy/nogi/05_charlie.mp3", rate: 1 },
    "My na zaplecze.": { src: "glosy/nogi/06_laura.mp3", rate: 1 },
    "Patrzcie.": { src: "glosy/nogi/07_laura.mp3", rate: 1 },
    "Ile dajemy?": { src: "glosy/nogi/08_callum.mp3", rate: 1 },
    "Wszystko.": { src: "glosy/nogi/09_laura.mp3", rate: 1 },
    "Dawaj, kurwa!": { src: "glosy/nogi/10_charlie.mp3", rate: 1 },
    "Jeszcze jedno!": { src: "glosy/nogi/11_callum.mp3", rate: 1 },
    "Nie odpuszczaj!": { src: "glosy/nogi/12_laura.mp3", rate: 1 },
    "Jeden!": { src: "glosy/nogi/13_laura.mp3", rate: 1 },
    "Dwa!": { src: "glosy/nogi/14_laura.mp3", rate: 1 },
    "Trzy!": { src: "glosy/nogi/15_laura.mp3", rate: 1 },
    "…dziesięć!": { src: "glosy/nogi/16_laura.mp3", rate: 1 },
    "Dobra… starczy.": { src: "glosy/nogi/17_charlie.mp3", rate: 1 },
    "Kolan nie czuję…": { src: "glosy/nogi/18_charlie.mp3", rate: 1 },
    "Nogi mi się trzęsą…": { src: "glosy/nogi/19_laura.mp3", rate: 1 },
    "Ała… kolana…": { src: "glosy/nogi/20_charlie.mp3", rate: 1 },
    "Mnie dupa boli, jakby mnie koń kopnął.": { src: "glosy/nogi/21_callum.mp3", rate: 1 },
    "Ja nie wiem, czy ja dojdę do domu…": { src: "glosy/nogi/22_laura.mp3", rate: 1 },
    "Schodów jutro nie wejdę.": { src: "glosy/nogi/23_charlie.mp3", rate: 1 },
    "Ale zajebisty trening.": { src: "glosy/nogi/24_charlie.mp3", rate: 1 },
    "Zajebisty.": { src: "glosy/nogi/25_callum.mp3", rate: 1 },
    "To jutro…": { src: "glosy/nogi/26_laura.mp3", rate: 1 },
    "Robimy znowu nogi!": { src: "glosy/nogi/27_charlie.mp3", rate: 1 }
  };

  const DEEP = 0.55;
  const clipEls = {};   // tylko wczytanie z wyprzedzeniem, nigdy nie grane
  // 3 odtwarzacze na wszystkie kwestie; na starcie odblokowane krotka cisza (bez puszczania nagran)
  const SILENT = "data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQIAAACAgA==";
  const voices = [new Audio(), new Audio(), new Audio()];
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){ const a = new Audio(); a.preload = "auto"; a.src = src; clipEls[src] = a; }
    return { src, rate };
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(clipFor);
    voices.forEach(v => { v.src = SILENT; v.play().catch(() => {}); });
  }
  function playClip(c){
    const v = voices.find(x => x.paused || x.ended) || voices[0];
    return new Promise(res => {
      v.pause(); v.src = c.src; v.playbackRate = c.rate;
      v.preservesPitch = v.mozPreservesPitch = v.webkitPreservesPitch = c.rate === 1;
      const guard = setTimeout(res, 15000);
      v.onended = v.onerror = () => { clearTimeout(guard); res(); };
      v.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  // narysowane glowy bohaterow: usta otwieraja sie i zamykaja przy mowieniu
  function flap(w, on){
    const el = $(w.el), mC = el && el.querySelector(".mC"), mO = el && el.querySelector(".mO");
    if (!mO) return;
    clearInterval(w._flap);
    let open = false;
    const set = o => { mC.style.display = o ? "none" : ""; mO.style.display = o ? "" : "none";
      mO.style.transformBox = "fill-box"; mO.style.transformOrigin = "50% 0";
      mO.style.transform = o ? `scaleY(${0.55 + Math.random() * 0.5})` : ""; };
    if (on) w._flap = setInterval(() => set(open = !open), 110);
    else set(false);
  }
  function talking(k, on){
    const w = who[k];

  // ================= 2. sklep =================
  async function shop(){
    scene("scShop"); chew(true);
    ["aStW", "rStW", "sStW"].forEach(id => $("shopPeople").append($(id)));
    put("aSt", -100, 842, 0.62); put("rSt", -260, 842, 0.62); put("sSt", -420, 842, 0.62);
    tone(2600, 0.3, "sine", 0.06); setTimeout(() => tone(2000, 0.4, "sine", 0.05), 200);   // dzwonek przy drzwiach
    await Promise.all([walk("aSt", 760, 2600), walk("rSt", 600, 2600), walk("sSt", 440, 2600)]);
    await sleep(300);
    at("a", "aSt"); await L("a", "Dzień dobry.", 600);
    await sleep(1400);   // kasjerka tylko zuje
    at("s", "sSt"); await L("s", "My na zaplecze.", 900);
    await sleep(600);
    // za lade i na zaplecze
    await Promise.all([walk("aSt", 1330, 2400), walk("rSt", 1250, 2700), walk("sSt", 1170, 3000)]);
    await anim($("backDoor"), [{ transform: "scaleX(1)" }, { transform: "scaleX(0.1)" }], { duration: 400 });
    for (const id of ["aSt", "rSt", "sSt"]){ if (P[id].x < 1330) await walk(id, 1340, 400); await tween(300, k => { P[id].s = 0.62 - 0.05 * k; draw(id); }); hideP(id); }
    await anim($("backDoor"), [{ transform: "scaleX(0.1)" }, { transform: "scaleX(1)" }], { duration: 300 });
    noise(0.1, { freq: 500, q: 1, vol: 0.3 });
    await sleep(1600);
    chew(false);
    ["aStW", "rStW", "sStW"].forEach(id => $("fx").before($(id)));
  }

  // ================= 3. zaplecze: trening =================
  async function gym(){
    await fadeTo(() => { scene("scBack"); });
    put("aSt", 460, 862, 0.62); put("rSt", 880, 862, 0.62); put("sSt", 1320, 862, 0.62, -1);
    await sleep(400);
    // filmik na telefonie
    await armTo("sSt", -100, 250);
    at("s", "sSt"); await L("s", "Patrzcie.", 200);
    $("phone").style.display = "";
    const yg = $("ytGuy").animate([{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(50px) scaleY(0.8)" }], { duration: 400, direction: "alternate", iterations: 8 });
    $("ytBar").animate([{ width: "0px" }, { width: "760px" }], { duration: 3200, fill: "forwards" });
    for (let i = 0; i < 4; i++){ grunt(1.2); await sleep(800); }
    $("phone").style.display = "none"; yg.cancel();
    armTo("sSt", 0, 250);
    at("r", "rSt"); await L("r", "Ile dajemy?", 200);
    at("s", "sSt"); await L("s", "Wszystko.", 400);
    gymBeat(true);

    // --- przysiady ze sztanga: Andrzej ---
    await camTo(476, 600, 1.6, 600);
    $("bar").style.display = ""; plates(1); barAt(862 - 290 * 0.62);
    for (const [n, lab] of [[2, "20"], [4, "50"], [6, "100"]]){
      clank(); plates(n); pow(lab + " kg!", 476, 330, { size: 60, col: "#fff", hold: 300 }); await sleep(450);
    }
    red("aSt", 0.3);
    for (let r = 0; r < 4; r++){
      const bend = 18 + r * 6;
      grunt(0.9);
      await tween(450, k => { const sq = Math.sin(k * Math.PI); P.aSt.s = 0.62; draw("aSt");
        $("aStW").style.transform = `translate(${P.aSt.x}px,${P.aSt.y}px) scale(${0.62 * (1 + 0.12 * sq)},${0.62 * (1 - 0.3 * sq)})`;
        barAt(862 - 290 * 0.62 * (1 - 0.3 * sq), bend); });
      sweat("aSt", 3);
    }
    red("aSt", 0.55);
    at("a", "aSt"); const ba = await say("a", ["DAWAJ, KURWA!"], 0, { instant: true }); speak("Dawaj, kurwa!", who.a, { rate: 1.3 });
    shakeEl($("aStW"), 3, 50, 16); await sleep(900); unsay(ba);

    // --- suwnica: Triwet ---
    await camTo(940, 560, 1.4, 600);
    hideP("rSt");
    put("rSeat", 820, 800, 0.62, 1, -38);
    const sled = (d) => $("sled").setAttribute("transform", `translate(${925 - d * 0.75},${600 + d * 0.68})`);
    sled(0);
    clank(); $("sledBeer").style.display = ""; pow("+ TATRA", 1010, 140, { size: 50, col: "#ffd23f", hold: 300 }); await sleep(600);
    clank(); $("sledGrape").style.display = ""; pow("+ WINOGRONA", 1010, 200, { size: 50, col: "#c88aff", hold: 300 }); await sleep(600);
    red("rSeat", 0.35);
    for (let r = 0; r < 4; r++){
      grunt(1.1);
      await tween(500, k => sled(-60 * Math.sin(k * Math.PI)));
    }
    red("rSeat", 0.6);
    at("r", "rSeat"); spk("r", "rSeat", 800, 720, 220);
    const br = await say("r", ["Jeszcze jedno!"], 0, { instant: true }); speak("Jeszcze jedno!", who.r, { rate: 1.3 });
    shakeEl($("sled"), 4, 50, 14); await sleep(900); unsay(br);

    // --- prostowanie nog: SYKET ---
    await camTo(1330, 600, 1.5, 600);
    hideP("sSt"); put("sSeat", 1360, 770, 0.62, -1);
    red("sSeat", 0.3);
    const calf = $("sSeat").querySelector(".calf");
    for (let r = 0; r < 8; r++){
      await anim(calf, [{ transform: "rotate(0deg)" }, { transform: "rotate(-75deg)" }, { transform: "rotate(0deg)" }], { duration: 240 });
      clank(); if (r % 2) sweat("sSeat", 2);
    }
    red("sSeat", 0.6);
    spk("s", "sSeat", 1330, 770, 300);
    const bs = await say("s", ["NIE ODPUSZCZAJ!"], 0, { instant: true }); speak("Nie odpuszczaj!", who.s, { rate: 1.3 });
    for (let r = 0; r < 6; r++){ await anim(calf, [{ transform: "rotate(0deg)" }, { transform: "rotate(-80deg)" }, { transform: "rotate(0deg)" }], { duration: 120 }); clank(); }
    unsay(bs);

    // --- wykroki: wszyscy ---
    await camTo(800, 450, 1, 500);
    $("bar").style.display = "none"; hideP("rSeat"); hideP("sSeat");
    put("aSt", 420, 880, 0.62); put("rSt", 800, 880, 0.62); put("sSt", 1180, 880, 0.62);
    ["aSt", "rSt", "sSt"].forEach(id => red(id, 0.4, 10));
    const counts = ["Jeden!", "Dwa!", "Trzy!", "…dziesięć!"];
    for (let r = 0; r < 4; r++){
      const s = r % 2 ? 1 : -1;
      grunt(1);
      await Promise.all(["aSt", "rSt", "sSt"].map(id => legs(id, 30 * s, -30 * s, 220)));
      ["aSt", "rSt", "sSt"].forEach(id => { P[id].y = 920; draw(id); sweat(id, 2); });
      spk("s", "sSt", P.sSt.x, 880, 300);
      const bc = await say("s", [counts[r]], 0, { instant: true }); speak(counts[r], who.s, { rate: 1.4 });
      await sleep(350); unsay(bc);
      await Promise.all(["aSt", "rSt", "sSt"].map(id => legs(id, 0, 0, 200)));
      ["aSt", "rSt", "sSt"].forEach(id => { P[id].y = 880; draw(id); });
    }
    gymBeat(false);

    // --- uplyw czasu: zachod slonca ---
    pow("3 GODZINY PÓŹNIEJ…", 800, 120, { size: 64, col: "#fff", rot: 0, hold: 3000 });
    gymBeat(true);
    const pump = ["aSt", "rSt", "sSt"].map((id, i) => $(id).querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(60px)" }], { duration: 160 + i * 20, direction: "alternate", iterations: Infinity }));
    $("hrH").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(120deg)" }], { duration: 3500, fill: "forwards" });
    $("minH").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(1440deg)" }], { duration: 3500, fill: "forwards" });
    $("winSun").animate([{ cy: "160px", fill: "#ffe66b" }, { cy: "300px", fill: "#ff5a2a" }], { duration: 3500, fill: "forwards" });
    $("winSky").animate([{ fill: "#7cc4ff" }, { fill: "#ff8a3c" }, { fill: "#6a3a7e" }], { duration: 3500, fill: "forwards" });
    $("backDusk").animate([{ opacity: 0 }, { opacity: 0.25 }], { duration: 3500, fill: "forwards" });
    const cansT = setInterval(() => { const c = document.createElementNS(NS, "rect"); const k = $("cans").children.length;
      Object.entries({ x: 300 + (k % 6) * 22, y: 846 - Math.floor(k / 6) * 34, width: 20, height: 32, rx: 3, fill: "#2f7a3a", stroke: "#141414", "stroke-width": 2 }).forEach(([a, v]) => c.setAttribute(a, v)); $("cans").append(c); }, 180);
    for (let i = 0; i < 7; i++){ grunt(0.8 + Math.random() * 0.5); ["aSt", "rSt", "sSt"].forEach(id => sweat(id, 1)); await sleep(500); }
    clearInterval(cansT); pump.forEach(a => a.cancel()); gymBeat(false);
    await sleep(500);
    at("a", "aSt"); await L("a", "Dobra… starczy.", 600);
  }

  // ================= 4. wyjscie (zachod slonca) =================
  async function leave(){
    await fadeTo(() => { scene("scExt"); $("extDusk").style.opacity = 0.38; $("extSky").setAttribute("fill", "#e8875a"); });
    await sleep(400);
    tone(300, 0.6, "sawtooth", 0.02, 200);
    await anim($("door"), [{ transform: "scaleX(1)" }, { transform: "scaleX(0.1)" }], { duration: 500 });
    // Andrzej na kolanach
    put("aSt", 1145, 812, 0.38); legs("aSt", 85, 85);
    await tween(900, k => { P.aSt.y = 812 + 30 * k + 12 * Math.abs(Math.sin(k * 9)); P.aSt.s = 0.38 + 0.04 * k; draw("aSt"); });
    await tween(1600, k => { P.aSt.x = 1145 - 500 * k; P.aSt.y = 842 + 44 * k - 6 * Math.abs(Math.sin(k * 20)); draw("aSt"); });
    at("a", "aSt"); await L("a", "Kolan nie czuję…", 300);
    // Triwet sie przewraca
    put("rSt", 1145, 812, 0.38);
    await tween(700, k => { P.rSt.y = 812 + 74 * k; P.rSt.s = 0.38 + 0.04 * k; draw("rSt"); });
    await walk("rSt", 1000, 500);
    await tween(400, k => { P.rSt.r = -90 * k * k; P.rSt.y = 886 - 22 * k; draw("rSt"); });
    thud(); shake(10, 300); pow("ŁUP!", 900, 760, { size: 90, col: "#ffb13b" });
    await sleep(700);
    // SYKET - nogi jak galareta
    put("sSt", 1145, 812, 0.38);
    const jelly = ["legL", "legR"].map((c, i) => $("sSt").querySelector("." + c).animate([{ transform: "rotate(-14deg) scaleY(0.9)" }, { transform: "rotate(14deg) scaleY(1.05)" }], { duration: 70 + i * 15, direction: "alternate", iterations: Infinity }));
    const jb = setInterval(blub, 140);
    await tween(900, k => { P.sSt.y = 812 + 74 * k; P.sSt.s = 0.38 + 0.04 * k; draw("sSt"); });
    await tween(1400, k => { P.sSt.x = 1145 - 300 * k; draw("sSt"); });
    clearInterval(jb); jelly.forEach(a => a.cancel());
    at("s", "sSt"); await L("s", "Nogi mi się trzęsą…", 300);
    await sleep(300);
  }

  // ================= 5. przez wies =================
  async function village(){
    await fadeTo(() => { scene("scVillage"); });
    put("aSt", 300, 840, 0.6); legs("aSt", 85, 85); P.aSt.y = 900; draw("aSt");
    put("rSt", 620, 840, 0.6); P.rSt.r = 18; draw("rSt");
    put("sSt", 900, 840, 0.6);
    const sc0 = -1400;
    const jelly = ["legL", "legR"].map((c, i) => $("sSt").querySelector("." + c).animate([{ transform: "rotate(-14deg) scaleY(0.9)" }, { transform: "rotate(14deg) scaleY(1.05)" }], { duration: 70 + i * 15, direction: "alternate", iterations: Infinity }));
    const limp = $("rSt").querySelector(".bob").animate([{ transform: "translateY(0) rotate(0deg)" }, { transform: "translateY(16px) rotate(-6deg)" }], { duration: 420, direction: "alternate", iterations: Infinity });
    const knee = $("aSt").querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-12px)" }], { duration: 200, direction: "alternate", iterations: Infinity });
    let run = true; const t0 = performance.now();
    (function st(){ if (!run) return; const t = (performance.now() - t0) / 1000;
      $("street").style.transform = `translateX(${sc0 - t * 60}px)`; if (Math.random() < 0.08) blub(); requestAnimationFrame(st); })();
    await sleep(600);
    at("a", "aSt"); await L("a", "Ała… kolana…", 200);
    at("r", "rSt"); await L("r", ["Mnie dupa boli,", "jakby mnie koń kopnął."], 200);
    at("s", "sSt"); await L("s", "Ja nie wiem, czy ja dojdę do domu…", 300);
    at("a", "aSt"); await L("a", "Schodów jutro nie wejdę.", 300);
    run = false; jelly.forEach(a => a.cancel()); limp.cancel(); knee.cancel();
  }

  // ================= 6. skrzyzowanie =================
  async function cross(){
    await fadeTo(() => { scene("scCross"); });
    put("aSt", 560, 820, 0.62); legs("aSt", 85, 85); P.aSt.y = 880; draw("aSt");
    put("rSt", 800, 830, 0.62); P.rSt.r = 15; draw("rSt");
    put("sSt", 1040, 830, 0.62, -1);
    const jelly = ["legL", "legR"].map((c, i) => $("sSt").querySelector("." + c).animate([{ transform: "rotate(-10deg)" }, { transform: "rotate(10deg)" }], { duration: 80 + i * 15, direction: "alternate", iterations: Infinity }));
    await sleep(700);
    at("a", "aSt"); await L("a", "Ale zajebisty trening.", 300);
    at("r", "rSt"); await L("r", "Zajebisty.", 300);
    at("s", "sSt"); await L("s", "To jutro…", 200);
    // wszyscy razem
    pow("…ROBIMY ZNOWU NOGI!", 800, 330, { size: 96, col: "#ffd23f", rot: -4, hold: 2000 });
    speak("Robimy znowu nogi!", who.a, { rate: 1.2 }); speak("Robimy znowu nogi!", who.s, { rate: 1.2 });
    ["aSt", "rSt", "sSt"].forEach(id => $(id).querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-30px)" }, { transform: "translateY(0)" }], { duration: 300, iterations: 2 }));
    await sleep(2400);
    // rozchodza sie
    P.aSt.f = -1; draw("aSt"); P.sSt.f = 1; draw("sSt");
    await Promise.all([
      tween(3000, k => { P.aSt.x = 560 - 700 * k; P.aSt.y = 880 - 6 * Math.abs(Math.sin(k * 30)); draw("aSt"); }),
      tween(3000, k => { P.rSt.r = 15 + 75 * Math.min(1, k * 4); P.rSt.y = 830 - 330 * k; P.rSt.s = 0.62 - 0.4 * k; draw("rSt"); }),
      tween(3000, k => { P.sSt.x = 1040 + 700 * k; draw("sSt"); if (Math.random() < 0.1) blub(); })
    ]);
    jelly.forEach(a => a.cancel());
    $("fade").style.opacity = 1;
    await sleep(500);
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    const h = location.hash;
    if (!h) await ziomkiIntro2("POTĘŻNY TRENING NÓG", 12, 3, 1);
    if (!h || h === "#sklep") { await arrive(); await shop(); }
    if (!h || h === "#sklep" || h === "#trening") await gym();
    await leave(); await village(); await cross();
    if (!h) await ziomkiOutro();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
