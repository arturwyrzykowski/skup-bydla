<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    stomp(){ tone(150, 0.3, "sine", 0.55, 38); noise(0.14, { freq: 320, type: "lowpass", vol: 0.3 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    horn(){ tone(415, 0.5, "square", 0.05); tone(523, 0.5, "square", 0.04); },
    moo(){ tone(170, 1.0, "sawtooth", 0.06, 105); },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const truckT = x => `translate(${x}px,448px)`;
  const drvT = (x, y) => `translate(${x}px,${y}px) scale(0.85)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }

  let wheelAnims = [];
  function spinWheels(dir, period = 0.5){
    wheelAnims.forEach(a => a.cancel()); wheelAnims = [];
    if (!dir) return;
    document.querySelectorAll("#truck .tw").forEach(w => wheelAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${dir * 360}deg)` }],
                { duration: period * 1000, iterations: Infinity })));
  }

  let walkAnims = [];
  function walk(on, step = 0.45){
    walkAnims.forEach(a => a.cancel()); walkAnims = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    const swing = (id, a) => walkAnims.push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
    swing("dLegL", 24); swing("dLegR", -24); swing("dArmL", -20); swing("dArmR", 20);
  }

  async function stomp(big){
    const leg = $("fLegR");
    await anim(leg, [{ transform: "rotate(0deg)" }, { transform: "rotate(-38deg)" }], { duration: 230, easing: "ease-out" });
    await anim(leg, [{ transform: "rotate(-38deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(0deg)" }], { duration: 120, easing: "ease-in" });
    sfx.stomp();
    puff(510, 800, { r: 16, dur: 700, dx: 40, dy: -30, color: "#b09a6c" });
    puff(490, 800, { r: 16, dur: 700, dx: -40, dy: -30, color: "#b09a6c" });
    if (big) anim($("world"), [
      { transform: "translate(0,0)" }, { transform: "translate(-14px,8px)" }, { transform: "translate(12px,-6px)" },
      { transform: "translate(-8px,4px)" }, { transform: "translate(0,0)" }], { duration: 380 });
  }

  // dymek: czubek ogonka w (tipX, tipY), linie tekstu, przesuniecie w bok
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  const who = {
    f: { tip: [500, 330], pitch: 150, mouthO: "fMouthO", mouthC: "fMouthC", vPitch: 0.55, vRate: 0.95 },
    d: { tip: null,       pitch: 270, mouthO: "dMouthO", mouthC: "dMouthC", vPitch: 1.45, vRate: 1.15 }
  };
  let driverX = 990;

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  // iOS/Safari: pierwsze speak() musi pasc w gescie klikniecia
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  function speak(text, w, { pitch, rate } = {}){
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){
    const w = who[k], [tx, ty] = k === "d" ? [driverX, 410] : w.tip;
    const b = makeBubble(tx, ty, lines, shift);
    await anim(b.g, [{ transform: `translate(${tx}px,${ty}px) scale(0)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }],
               { duration: 200, easing: "cubic-bezier(.3,1.6,.6,1)" });
    if (instant){ b.spans.forEach((s, i) => s.textContent = lines[i]); return b; }
    let open = false;
    const talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    const spoken = speak(lines.join(" "), w, { pitch, rate });
    for (let i = 0; i < lines.length; i++){
      for (const ch of lines[i]){
        b.spans[i].textContent += ch;
        if (ch !== " " && !spoken) sfx.voice(w.pitch);
        await sleep(spoken ? 45 : 58);
      }
    }
    if (spoken) await spoken;
    clearInterval(talk);
    $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = "";
    return b;
  }
  async function unsay(b){
    await anim(b.g, [{ transform: `translate(${b.tipX}px,${b.tipY}px) scale(1)` }, { transform: `translate(${b.tipX}px,${b.tipY}px) scale(0)` }], { duration: 150 });
    b.g.remove();
  }

  let tractorSmoke = null;
  function reset(){
    if (tts) tts.cancel();
    document.getAnimations().forEach(a => a.cancel());
    wheelAnims = []; walkAnims = [];
    clearInterval(tractorSmoke);
    $("bubbles").innerHTML = ""; $("fx").innerHTML = "";
    $("truck").style.transform = truckT(1750);
    $("cabDoor").style.transform = "";
    $("drvCab").style.display = "";
    driverX = 990;
    $("driver").style.display = "none"; $("driver").style.transform = drvT(driverX, 800);
    $("fArmDown").style.display = ""; $("fArmUp").style.display = "none";
    $("fFace").style.fill = "";
    ["fMouthO", "dMouthO"].forEach(id => $(id).style.display = "none");
    ["fMouthC", "dMouthC"].forEach(id => $(id).style.display = "");
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    tractorSmoke = setInterval(() => puff(692, 440, { r: 14, dur: 1400, dx: -30, dy: -70, color: "#9a9a9a" }), 700);

    // rolnik oparty o widly, tupie z nudow
    await sleep(600); await stomp();
    await sleep(700);

    // wjazd TIRa
    const eng = engine(); eng.set(72, 0.09, 0.2);
    spinWheels(-1, 0.45);
    const arrive = anim($("truck"), [{ transform: truckT(1750) }, { transform: truckT(860) }], { duration: 4200, easing: "cubic-bezier(.2,.7,.35,1)" });
    await sleep(1600); stomp();
    await arrive;
    spinWheels(0); sfx.brake(); eng.set(40, 0.04, 0.6);
    await sleep(400); sfx.moo();
    await sleep(900);

    // kierowca wysiada
    sfx.door();
    await anim($("cabDoor"), [{ transform: "scaleX(1)" }, { transform: "scaleX(0.12)" }], { duration: 250 });
    $("drvCab").style.display = "none";
    $("driver").style.display = "";
    await anim($("driver"), [{ transform: drvT(1010, 740) }, { transform: drvT(1000, 700) }, { transform: drvT(990, 800) }], { duration: 450, easing: "ease-in" });
    eng.stop(0.6);
    walk(true, 0.42);
    await anim($("driver"), [{ transform: drvT(990, 800) }, { transform: drvT(820, 800) }], { duration: 1700, easing: "linear" });
    driverX = 820; walk(false);
    await sleep(500);

    // rozmowa
    const b1 = await say("f", ["Panie, dasz mi", "dobrą cenę?"]);
    await sleep(1600); await unsay(b1); await sleep(300);
    const b2 = await say("d", ["Dam, ale jebnę cię", "na kilogramach."], 90);
    await sleep(2200); await unsay(b2); await sleep(300);

    // rolnik podnosi widly
    $("fArmDown").style.display = "none"; $("fArmUp").style.display = "";
    $("fFace").style.fill = "#f08a70";
    anim($("fArmUp"), [{ transform: "translateY(40px)" }, { transform: "translateY(-18px)" }, { transform: "translateY(0)" }], { duration: 300 });
    const b3 = await say("f", ["Spierdalaj mi stąd,", "ale już!"], -190, { pitch: 0.4, rate: 1.2 });
    await sleep(350);
    await stomp(true);
    await sleep(300);
    await unsay(b3);

    // kierowca w nogi
    const b4 = await say("d", ["!!!"], 0, { instant: true });
    await anim($("driver"), [{ transform: drvT(820, 800) }, { transform: drvT(820, 730) }, { transform: drvT(820, 800) }], { duration: 320 });
    unsay(b4);
    walk(true, 0.2);
    await anim($("driver"), [{ transform: drvT(820, 800) }, { transform: drvT(1000, 800) }], { duration: 650, easing: "ease-in" });
    walk(false);
    $("driver").style.display = "none"; $("drvCab").style.display = "";
    sfx.door();
    await anim($("cabDoor"), [{ transform: "scaleX(0.12)" }, { transform: "scaleX(1)" }], { duration: 200 });

    // pisk opon i odjazd
    const eng2 = engine(); eng2.set(100, 0.12, 0.2);
    sfx.screech(); spinWheels(1, 0.1);
    const smoke = setInterval(() => {
      [930, 1045, 1500, 1605].forEach(x => puff(x + Math.random() * 30, 795, { r: 28, dur: 1300, dx: -60 - Math.random() * 60, dy: -60 - Math.random() * 40 }));
    }, 110);
    await sleep(450);
    sfx.horn();
    await anim($("truck"), [{ transform: truckT(860) }, { transform: truckT(2050) }], { duration: 2000, easing: "cubic-bezier(.5,0,.8,.4)" });
    clearInterval(smoke); eng2.stop(0.3); spinWheels(0);

    // rolnik opuszcza widly
    await sleep(600);
    $("fArmUp").style.display = "none"; $("fArmDown").style.display = ""; $("fFace").style.fill = "";
    await stomp();
    await sleep(1400);
    clearInterval(tractorSmoke);
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
