<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});

  // ---------- dzwiek (generowany) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  let master = null;
  function out(){ const a = ac(); if (!master){ master = a.createGain(); master.gain.value = 0.9; master.connect(a.destination); } return master; }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo, when = 0){
    const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out()); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(dur, { freq = 1000, q = 1, type = "bandpass", vol = 0.2, sweepTo, when = 0 } = {}){
    const a = ac(), t = a.currentTime + when;
    if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out()); s.start(t); s.stop(t + dur + 0.02);
  }

  // ---------- glosy: nagrania ElevenLabs (CLIPS wypelnia dubbing.py) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  const CLIPS = {};

  const DEEP = 1;
  const clipEls = {};   // tylko wczytanie z wyprzedzeniem, nigdy nie grane
  // 3 odtwarzacze na wszystkie kwestie; na starcie odblokowane krotka cisza (bez puszczania nagran)
  const SILENT = "data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQIAAACAgA==";
  const voices = [new Audio(), new Audio(), new Audio()];
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){ const a = new Audio(); a.preload = "auto"; a.src = src; clipEls[src] = a; }
    return { src, rate };
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(clipFor);
    voices.forEach(v => { v.src = SILENT; v.play().catch(() => {}); });
  }
  let lastVoice = null;
  function playClip(c){
    const v = voices.find(x => x.paused || x.ended) || voices[0];
    lastVoice = v;
    return new Promise(res => {
      v.pause(); v.src = c.src; v.playbackRate = c.rate;
      v.preservesPitch = v.mozPreservesPitch = v.webkitPreservesPitch = c.rate === 1;
      const guard = setTimeout(res, 15000);
      v.onended = v.onerror = () => { clearTimeout(guard); res(); };
      v.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // ---------- mowienie: usta (.mC/.mO) w aktualnie widocznym egzemplarzu postaci ----------
  // who[k].el = id grupy postaci w biezacym ujeciu (zmieniane przez line(..., el))
  function flap(w, on){
    const el = $(w.el), mC = el && el.querySelector(".mC"), mO = el && el.querySelector(".mO");
    if (!mO) return;
    clearInterval(w._flap);
    let open = false;
    const set = o => { mC.style.display = o ? "none" : ""; mO.style.display = o ? "" : "none";
      mO.style.transformBox = "fill-box"; mO.style.transformOrigin = "50% 0";
      mO.style.transform = o ? `scaleY(${0.55 + Math.random() * 0.5})` : ""; };
    if (on) w._flap = setInterval(() => set(open = !open), 110);
    else set(false);
  }
  function talking(k, on){
    const w = who[k], bob = $(w.el) && $(w.el).querySelector(".bob");
    if (bob){
      if (on) w._talk = bob.animate([{ transform: "translateY(0)" }, { transform: "translateY(-5px)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
    }
    flap(w, on);
  }
  // kwestia bez dymka: glos + usta, potem pauza `hold`
  async function line(k, text, hold = 500, el){
    const w = who[k];
    if (el) w.el = el;
    talking(k, true);
    const spoken = speak(text, w);
    if (spoken) await spoken; else await sleep(600 + text.length * 55);
    talking(k, false);
    await sleep(hold);
  }

  // ===== DZWIEKI =====
  const sfx = {
    chapter(){ tone(55, 1.2, "sine", 0.6, 35); noise(0.5, { freq: 200, type: "lowpass", vol: 0.3 }); },
    glitch(){ tone(200 + Math.random() * 1800, 0.06, "square", 0.05); },
    krok(){ noise(0.12, { freq: 900 + Math.random() * 400, q: 0.8, vol: 0.22 }); },
    skrzyp(){ tone(420, 0.9, "sawtooth", 0.025, 680); tone(300, 0.9, "triangle", 0.03, 520); },
    pies(){ [0, 0.28].forEach(w => { tone(520, 0.12, "sawtooth", 0.04, 300, w); noise(0.1, { freq: 900, vol: 0.08, when: w }); }); },
    lyk(){ tone(180, 0.18, "sine", 0.25, 90); },
    kieliszek(){ tone(2400, 0.25, "sine", 0.06); tone(3100, 0.2, "sine", 0.03); },
    zapalka(){ noise(0.25, { freq: 3500, q: 1, vol: 0.2, sweepTo: 1200 }); },
    tlumik(){ noise(0.22, { freq: 400, type: "lowpass", vol: 0.9, sweepTo: 90 }); tone(70, 0.25, "sine", 0.6, 35); },
    // stek bolu (zenski) + dziwaczne uderzenie
    steknij(){ const a = ac(); [0, 0.05].forEach((w, i) => tone(i ? 310 : 260, 0.55, "sawtooth", 0.05, 170, w)); noise(0.5, { freq: 900, q: 4, vol: 0.12 }); },
    dziwne(){ tone(900, 0.7, "sine", 0.3, 70); tone(1400, 0.9, "triangle", 0.08, 2600); noise(0.15, { freq: 300, type: "lowpass", vol: 0.8 });
      [0.1, 0.22, 0.34].forEach(w => tone(160, 0.12, "square", 0.08, 120, w)); },
    // kruche pekniecie kosci: seria ostrych trzaskow + gluche uderzenie
    chrup(){ [0, .03, .07, .1, .16].forEach((w, i) => noise(.05 + i * .01, { freq: 2500 + Math.random() * 3000, q: 6, vol: .5, when: w }));
      tone(1800, .08, "square", .12, 400); tone(120, .25, "sine", .6, 50); noise(.2, { freq: 300, type: "lowpass", vol: .5 }); },
    siku(ms = 2600){ noise(ms / 1000, { freq: 3200, q: 2, vol: 0.12 }); },
    prrrt(){ const a = ac(), t = a.currentTime, o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), g = a.createGain();

  // ---------- 5. oboz harcerski ----------
  const HARC = [...document.querySelectorAll("#shOboz .dzieciak")].map(d => d.id.replace(/P$/, "W"));

  async function partOboz(){
    shot("shOboz", { x: 1300, y: 500, k: .6 });

    $("flaga").animate([{ transform: "skewY(0deg) scaleX(1)" }, { transform: "skewY(4deg) scaleX(.94)" }], { duration: 500, direction: "alternate", iterations: Infinity });
    [5, 7, 8].forEach(i => $(`hk${i}P`).querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-40px)" }], { duration: 650, direction: "alternate", iterations: Infinity, delay: i * 90 }));

    await caption("Obóz harcerski. Łąka nad rzeką.", 2000);

    wheels(kola("shOboz"), true, 800);
    camTo({ x: 700, y: 520, k: .8 }, 4500);
    await move("trObW", 1250, 780, 6000, "ease-out");
    wheels(kola("shOboz"), false); eng.set(.7);
    // opiekun gwizdze i podchodzi
    await camTo({ x: 800, y: 560, k: 1.1 }, 700);
    gwizdek(); await sleep(700);
    await walkTo("oObP", "oObW", 1060, 2200);
    await camTo({ x: 1160, y: 520, k: 2.0 }, 600);
    await line("o", "Czuwaj! Chłopaki, bardzo dziękujemy za pomoc!", 300, "oObP");

    await line("r", "Robi się, druhu.", 300, "obRP");
    // wajcha na R i cofanie do wanny

    shot("shOboz", { x: 800, y: 540, k: 1.05 });
    face("oObW", -1);
    walkTo("oObP", "oObW", 150, 2400);
    eng.set(1.2); wheels(kola("shOboz"), true, 800, -1);
    await move("trObW", 1005, 780, 3200, "ease-in-out");
    wheels(kola("shOboz"), false); eng.set(.7);
    face("oObW", 1);
    // nalewanie
    $("wazOb").setAttribute("d", "M645 705 Q610 630 545 640 Q506 646 498 660");
    $("strumien").setAttribute("d", "M498 660 Q494 672 492 682");
    show("wazOb"); sfx.drzwi();
    await camTo({ x: 520, y: 600, k: 1.9 }, 800);
    show("strumien"); const la = keep(lanie());
    $("strumien").animate([{ strokeWidth: 10 }, { strokeWidth: 15 }], { duration: 120, direction: "alternate", iterations: Infinity });
    await tween(2600, k => $("wannaWoda").setAttribute("opacity", .95 * k));
    la(); stops.pop(); show("strumien", false);
    // smrod

    show("muOb"); const bz = keep(bzz());
    await sleep(1200);
    await camTo({ x: 600, y: 540, k: 1.4 }, 600);
    await line("o", "Panowie… a co tu tak śmierdzi?", 300, "oObP");
    await camTo({ x: 980, y: 520, k: 2.2 }, 500);
    await line("r", "To minerały tak pachną. Woda z siedemdziesięciu metrów pod ziemią. Najzdrowsza.", 200, "obRP");
    await line("s", "Siarka. Na wszystko pomaga.", 400, "obSP");
    await camTo({ x: 400, y: 560, k: 1.6 }, 500);

      face(h, pos[h].x > x ? -1 : 1); walk(pidOf(h), true);
      await move(h, x, 830 + (i % 2) * 6, 1200 + Math.abs(pos[h].x - x) * .9);

    // mycie twarzy: pierwszy w kolejce nachyla sie nad wanna

    $("wazOb").style.display = "none";
    eng.set(1.4); wheels(kola("shOboz"), true, 700);
    camTo({ x: 1600, y: 520, k: .9 }, 3000);
    klakson();
    await move("trObW", 3300, 780, 4200, "ease-in");
    await fadeOut(500); stopAll();
    wheels(kola("shOboz"), false);
  }

  // napis koncowy
  async function credit(){
    $("chNr").textContent = ""; $("chTitle").textContent = "SiKet produkcja";
    $("chapter").style.display = "";
    await anim($("chapter"), [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
    await sleep(2800);
    await anim($("chapter"), [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    $("chapter").style.display = "none";
  }

  async function play(){
    $("startScreen").hidden = true; $("endScreen").hidden = true; ac();
    stopAll();
    $("fade").style.opacity = 1;
    const h = location.hash;
    if (!h) { $("fade").style.opacity = 0; await ziomkiIntro2("WODA MINERALNA", 24, 3, 1); $("fade").style.opacity = 1; }
    const parts = [["#telefon", partTelefon], ["#podworko", partPodworko], ["#rzeka", partRzeka], ["#las", partLas], ["#oboz", partOboz], ["#droga", partDroga], ["#rano", partRano]];
    let on = !h || h === "#x";
    for (const [id, fn] of parts){ if (id === h) on = true; if (on) await fn(); }
    if (!h) await ziomkiOutro();
    if (!h || h === "#x" || h === "#napis") await credit();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
