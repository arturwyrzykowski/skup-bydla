<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HejczBiOł Go</title>
<style>
  :root { --bg: #0d0716; --bg2: #1b0f2e; --card: #22143a; --txt: #f4eefc; --mut: #b9a8d6; --acc: #9b5cff; --acc2: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 32px; background: linear-gradient(180deg, #000 0%, transparent 100%); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(6px); }
  .logo { font-weight: 900; font-size: 34px; letter-spacing: -1px; }
  .logo b { background: var(--acc); color: #fff; border-radius: 10px; padding: 2px 10px; margin-left: 6px; font-size: 26px; vertical-align: 4px; }
  .logo i { font-style: normal; color: var(--acc2); }
  header nav { margin-left: auto; color: var(--mut); font-size: 15px; }
  .hero { position: relative; min-height: 62vh; display: flex; align-items: flex-end; padding: 0 32px 48px; overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.55); z-index: 0; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, transparent 55%), linear-gradient(90deg, rgba(13,7,22,.9) 0%, transparent 60%); z-index: 1; }
  .hero .info { position: relative; z-index: 2; max-width: 640px; }
  .tag { display: inline-block; background: var(--acc2); color: #000; font-weight: 800; font-size: 13px; border-radius: 6px; padding: 3px 8px; letter-spacing: .5px; }
  .hero h1 { font-size: clamp(34px, 6vw, 64px); margin: 12px 0 8px; line-height: 1; }
  .hero p { color: var(--mut); font-size: 18px; line-height: 1.45; margin: 0 0 20px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #000; font-weight: 800; font-size: 20px; padding: 14px 28px; border-radius: 12px; }
  .btn:focus-visible, .card:focus-visible { outline: 5px solid var(--acc2); outline-offset: 4px; }
  section { padding: 10px 32px 26px; }
  h2 { font-size: 22px; margin: 18px 0 14px; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .card { display: block; background: var(--card); border-radius: 14px; overflow: hidden; transition: transform .15s; }
  .card:hover, .card:focus-visible { transform: scale(1.04); }
  .card .th { position: relative; aspect-ratio: 16/9; background: #000; }
  .card .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .nr { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.75); border-radius: 6px; padding: 2px 8px; font-weight: 800; font-size: 14px; }
  .card .new { position: absolute; right: 10px; top: 10px; background: var(--acc); border-radius: 6px; padding: 2px 8px; font-weight: 800; font-size: 13px; }
  .card .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 46px; opacity: 0; transition: opacity .15s; text-shadow: 0 2px 10px #000; }
  .card:hover .play, .card:focus-visible .play { opacity: 1; }
  .card .tx { padding: 12px 14px 16px; }
  .card h3 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--mut); font-size: 14px; line-height: 1.4; }
  footer { color: var(--mut); text-align: center; padding: 30px 16px 40px; font-size: 14px; }
  @media (max-width: 600px){ header, .hero, section { padding-left: 16px; padding-right: 16px; } header nav { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">Hejcz<i>BiOł</i><b>Go</b></div>
  <nav>Seria: ZIOMKI · 15 odcinków</nav>
</header>

<div class="hero" id="hero"></div>

<section>
  <h2>Sezon 2 — Andrzej, Triwet i SYKET</h2>
  <div class="row" id="s2"></div>
</section>
<section>
  <h2>Sezon 1</h2>
  <div class="row" id="s1"></div>
</section>
<footer>Tab — przejście między odcinkami · Enter — oglądaj</footer>

<script>
  const EPS = [
    [1, "index", "Skup Bydła", "Wjeżdża TIR „SKUP BYDŁA”, a rolnik z widłami nie da się zrobić na kilogramach."],
    [2, "niewybuch", "Niewybuch", "Saperzy wykopują bombę, wiozą ją busem na złom do Obrytego. Kończy się grzybem."],
    [3, "koparka", "Mokre Pole", "Koparka CAT zakopana w błocie i ubijacz, który dyryguje łyżkami. Siket nagrywa."],
    [4, "duch", "Duch na błoniach", "25 lat temu, nocą przy cmentarzu, na składaku WIGRY. Spierdalamy!"],
    [5, "bomba", "W pani domu jest bomba", "Bomba z budowy, Polonez BUDOMUR, telefon na 997 i petarda pod milicją."],
    [6, "zima", "Zima na wsi", "Śnieżki w okna, ucieczka, żul z siekierą i FIFA 06 na koniec nocy."],
    [7, "garaz", "Garaż", "Każdy chce garaż w innym miejscu. Rolnik ma inne zdanie."],
    [8, "skuter", "Dachowanie", "Skutery na lodzie, pościg na jednym kole i maluch na słupie."],
    [9, "ogar", "Ogar", "Radek pali gumę na Romecie Ogarze, a zza bramy wyjeżdża Polonez."],
    [10, "naprawa", "Naprawa Ogara", "Drewniany tłok z dębu, bączki na wsi i właściciel, który pyta, czy już naprawiony."],
    [11, "narew", "Skuterowy test zaufania", "Nad Narwią z blondynkami. „Co może pójść nie tak?” — wszystko. PUF!"],
    [12, "nogi", "Potężny trening nóg", "Zaplecze Sklepu u Sławka, atlas między skrzynkami Tatry i powrót na kolanach."],
    [13, "bizon", "Naprawa Bizona", "Urwany wałek w kombajnie, spawanie na stole, sakramencki błysk i rolnik: trzeba wyjąć silnik."],
    [14, "smugi", "Na smugach", "Piwko pod Bizonem, przyjazd Punto WWL SYKET, liść, bagażnik i powrót do domu: we trzech, kurwa, kozaki."],
    [15, "rzasnik", "Podryw w Rząśniku", "Pablo i Triwet jadą Hondą na podryw. Czarne BMW, trzech napakowanych i ucieczka w bloki. Morał: trzeba szybko biegać."],
    [17, "biwak", "Biwak", "Andrzej i Triwet jadą Ogarem z dziurawym bakiem na biwak ósmej be — przez trzy wsie i pola, dolewając po drodze. W nocy Ogar odpala się sam."],
    [18, "miruna", "Morska miruna", "Ekipa Underground Passion nocą nad Narwią łowi ryby na prąd. Ruski Salut, guma od majtek, SYKETA jebnął prąd, straż wędkarska, a rano na targu morskie miruny."]
  ];
  const card = ([n, f, t, d]) => `<a class="card" href="${f}.html">
      <div class="th"><img src="miniatury/${f}.jpg" alt="" loading="lazy"><span class="nr">Odc. ${n}</span>${n === EPS[EPS.length - 1][0] ? '<span class="new">NOWOŚĆ</span>' : ''}<span class="play">▶</span></div>
      <div class="tx"><h3>${t}</h3><p>${d}</p></div></a>`;
  document.getElementById("s2").innerHTML = EPS.filter(e => e[0] >= 11).reverse().map(card).join("");
  document.getElementById("s1").innerHTML = EPS.filter(e => e[0] <= 10).map(card).join("");
  const latest = EPS[EPS.length - 1];
  document.getElementById("hero").innerHTML = `<img src="miniatury/${latest[1]}.jpg" alt="">
    <div class="info"><span class="tag">NAJNOWSZY ODCINEK · ${latest[0]}</span><h1>${latest[2]}</h1><p>${latest[3]}</p>
    <a class="btn" href="${latest[1]}.html" autofocus>▶ Oglądaj</a></div>`;
  document.querySelector(".hero .btn").focus();
</script>
</body>
</html>
