    color:#000; background:#ffd23f; border:4px solid #000; border-radius:14px;
    box-shadow:5px 5px 0 #000; cursor:pointer; }

  [hidden] { display:none !important; }

<script src="intro2.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scAlma", "scRoad", "scStation", "scUrzad", "scBlok", "scFlat"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    p:  { el: "pablo", x: 0, y: 0, s: 1, head: 300, pitch: 200, vPitch: 1.0, vRate: 1.2, mouthO: "pabloMouthO", mouthC: "pabloMouthC" },
    r:  { el: "rSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 210, vPitch: 0.95, vRate: 1.2 },
    g1: { el: "g1St", x: 0, y: 0, s: 1, head: 300, pitch: 330, vPitch: 1.45, vRate: 1.15, mouthO: "g1StMO", mouthC: "g1StMC" },
    g2: { el: "g2St", x: 0, y: 0, s: 1, head: 300, pitch: 300, vPitch: 1.25, vRate: 1.1, mouthO: "g2StMO", mouthC: "g2StMC" },
    k1: { el: "pk1", x: 0, y: 0, s: 1, head: 300, pitch: 80, vPitch: 0.1, vRate: 1.05, mouthO: "pk1MO", mouthC: "pk1MC" },
    k2: { el: "pk2", x: 0, y: 0, s: 1, head: 300, pitch: 80, vPitch: 0.15, vRate: 1.1, mouthO: "pk2MO", mouthC: "pk2MC" },
    b:  { el: "famB", x: 0, y: 0, s: 1, head: 300, pitch: 280, vPitch: 1.3, vRate: 1.0, mouthO: "famBMO", mouthC: "famBMC" }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  // nagrane kwestie (kierowca): odtwarzane wolniej i bez zachowania wysokosci = bardzo niski, gruby glos
  const CLIPS = {
    "Siema, Triwet!": { src: "glosy/rzasnik/01_eric.mp3", rate: 1 },
    "Siema, Pablo. A ty co, na wesele się wystroiłeś?": { src: "glosy/rzasnik/02_callum.mp3", rate: 1 },
    "Wyrwałem dwie dupki w Rząśniku. Jedziemy na podryw!": { src: "glosy/rzasnik/03_eric.mp3", rate: 1 },
    "Ja też się wystroiłem. Patrz, muszka.": { src: "glosy/rzasnik/04_callum.mp3", rate: 1 },
    "No to szybkie piwko i jedziemy.": { src: "glosy/rzasnik/05_eric.mp3", rate: 1 },
    "Kaski i jazda!": { src: "glosy/rzasnik/06_eric.mp3", rate: 1 },
    "Patrz, złomowisko w Obrytem!": { src: "glosy/rzasnik/07_eric.mp3", rate: 1 },
    "Tam kiedyś chłopaki bombę na złom sprzedali.": { src: "glosy/rzasnik/08_callum.mp3", rate: 1 },
    "Trzeba zatankować.": { src: "glosy/rzasnik/09_eric.mp3", rate: 1 },
    "Ile wlazło?": { src: "glosy/rzasnik/10_callum.mp3", rate: 1 },
    "Za dziesięć złotych. Bak jak naparstek.": { src: "glosy/rzasnik/11_eric.mp3", rate: 1 },
    "Rząśnik! Dupki czekają!": { src: "glosy/rzasnik/12_eric.mp3", rate: 1 },
    "Wyciągamy po browarze.": { src: "glosy/rzasnik/13_eric.mp3", rate: 1 },
    "Cześć, Pablo!": { src: "glosy/rzasnik/14_jessica.mp3", rate: 1 },
    "Siema, dziewczyny! To jest Triwet.": { src: "glosy/rzasnik/15_eric.mp3", rate: 1 },
    "Masz może mapę? Bo zgubiłem się w twoich oczach.": { src: "glosy/rzasnik/16_callum.mp3", rate: 1 },
    "Hi hi hi!": { src: "glosy/rzasnik/17_sarah.mp3", rate: 1 },
    "Może przejedziecie się Hondą?": { src: "glosy/rzasnik/18_eric.mp3", rate: 1 },
    "Może…": { src: "glosy/rzasnik/19_jessica.mp3", rate: 1 },
    "Skąd wy jesteście?": { src: "glosy/rzasnik/20_adam.mp3", rate: 1 },
    "Chuj cię to obchodzi.": { src: "glosy/rzasnik/21_callum.mp3", rate: 1 },
    "O, wy kurwy!": { src: "glosy/rzasnik/22_daniel.mp3", rate: 1 },
    "Spierdalamy!": { src: "glosy/rzasnik/23_eric.mp3", rate: 1 },
    "Pablo, czekaj!": { src: "glosy/rzasnik/24_callum.mp3", rate: 1 },
    "Łap go!": { src: "glosy/rzasnik/25_adam.mp3", rate: 1 },
    "Gdzie on jest?!": { src: "glosy/rzasnik/26_adam.mp3", rate: 1 },
    "Szukaj za blokiem!": { src: "glosy/rzasnik/27_daniel.mp3", rate: 1 },
    "Nie wydacie mnie?": { src: "glosy/rzasnik/28_callum.mp3", rate: 1 },
    "Zadzwonić po policję?": { src: "glosy/rzasnik/29_matilda.mp3", rate: 1 },
    "Nie… ale chwilkę tu posiedzę.": { src: "glosy/rzasnik/30_callum.mp3", rate: 1 }
  };

  const DEEP = 0.55;
  const clipEls = {};
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    // wpis: sciezka (nagranie kierowcy, obnizane) albo { src, rate } (glos ElevenLabs)
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){
      const a = new Audio(src); a.preload = "auto"; a._rate = rate;
      a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
      clipEls[src] = a;
    }
    return clipEls[src];
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(t => { const a = clipFor(t); a.muted = true;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); });
  }
  function playClip(a){
    return new Promise(res => {
      a.currentTime = 0; a.playbackRate = a._rate;
      a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
      const guard = setTimeout(res, 8000);
      a.onended = a.onerror = () => { clearTimeout(guard); res(); };
      a.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  function talking(k, on){
    const w = who[k];
    if (w.img){
      if (on) w._talk = $(w.el).querySelector(".bob").animate(
        [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(-8px) scaleY(1.02)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
      return;
    }
    clearInterval(w._talk);
    let open = false;
    if (on) w._talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    else { $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = ""; }
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){

  const cig = (x, y) => `<g stroke-linecap="round"><line x1="${x}" y1="${y}" x2="${x + 42}" y2="${y + 6}" stroke="#141414" stroke-width="11"/><line x1="${x}" y1="${y}" x2="${x + 42}" y2="${y + 6}" stroke="#f4f4f2" stroke-width="6"/><circle cx="${x + 42}" cy="${y + 6}" r="5" fill="#ff5a1f"/></g>`;
  const glug = () => tone(180, 0.09, "sine", 0.15, 90);
  const burp2 = () => tone(110, 0.4, "sawtooth", 0.06, 70);
  const lighter2 = () => { noise(0.06, { freq: 5000, q: 2, vol: 0.15 }); tone(300, 0.2, "sine", 0.02); };
  const psst = () => noise(0.35, { type: "highpass", freq: 3000, vol: 0.35, sweepTo: 8000 });
  const bonk = () => { tone(700, 0.25, "triangle", 0.2, 300); noise(0.08, { freq: 1200, q: 1, vol: 0.5 }); };
  const doorSlam = () => { noise(0.12, { freq: 300, q: 1, vol: 0.6 }); tone(70, 0.2, "sine", 0.3, 40); };
  const kickStart = () => { noise(0.12, { freq: 300, q: 1, vol: 0.5 }); tone(90, 0.15, "sine", 0.2, 50); };
  let roadA = [];
  function roadMove(on, ms = 900){ roadA.forEach(a => a.cancel()); roadA = []; if (!on) return;
    ["roadDash", "roadFx"].forEach(id => roadA.push($(id).animate([{ transform: "translateX(0)" }, { transform: "translateX(-1600px)" }], { duration: ms, iterations: Infinity }))); }
  function cloudFight(x, y){
    const c = document.createElementNS(NS, "g"); $("fx").append(c);
    c.innerHTML = [[-60, -20, 70], [10, -50, 80], [70, -10, 70], [0, 20, 80], [-40, 40, 60], [60, 40, 60]].map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r}" fill="#e8e0c8" stroke="#141414" stroke-width="5"/>`).join("") +
      '<path d="M-90 -60 l20 20 M100 -70 l-20 20 M-110 50 l30 -10 M120 40 l-30 -6" stroke="#141414" stroke-width="10" stroke-linecap="round"/>' +
      '<g fill="#ffd23f" stroke="#141414" stroke-width="3"><path d="M-20 -110 l8 16 18 2 -14 12 4 18 -16 -10 -16 10 4 -18 -14 -12 18 -2 z"/><path d="M90 -90 l6 12 14 2 -10 9 3 14 -13 -8 -12 8 3 -14 -10 -9 14 -2 z"/></g>';
    const a = c.animate([{ transform: `translate(${x}px,${y}px) rotate(0deg) scale(1.3)` }, { transform: `translate(${x + 8}px,${y - 6}px) rotate(14deg) scale(1.4)` }, { transform: `translate(${x - 8}px,${y + 6}px) rotate(-10deg) scale(1.32)` }], { duration: 260, iterations: Infinity });
    return () => { a.cancel(); c.remove(); };
  }
  function musicBox(){ const a = ac(), T = a.currentTime + 0.1, mel = [72, 76, 79, 76, 77, 74, 71, 74, 72, 76, 79, 84, 83, 79, 77, 76];
    mel.forEach((n, i) => { const f = 440 * Math.pow(2, (n - 69) / 12), t = T + i * 0.38, o = a.createOscillator(), g = a.createGain();
      o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.2);
      if (i % 4 === 0){ const b = a.createOscillator(), gb = a.createGain(); b.type = "sine"; b.frequency.value = f / 4; gb.gain.setValueAtTime(0.1, t); gb.gain.exponentialRampToValueAtTime(0.001, t + 1.4); b.connect(gb); gb.connect(a.destination); b.start(t); b.stop(t + 1.5); } }); }

  function reset(){
    if (tts) tts.cancel();
    document.getAnimations().forEach(a => a.cancel());
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = ""; $("pows").innerHTML = "";
    document.querySelectorAll(".prop").forEach(p => p.remove());
    scene("scAlma"); camSet(); roadMove(false); hondaWheels(false);
    ["honda", "bmw", "pk1", "pk2", "pk3", "rStW", "rSitW", "g1StW", "g2StW", "pablo", "moral", "rzSign", "hose", "rStHelm"].forEach(id => $(id).style.display = "none");
    document.querySelectorAll(".tent").forEach(t => t.style.transform = "scaleX(0)");
    ["pabloArm", "pabloArmB", "rStArm", "pk1ArmR", "pk2ArmR", "pk3ArmR", "famDArm"].forEach(id => $(id) && ($(id).style.transform = ""));
    $("zlomFar").style.transform = ""; $("pumpZl").textContent = "0,00 zł";
    document.querySelectorAll("#scFlat .eyes").forEach(e => e.style.transform = "");
    $("fade").style.opacity = 0; $("flash").style.opacity = 0;
  }

  // ================= 1. pod sklepem ALMA =================
  async function alma(){
    scene("scAlma");
    put("rSt", 520, 830, 0.5, 1);
    riders(true, false, false); hondaAt(-400, 850, 0.42, 1); hondaWheels(true); hondaBob(true);
    const e = twoStroke(110); e.set(200, 0.08, 0.2);
    const ex = setInterval(exh, 120);
    await tween(2600, k => hondaAt(-400 + 1350 * k, 850), easeOut);
    clearInterval(ex); hondaWheels(false); hondaBob(false); e.set(90, 0.04, 0.3);
    tone(415, 0.25, "square", 0.05); await sleep(300); tone(415, 0.25, "square", 0.05);
    await sayP("Siema, Triwet!", 200);
    e.stop(0.4);
    // zsiada
    riders(false, false); pl("pablo", 760, 830, 0.5, -1);
    await RF(["Siema, Pablo.", "A ty co, na wesele się wystroiłeś?"]);
    await PF(["Wyrwałem dwie dupki w Rząśniku.", "Jedziemy na podryw!"]);
    await RF(["Ja też się wystroiłem.", "Patrz, muszka."]);
    await armTo("rSt", -160, 300); tone(900, 0.06, "square", 0.04); await sleep(400); armTo("rSt", 0, 300);
    await PF("No to szybkie piwko i jedziemy.", 200);
    // piwo
    prop("pabloArm", can(64, -200)); prop("rStArm", can(36, -200));
    psst(); await sleep(250); psst();
    await Promise.all([anim($("pabloArm"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-150deg)" }], { duration: 400 }), armTo("rSt", -150, 400)]);
    for (let i = 0; i < 6; i++){ glug(); await sleep(230); }
    await Promise.all([anim($("pabloArm"), [{ transform: "rotate(-150deg)" }, { transform: "rotate(0deg)" }], { duration: 400 }), armTo("rSt", 0, 400)]);
    $("pabloArm").style.transform = "";
    burp2(); await sleep(500); setTimeout(burp2, 0);
    // fajki
    lighter2(); prop("pablo", cig(8, -358)); await sleep(300); lighter2(); prop("rSt", cig(10, -350));
    const sm = setInterval(() => { puff(Q.pablo.x - 50 * 0.5, Q.pablo.y - 352 * 0.5, { r: 7, dur: 1400, dx: -14, dy: -60, color: "#d8d8d8" });
      puff(P.rSt.x + 52 * 0.5, P.rSt.y - 344 * 0.5, { r: 7, dur: 1400, dx: 14, dy: -60, color: "#d8d8d8" }); }, 420);
    await sleep(2400);
    clearInterval(sm); document.querySelectorAll(".prop").forEach(p => p.remove());
    await PF("Kaski i jazda!", 200);
    // wsiadaja
    tone(500, 0.06, "square", 0.05); setTimeout(() => tone(500, 0.06, "square", 0.05), 200);
    $("pablo").style.display = "none"; hideP("rSt");
    riders(true, true, true);
    kickStart(); await sleep(250);
    const e2 = twoStroke(110); e2.set(240, 0.1, 0.2); hondaWheels(true); hondaBob(true);
    const ex2 = setInterval(exh, 100);
    await tween(1800, k => hondaAt(950 + 900 * k, 850), t => t * t);
    clearInterval(ex2); e2.stop(0.4); hondaBob(false);
  }

  // ================= 2. droga, w oddali zlomowisko w Obrytem =================
  async function road(){
    await fadeTo(() => { scene("scRoad"); riders(true, true, true); hondaAt(760, 790, 0.45, 1); });
    const e = twoStroke(110); e.set(230, 0.08, 0.3); hondaWheels(true, 0.1); hondaBob(true); roadMove(true, 900);
    const ex = setInterval(exh, 110);
    $("zlomFar").animate([{ transform: "translateX(300px)" }, { transform: "translateX(-900px)" }], { duration: 9000, fill: "forwards" });
    await sleep(1500);
    await sayP("Patrz, złomowisko w Obrytem!", 300);
    await sayT(["Tam kiedyś chłopaki", "bombę na złom sprzedali."], 600);
    await sleep(1200);
    clearInterval(ex); e.stop(0.3);
  }

  // ================= 3. stacja Szpachla =================
  async function station(){
    await fadeTo(() => { scene("scStation"); roadMove(false); hondaAt(-400, 840, 0.45, 1); });
    const e = twoStroke(110); e.set(200, 0.08, 0.2);
    await tween(2000, k => hondaAt(-400 + 1380 * k, 840), easeOut);
    hondaWheels(false); hondaBob(false); e.set(80, 0.03, 0.3);
    await sayP("Trzeba zatankować.", 200);
    e.stop(0.3);
    $("hose").style.display = "";
    noise(2.6, { type: "lowpass", freq: 600, vol: 0.15 });
    await tween(2600, k => $("pumpZl").textContent = (9.87 * k).toFixed(2).replace(".", ",") + " zł");
    tone(1200, 0.1, "square", 0.05);
    await sayT("Ile wlazło?", 200);
    await sayP(["Za dziesięć złotych.", "Bak jak naparstek."], 400);
    $("hose").style.display = "none";
    kickStart(); await sleep(200);
    const e2 = twoStroke(110); e2.set(240, 0.1, 0.2); hondaWheels(true); hondaBob(true);
    await tween(1500, k => hondaAt(980 + 900 * k, 840), t => t * t);
    e2.stop(0.3);
  }

  // ================= 4. znak Rząśnik =================
  async function sign(){
    await fadeTo(() => { scene("scRoad"); hondaAt(760, 790, 0.45, 1); $("zlomFar").getAnimations().forEach(a => a.cancel()); $("zlomFar").style.transform = "translateX(2000px)"; });
    const e = twoStroke(110); e.set(230, 0.08, 0.3); hondaWheels(true, 0.1); hondaBob(true); roadMove(true, 2400);
    const s = $("rzSign"); s.style.display = "";
    const t = tween(3400, k => s.setAttribute("transform", `translate(${1900 - 2300 * k},700)`));
    await sleep(1100);
    await sayP("Rząśnik! Dupki czekają!", 300);
    await t; s.style.display = "none"; e.stop(0.3);
  }

  // ================= 5. pod urzedem gminy =================
  async function urzad(){
    await fadeTo(() => { scene("scUrzad"); roadMove(false); hondaAt(-400, 880, 0.45, 1); });
    const e = twoStroke(110); e.set(200, 0.08, 0.2);
    await tween(2200, k => hondaAt(-400 + 760 * k, 880), easeOut);
    hondaWheels(false); hondaBob(false); e.stop(0.6);
    await sleep(300);
    riders(false, false); pl("pablo", 540, 790, 0.5, 1); put("rSt", 700, 792, 0.5, 1);
    prop("pabloArm", can(64, -200)); prop("rStArm", can(36, -200)); psst(); await sleep(200); psst();
    await PF("Wyciągamy po browarze.", 200);
    await Promise.all([anim($("pabloArm"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-150deg)" }, { transform: "rotate(0deg)" }], { duration: 1400 }), (async () => { await armTo("rSt", -150, 400); for (let i = 0; i < 3; i++){ glug(); await sleep(220); } await armTo("rSt", 0, 300); })()]);
    // dupki
    put("g1St", 1750, 790, 0.5, -1); put("g2St", 1880, 792, 0.5, -1);
    await Promise.all([walk("g1St", 940, 2600), walk("g2St", 1080, 2600)]);
    await F("g1", "g1St", 480, "Cześć, Pablo!", 200);
    await PF(["Siema, dziewczyny!", "To jest Triwet."], 200);
    await RF(["Masz może mapę?", "Bo zgubiłem się w twoich oczach."], 300);
    await F("g2", "g2St", 480, "Hi hi hi!", 200);
    // namioty
    for (const t of [$("pablo").querySelector(".tent"), $("rSt").querySelector(".tent")]){
      boing(); await anim(t, [{ transform: "scaleX(0)" }, { transform: "scaleX(1.25)" }, { transform: "scaleX(0.9)" }, { transform: "scaleX(1)" }], { duration: 450 }); t.style.transform = "scaleX(1)"; await sleep(250);
    }
    await PF("Może przejedziecie się Hondą?", 200);
    await F("g1", "g1St", 480, "Może…", 300);
    // czarne BMW z disco polo
    const bmw = $("bmw"); bmw.style.display = "";
    const a = ac(); if (window.ziomkiMusic) window.ziomkiMusic[2](a.currentTime + 0.05, 9);
    const be = engine(); be.set(60, 0.08, 0.3);
    const bwA = [...bmw.querySelectorAll(".bw")].map(w => w.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 300, iterations: Infinity }));
    const notes = setInterval(() => { const t = document.createElementNS(NS, "text"); t.textContent = Math.random() < 0.5 ? "♪" : "♫";
      const bx = +bmw.dataset.x || 0; Object.entries({ x: bx, y: 720, "font-size": 40, fill: "#ffd23f", stroke: "#141414", "stroke-width": 2 }).forEach(([k, v]) => t.setAttribute(k, v)); $("fx").append(t);
      t.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: `translate(${(Math.random() - 0.5) * 120}px,-200px)`, opacity: 0 }], { duration: 1500, fill: "forwards" }).finished.then(() => t.remove()).catch(() => {}); }, 300);
    await tween(2800, k => { const x = -700 + 1950 * k; bmw.dataset.x = x; bmw.style.transform = `translate(${x}px,895px) scale(0.6)`; }, easeOut);
    bwA.forEach(w => w.cancel()); sfx.brake(); be.stop(0.6);
    await sleep(1400); clearInterval(notes);
    // wysiadaja napakowani
    for (const [id, x] of [["pk1", 1080], ["pk2", 1220], ["pk3", 1360]]){ doorSlam(); pl(id, x, 890, 0.5, -1); await sleep(350); }
    walk("g1St", 1460, 800); walk("g2St", 1560, 800);
    await sleep(400);
    await F("k1", "pk1", 600, "Skąd wy jesteście?", 300);
    await RF("Chuj cię to obchodzi.", 200);
    await F("k2", "pk2", 600, "O, wy kurwy!", 100);
    // ucieczka Pabla
    const run = [plWalk("pk1", 820, 1400, 150), plWalk("pk2", 940, 1400, 150), plWalk("pk3", 1060, 1400, 150)];
    $("pablo").querySelector(".tent").style.transform = "scaleX(0)"; $("rSt").querySelector(".tent").style.transform = "scaleX(0)";
    document.querySelectorAll(".prop").forEach(p => p.remove());
    pl("pablo", 540, 790, 0.5, -1);
    const pw = plWalk("pablo", 380, 500, 120);
    standP(); const bS = await say("p", ["Spierdalamy!"], 0, { instant: true }); speak("Spierdalamy!", who.p, { rate: 1.4 });
    await pw; unsay(bS);
    $("pablo").style.display = "none"; riders(true, false, true); hondaAt(360, 880, 0.45, -1);
    kickStart(); await sleep(200); kickStart();
    const pe = twoStroke(110); pe.set(260, 0.12, 0.1); hondaWheels(true, 0.07); hondaBob(true);
    // Triwet zaklada kask, nie zdazyl
    $("rStHelm").style.display = ""; tone(500, 0.06, "square", 0.05);
    const go = tween(1100, k => { hondaAt(360 - 900 * k, 880, 0.45, -1); if (Math.random() < 0.4) puff(H.x + 318 * 0.45, 860, { r: 20, dur: 900, dx: 80, dy: -30, color: "#d6d6d6" }); }, t => t * t);
    await sleep(200);
    P.rSt.f = -1; draw("rSt");
    const wT = walk("rSt", 480, 700);
    await RF("Pablo, czekaj!", 0);
    await go; await wT; pe.stop(0.4); hondaBob(false); hondaWheels(false);
    await Promise.all(run);
    // bija go w kask
    P.rSt.f = 1; draw("rSt");
    ["pk1", "pk2", "pk3"].forEach(id => $(id).style.visibility = "hidden"); $("rStW").style.visibility = "hidden";
    const stop = cloudFight(700, 700);
    for (let i = 0; i < 6; i++){ bonk(); if (i % 2 === 0) pow("BONK!", 560 + Math.random() * 300, 520 + Math.random() * 80, { size: 70, col: "#fff", hold: 200 }); await sleep(260); }
    stop();
    ["pk1", "pk2", "pk3"].forEach(id => $(id).style.visibility = ""); $("rStW").style.visibility = "";
    pl("pk1", 600, 890, 0.5, 1); pl("pk2", 760, 890, 0.5, -1); pl("pk3", 880, 890, 0.5, -1);
    put("rSt", 690, 860, 0.5, 1);
    // ucieka w bloki
    whoosh(0.4);
    await walk("rSt", 1800, 900);
    await F("k1", "pk1", 600, "Łap go!", 0);
    await Promise.all([plWalk("pk1", 1900, 1100, 150), plWalk("pk2", 2000, 1100, 150), plWalk("pk3", 2100, 1100, 150)]);
  }

  // ================= 6. bloki =================
  async function blok(){
    await fadeTo(() => { scene("scBlok"); ["bmw", "honda", "g1StW", "g2StW"].forEach(id => $(id).style.display = "none"); });
    put("rSt", -100, 885, 0.5, 1);
    await walk("rSt", 1330, 1500);
    // znika do klatki
    await tween(500, k => { P.rSt.y = 885 - 270 * k; P.rSt.s = 0.5 - 0.3 * k; draw("rSt"); });
    hideP("rSt"); doorSlam();
    await sleep(400);
    pl("pk1", -150, 885, 0.5, 1); pl("pk2", -300, 885, 0.5, 1); pl("pk3", -450, 885, 0.5, 1);
    await Promise.all([plWalk("pk1", 700, 1300, 150), plWalk("pk2", 560, 1300, 150), plWalk("pk3", 420, 1300, 150)]);
    for (let i = 0; i < 2; i++){ ["pk1", "pk2", "pk3"].forEach(id => { const q = Q[id]; pl(id, q.x, q.y, q.s, -q.f); }); await sleep(450); }
    await F("k1", "pk1", 600, "Gdzie on jest?!", 200);
    await F("k2", "pk2", 600, "Szukaj za blokiem!", 200);
    await Promise.all([plWalk("pk1", 1800, 1100, 150), plWalk("pk2", 1700, 1300, 150), plWalk("pk3", 1650, 1500, 150)]);
    // biegaja dookola bloku (w tle)
    for (let lap = 0; lap < 2; lap++){
      ["pk1", "pk2", "pk3"].forEach((id, i) => pl(id, 1500 + i * 70, 640, 0.22, -1));
      await Promise.all(["pk1", "pk2", "pk3"].map(id => plWalk(id, 250, 1700, 110)));
      ["pk1", "pk2", "pk3"].forEach((id, i) => pl(id, -100 - i * 120, 885, 0.5, 1));
      await Promise.all(["pk1", "pk2", "pk3"].map(id => plWalk(id, 1800, 1500, 110)));
    }
  }

  // ================= 7. mieszkanie: niedzielny obiad =================
  async function flat(){
    await fadeTo(() => { scene("scFlat"); ["pk1", "pk2", "pk3"].forEach(id => $(id).style.display = "none"); });
    const eat = $("famDArm").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-60deg)" }], { duration: 700, direction: "alternate", iterations: Infinity });
    const slurp = setInterval(() => noise(0.25, { freq: 900, q: 3, vol: 0.12, sweepTo: 2500 }), 1400);
    await sleep(900);
    doorSlam();
    put("rSit", 170, 770, 0.62, 1);
    const shake_ = $("rSit").querySelector(".bob").animate([{ transform: "translate(-2px,0)" }, { transform: "translate(2px,0)" }], { duration: 60, direction: "alternate", iterations: Infinity });
    eat.pause(); clearInterval(slurp);
    document.querySelectorAll("#scFlat .eyes").forEach(e => e.style.transform = "translateX(-7px)");
    await sleep(1600);
    Object.assign(who.r, { el: "rSit", x: 150, y: 770, head: 330 * 0.62 });
    await L("r", "Nie wydacie mnie?", 500, 140);
    Object.assign(who.b, { el: "famB", x: 780, y: 330, head: 0 });
    await L("b", "Zadzwonić po policję?", 500);
    Object.assign(who.r, { el: "rSit", x: 150, y: 770, head: 330 * 0.62 });
    await L("r", ["Nie…", "ale chwilkę tu posiedzę."], 800, 140);
    eat.play(); noise(0.4, { freq: 900, q: 3, vol: 0.14, sweepTo: 2500 });
    await sleep(1600);
    shake_.cancel(); eat.cancel();
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 700 }); $("fade").style.opacity = 1;
  }

  // ================= 8. moral =================
  async function moral(){
    const m = $("moral"); m.style.display = ""; $("fade").style.opacity = 0;
    ["moralT", "moral1", "moral2"].forEach(id => $(id).style.opacity = 0);
    musicBox();
    await anim($("moralT"), [{ opacity: 0, transform: "scale(0.6)" }, { opacity: 1, transform: "scale(1)" }], { duration: 700 }); $("moralT").style.opacity = 1;
    await sleep(500);
    await anim($("moral1"), [{ opacity: 0 }, { opacity: 1 }], { duration: 900 }); $("moral1").style.opacity = 1;
    await sleep(700);
    await anim($("moral2"), [{ opacity: 0 }, { opacity: 1 }], { duration: 900 }); $("moral2").style.opacity = 1;
    await sleep(3200);
    m.style.display = "none";
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    const h = location.hash;
    if (h === "#moral"){ await moral(); $("endScreen").hidden = false; return; }
    if (!h) await ziomkiIntro2("PODRYW W RZĄŚNIKU", 15, 3, 1);
    if (!h || h === "#alma") { await alma(); await road(); await station(); await sign(); }
    if (!h || h === "#alma" || h === "#urzad") await urzad();
    await blok(); await flat(); await moral();
    if (!h) await ziomkiOutro();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
