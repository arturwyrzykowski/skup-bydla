<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scWies"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    a:  { el: "aSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 170, vPitch: 0.8, vRate: 1.2 },
    u:  { el: "ubij", x: 0, y: 0, s: 1, head: 300, pitch: 150, vPitch: 0.55, vRate: 1.1, mouthO: "uMouthO", mouthC: "uMouthC" },

  const brap = () => { tone(70, 0.9, "sawtooth", 0.12, 160); noise(0.6, { freq: 400, q: 1, vol: 0.25 }); };
  const sting = () => [0, 260, 520].forEach((t, i) => setTimeout(() => { tone([196, 185, 147][i], i === 2 ? 1.2 : 0.3, "sawtooth", 0.08); tone([98, 92, 73][i], i === 2 ? 1.2 : 0.3, "square", 0.05); }, t));
  const ding = () => { tone(2400, 0.4, "sine", 0.07); tone(3600, 0.3, "sine", 0.04); };
  const plask = () => { noise(0.35, { freq: 500, q: 0.8, vol: 0.7 }); tone(90, 0.3, "sine", 0.3, 40); };
  const boing = () => tone(180, 0.6, "sine", 0.18, 700);
  const pufS = () => { noise(0.2, { freq: 900, q: 1, vol: 0.4 }); tone(300, 0.25, "sine", 0.2, 900); };
  const whoosh = (d = 1.5) => noise(d, { freq: 600, q: 0.7, vol: 0.25, sweepTo: 200 });

  // ---------- postacie ----------
  const P = {};   // id -> {x, y, s, f, r}
  function put(id, x, y, s, f = 1, r = 0){ P[id] = { x, y, s, f, r }; draw(id); $(id + "W") ? $(id + "W").style.display = "" : 0; }
  function draw(id){ const p = P[id]; const el = $(id + "W") || $(id);
    el.getAnimations().forEach(a => a.cancel());
    el.style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.r}deg) scale(${p.s})`; $(id).querySelector(".face").style.transform = `scaleX(${p.f})`; }
  function hideP(id){ $(id + "W").style.display = "none"; }
  async function walk(id, x, ms){
    const g = $(id), legs = [["legL", 18], ["legR", -18]].map(([c, a]) => g.querySelector("." + c).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], { duration: 300, direction: "alternate", iterations: Infinity }));
    const bob = g.querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-10px)" }], { duration: 150, direction: "alternate", iterations: Infinity });
    const x0 = P[id].x; await tween(ms, k => { P[id].x = x0 + (x - x0) * k; draw(id); });
    legs.forEach(a => a.cancel()); bob.cancel();
  }
  const armTo = (id, deg, ms = 250) => anim($(id + "Arm"), [{ transform: getComputedStyle($(id + "Arm")).transform.replace("none", "rotate(0deg)") }, { transform: `rotate(${deg}deg)` }], { duration: ms, easing: "ease-out" });
  // ustaw mowce: k = a/r/g1/g2, el = id postaci, glowa nad (x, y)
  function spk(k, el, x, y, head){ Object.assign(who[k], { el, x, y, head }); if (k[0] === "g"){ who[k].mouthO = el + "MO"; who[k].mouthC = el + "MC"; } }
  function at(k, id, head = 470){ const p = P[id]; spk(k, id, p.x, p.y, head * p.s); }
  const L = (k, lines, hold = 500, shift = 0, o) => line(k, Array.isArray(lines) ? lines : [lines], hold, shift, o);


  // ---------- dzwieki treningu ----------
  const grunt = (p = 1) => { tone(120 * p, 0.28, "sawtooth", 0.07, 85 * p); noise(0.2, { freq: 500, q: 1, vol: 0.12 }); };
  const clank = () => { tone(900, 0.25, "triangle", 0.08); tone(1350, 0.2, "triangle", 0.05); noise(0.08, { freq: 3000, q: 2, vol: 0.2 }); };
  const blub = () => tone(220 + Math.random() * 80, 0.12, "sine", 0.12, 120);
  const thud = () => { tone(80, 0.3, "sine", 0.4, 40); noise(0.2, { freq: 400, q: 1, vol: 0.4 }); };
  let gymT = null;
  function gymBeat(on){
    clearInterval(gymT); if (!on) return;
    let i = 0; const b = 60 / 100 * 1000 / 2;
    gymT = setInterval(() => { const s = i % 8;
      if (s === 0 || s === 5) tone(150, 0.3, "sine", 0.5, 40);
      if (s === 2 || s === 6) noise(0.16, { freq: 1800, q: 1, vol: 0.3 });
      noise(0.04, { type: "highpass", freq: 8000, vol: 0.08 });
      if (s === 0) tone([55, 65, 49, 58][(i >> 3) % 4], 0.5, "sawtooth", 0.06, [55, 65, 49, 58][(i >> 3) % 4]);
      i++; }, b);
  }
  // ---------- pomocnicze ----------
  function legs(id, aL, aR, ms = 0){
    const L = $(id).querySelector(".legL"), R = $(id).querySelector(".legR");
    if (!ms){ L.getAnimations().forEach(a => a.cancel()); R.getAnimations().forEach(a => a.cancel()); L.style.transform = `rotate(${aL}deg)`; R.style.transform = `rotate(${aR}deg)`; return; }
    return Promise.all([anim(L, [{ transform: getComputedStyle(L).transform.replace("none", "rotate(0deg)") }, { transform: `rotate(${aL}deg)` }], { duration: ms }),
                        anim(R, [{ transform: getComputedStyle(R).transform.replace("none", "rotate(0deg)") }, { transform: `rotate(${aR}deg)` }], { duration: ms })]);
  }
  const red = (id, v, ms = 400) => anim($(id).querySelector(".flush"), [{ opacity: +getComputedStyle($(id).querySelector(".flush")).opacity }, { opacity: v }], { duration: ms });
  function sweat(id, n = 3){ const p = P[id]; bits(p.x, p.y - 330 * p.s, n, { color: "#7cd0ff", spread: 60, up: 50, size: 6 }); }
  const shakeEl = (el, px = 3, ms = 60, n = 20) => el.animate([{ transform: `translate(${-px}px,0)` }, { transform: `translate(${px}px,0)` }], { duration: ms, direction: "alternate", iterations: n });
  // guma kasjerki
  let gumT = null;
  function chew(on){
    clearInterval(gumT); if (!on) return;
    let k = 0;
    gumT = setInterval(async () => {
      k++;
      if (k % 14 === 0){
        const g = $("gum");
        await anim(g, [{ r: 0 }, { r: 34 }], { duration: 1100, easing: "ease-out" }).catch(() => {});
        g.setAttribute("r", 34); tone(1200, 0.06, "square", 0.05); noise(0.05, { freq: 3000, q: 2, vol: 0.2 });
        g.getAnimations().forEach(a => a.cancel()); g.setAttribute("r", 0);
      } else { const o = k % 2; $("kasMO").style.display = o ? "" : "none"; $("kasMC").style.display = o ? "none" : ""; }
    }, 230);
  }
  // sztanga
  function plates(n){
    const mk = (side) => { let s = ""; for (let k = 0; k < n; k++){ const x = side < 0 ? 300 - k * 26 : 630 + k * 26, h = 120 + Math.min(k, 3) * 20;
      s += `<rect x="${x}" y="${-h / 2}" width="22" height="${h}" rx="4" fill="${["#3a3f48", "#c81e1e", "#2a5ab8", "#2f7a3a", "#3a3f48", "#c81e1e"][k % 6]}"/>`; } return s; };
    $("platesL").innerHTML = mk(-1); $("platesR").innerHTML = mk(1);
  }
  function barAt(y, bend = 0){ $("bar").style.transform = `translate(0px,${y}px)`; $("barRod").setAttribute("d", `M150 ${bend * 0.5} Q476 ${-bend} 800 ${bend * 0.5}`);
    $("platesL").setAttribute("transform", `translate(0,${bend * 0.35})`); $("platesR").setAttribute("transform", `translate(0,${bend * 0.35})`); }


  // ---------- postacie rysowane: polozenie ----------
  const Q = {};
  function pl(id, x, y, s, f = 1, r = 0){ Q[id] = { x, y, s, f, r }; const e = $(id); e.style.display = ""; e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${f * s},${s})`; }
  function sp(k, id, head){ const q = Q[id] || P[id]; Object.assign(who[k], { el: id, x: q.x, y: q.y, head: head * q.s }); }
  const F = (k, id, head, lines, hold = 350, shift = 0, o) => { sp(k, id, head); return L(k, lines, hold, shift, o); };
  const U = (lines, hold = 350) => F("u", "ubij", 470, lines, hold, -60);


  // ---------- dzwieki maszyn ----------
  const machines = [];
  function noiseLoop(freq, q, vol, type = "bandpass"){
    const a = ac(), len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf; s.loop = true;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = a.createGain(); g.gain.value = 0.0001; g.gain.linearRampToValueAtTime(vol, a.currentTime + 0.3);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
    const m = { set(v, fr, r = 0.2){ const t = a.currentTime; g.gain.linearRampToValueAtTime(v, t + r); if (fr) f.frequency.linearRampToValueAtTime(fr, t + r); },
                stop(r = 0.3){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + r); s.stop(t + r + 0.05); } };
    machines.push(m); return m;
  }
  function motor(base, fr, vol){ const m = twoStroke(base); m.set(fr, vol, 0.3); machines.push(m); return m; }
  function stopAll(){ machines.splice(0).forEach(m => { try { m.stop(0.6); } catch (e) {} }); }
  const pullCord = () => { noise(0.3, { freq: 900, q: 2, vol: 0.4, sweepTo: 2400 }); tone(70, 0.3, "sawtooth", 0.08, 140); };
  const birds = () => [0, 180, 360, 900, 1080].forEach((t, i) => setTimeout(() => tone(2600 + i * 250, 0.08, "sine", 0.04, 3400), t));
  const lp = [];   // petle animacji do zatrzymania
  function loopAnim(el, kf, o){ const a = el.animate(kf, Object.assign({ iterations: Infinity }, o)); lp.push(a); return a; }
  const timers = [];
  function every(ms, fn){ const t = setInterval(fn, ms); timers.push(t); return t; }

  // ---------- Andrzej i kawa ----------
  const mugHTML = '<g class="mug" stroke="#141414" stroke-width="4"><rect x="34" y="-182" width="40" height="44" rx="6" fill="#f4f4f2"/><path d="M74 -172 q18 2 16 16 q-2 12 -16 10" fill="none" stroke-width="6"/><ellipse cx="54" cy="-180" rx="18" ry="5" fill="#6b3a1e"/></g>';
  const mugXY = () => [P.aSt.x + 54 * P.aSt.s * P.aSt.f, P.aSt.y - 190 * P.aSt.s];
  let steamT = null;
  function steam(on){ clearInterval(steamT); if (on) steamT = setInterval(() => { const [x, y] = mugXY(); puff(x, y - 10, { r: 6, dur: 1400, dx: 6, dy: -60, color: "#f4f4f2" }); }, 450); }
  async function sip(){ steam(false); await armTo("aSt", -128, 450); for (let i = 0; i < 3; i++){ tone(180, 0.09, "sine", 0.12, 90); await sleep(260); } await armTo("aSt", 0, 450); steam(true); }
  const AF = (lines, hold = 350, shift = 0) => F("a", "aSt", 470, lines, hold, shift);
  async function reaction(level){
    await camTo(650, 640, 2.4, 500);
    red("aSt", Math.min(0.4, level * 0.07), 400);
    const j = $("aSt").querySelector(".bob").animate([{ transform: "translate(0,0)" }, { transform: `translate(${level}px,0)` }, { transform: `translate(${-level}px,0)` }], { duration: 80, iterations: 6 + level * 2 });
    await j.finished.catch(() => {});
  }
  const goTo = (x, k = 1.6, ms = 700) => camTo(x, 640, k, ms);

  function reset(){
    if (tts) tts.cancel();
    stopAll(); lp.splice(0).forEach(a => a.cancel()); timers.splice(0).forEach(clearInterval); steam(false);
    document.getAnimations().forEach(a => a.cancel());
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = ""; $("pows").innerHTML = "";
    document.querySelectorAll(".mug").forEach(m => m.remove());
    scene("scWies"); camSet();
    ["aStW", "ubij", "rmower", "gruby", "pmower", "chudy", "trimmer", "chainsaw", "log1", "s1", "kraj", "woodpile", "s2", "zlom"].forEach(id => $(id).style.display = "none");
    $("aStArm").style.transform = ""; document.querySelectorAll(".flush").forEach(f => f.style.opacity = 0);
    $("board").setAttribute("x", -420);
    $("fade").style.opacity = 0; $("flash").style.opacity = 0;
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    const h = location.hash;
    if (!h) await ziomkiIntro2("RELAKS W ALTANIE", 16, 3, 1);

    // sasiedzi na swoich dzialkach (na razie cicho)
    pl("ubij", -1420, 806, 0.55, 1); pl("rmower", -1400, 860, 0.62, 1);
    pl("gruby", -860, 860, 0.62, 1); pl("pmower", -760, 860, 0.62, 1);
    pl("chudy", -260, 860, 0.62, 1); pl("trimmer", -232, 600, 0.62, 1);
    pl("s1", 1780, 860, 0.6, 1); pl("log1", 1990, 860, 0.62, 1); pl("chainsaw", 1830, 720, 0.6, 1);
    pl("kraj", 2470, 860, 0.62, 1); pl("woodpile", 2700, 860, 0.62, 1); pl("s2", 2300, 860, 0.6, 1);
    pl("zlom", 3020, 860, 0.62, -1);
    camSet(650, 600, 1.15);

    // ===== Andrzej robi kawke i idzie do altany =====
    put("aSt", 1200, 860, 0.62, -1);
    prop_mug();
    steam(true); birds(); every(2500, birds);
    await walk("aSt", 680, 2200);
    P.aSt.f = 1; draw("aSt");
    await AF(["Kaweczka, słoneczko…", "Wreszcie się zrelaksuję."], 400, 40);
    await sip();
    await AF("Aaa… cisza i spokój.", 700, 40);
    await sleep(800);

    // ===== 1. traktorek-kosiarka =====
    await goTo(-1400);
    tone(1800, 0.05, "square", 0.04); await sleep(250);
    pullCord(); await sleep(300);
    const m1 = motor(55, 70, 0.045); m1.set(85, 0.05, 0.5);
    const rw = [...$("rmower").querySelectorAll(".wr")].map(w => loopAnim(w, [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 500 }));
    let dir = 1, mx = -1400;
    every(40, () => { mx += dir * 3; if (mx > -1150) dir = -1; if (mx < -1600) dir = 1;
      pl("rmower", mx, 860, 0.62, dir); pl("ubij", mx - 30 * dir, 806, 0.55, dir);
      if (Math.random() < 0.2) bits(mx - 100 * dir, 850, 1, { color: "#5f9a3a", spread: 60, up: 40, size: 5 }); });
    await sleep(1500);
    await reaction(1);
    await AF("…", 300, 40);

    // ===== 2. kosiarka pchana =====
    await goTo(-800);
    for (let i = 0; i < 3; i++){ pullCord(); await anim($("fArmR"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-70deg)" }, { transform: "rotate(0deg)" }], { duration: 400 }); await sleep(250); if (i === 1) await F("f", "gruby", 400, "Odpalaj się, kurwa!", 100); }
    motor(95, 115, 0.04);
    let gx = -860, gd = 1;
    loopAnim($("fLegL"), [{ transform: "rotate(16deg)" }, { transform: "rotate(-16deg)" }], { duration: 350, direction: "alternate" });
    loopAnim($("fLegR"), [{ transform: "rotate(-16deg)" }, { transform: "rotate(16deg)" }], { duration: 350, direction: "alternate" });
    every(40, () => { gx += gd * 2.4; if (gx > -720) gd = -1; if (gx < -1000) gd = 1;
      pl("gruby", gx, 860, 0.62, gd); pl("pmower", gx + 100 * gd, 860, 0.62, gd); if (Math.random() < 0.25) bits(gx + 160 * gd, 850, 1, { color: "#5f9a3a", spread: 50, up: 50, size: 5 }); });
    await sleep(1400);
    await reaction(2);
    await AF("No bez jaj…", 300, 40);

    // ===== 3. podkaszarka STIHL =====
    await goTo(-200);
    pullCord(); await sleep(300); pullCord(); await sleep(200);
    motor(240, 290, 0.03); noiseLoop(5200, 2, 0.025);
    loopAnim($("trimmer").querySelector(".th"), [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 120 });
    loopAnim($("chudy").querySelector(".bob"), [{ transform: "rotate(-3deg)" }, { transform: "rotate(3deg)" }], { duration: 400, direction: "alternate" });
    every(90, () => bits(-232 + 190 * 0.62, 860 - 4, 2, { color: "#7fc85a", spread: 100, up: 90, size: 5, curl: true }));
    await sleep(1500);
    await reaction(3);

    // ===== 4. pila motorowa =====
    await goTo(1900);
    pullCord(); await sleep(300); pullCord(); await sleep(200);
    const m4 = motor(140, 160, 0.045);
    loopAnim($("chainsaw").querySelector(".chain"), [{ strokeDashoffset: 0 }, { strokeDashoffset: 28 }], { duration: 120 });
    every(1500, () => { m4.set(330, 0.07, 0.1); setTimeout(() => m4.set(160, 0.045, 0.3), 700); });
    every(80, () => bits(1830 + 230 * 0.6, 760, 2, { color: "#e8c890", spread: 70, up: 60, size: 4 }));
    loopAnim($("chainsaw"), [{ transform: "translate(1830px,720px) scale(0.6)" }, { transform: "translate(1830px,736px) scale(0.6)" }], { duration: 300, direction: "alternate" });
    await sleep(1500);
    await reaction(4);
    await AF(["Ludzie…", "przecież jest niedziela…"], 300, 40);

    // ===== 5. krajzega =====
    await goTo(2450);
    tone(300, 0.6, "sawtooth", 0.04, 900);
    noiseLoop(3600, 4, 0.025); const kOsc = motor(600, 900, 0.015);
    loopAnim($("blade"), [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 150 });
    let bxp = -420;
    every(40, () => { bxp += 3; if (bxp > -40){ bxp = -420; } $("board").setAttribute("x", bxp);
      if (bxp + 300 > 0){ kOsc.set(450, 0.03, 0.05); if (Math.random() < 0.6) bits(2470 + 60 * 0.62, 860 - 230 * 0.62, 2, { color: "#e8c890", spread: 140, up: 120, size: 5 }); } else kOsc.set(900, 0.015, 0.1); });
    await sleep(1800);
    await reaction(5);

    // ===== 6. pijany sasiad spiewa =====
    await goTo(3000);
    loopAnim($("zlom").querySelector(".bob"), [{ transform: "rotate(-6deg)" }, { transform: "rotate(6deg)" }], { duration: 700, direction: "alternate" });
    Object.assign(who.z, { el: "zlom", x: 3020, y: 860, head: 400 * 0.62 });
    const bz = await say("z", ["♪ Siejeje! A ja piję i chuj ci do tego,", "będę pił, ile będę chciał! ♪"], -200, { instant: true });
    talking("z", true);
    const words = [["Siejeje!", 1.6], ["A ja piję", 1.2], ["i chuj ci do tego,", 0.9], ["będę pił,", 1.4], ["ile będę chciał!", 1.1]];
    for (const [w, p] of words){ const sp_ = speak(w, who.z, { pitch: p, rate: 0.85 }); await Promise.race([sp_ || sleep(800), sleep(1600)]); }
    talking("z", false); await sleep(400); unsay(bz);
    await reaction(6);

    // ===== wszyscy naraz =====
    await camTo(800, 620, 0.34, 1600);
    every(2600, () => { const w = ["Siejeje!", "A ja piję!", "Będę pił!"][Math.floor(Math.random() * 3)]; speak(w, who.z, { pitch: 1.3, rate: 0.9 }); });
    await sleep(3500);
    await camTo(650, 620, 2.2, 900);
    red("aSt", 0.45, 300);
    steam(false);
    await armTo("aSt", 40, 120); thud(); bits(...mugXY(), 10, { color: "#6b3a1e", spread: 80, up: 80, size: 6 });
    await AF("No to się, kurwa, zrelaksowałem.", 1200, 40);
    stopAll(); lp.splice(0).forEach(a => a.cancel()); timers.splice(0).forEach(clearInterval);
    $("fade").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: "forwards" });
    await sleep(900);
    if (!h) await ziomkiOutro();
    $("endScreen").hidden = false; $("againBtn").focus();
  }
  function prop_mug(){ const g = document.createElementNS(NS, "g"); g.innerHTML = mugHTML; $("aStArm").append(g.firstChild); }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
