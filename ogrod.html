<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});

  // ---------- dzwiek (generowany) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  let master = null;
  function out(){ const a = ac(); if (!master){ master = a.createGain(); master.gain.value = 0.9; master.connect(a.destination); } return master; }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo, when = 0){
    const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out()); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(dur, { freq = 1000, q = 1, type = "bandpass", vol = 0.2, sweepTo, when = 0 } = {}){
    const a = ac(), t = a.currentTime + when;
    if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out()); s.start(t); s.stop(t + dur + 0.02);
  }

  // ---------- glosy: nagrania ElevenLabs (CLIPS wypelnia dubbing.py) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  const CLIPS = {
    "Gdzie on jest? Miał być skoro świt.": { src: "glosy/ogrod/say01.mp3", rate: 1 },
    "Miał być z samego rana. Gdzie on jest?": { src: "glosy/ogrod/say02.mp3", rate: 1 },
    "Co ja miałem dzisiaj robić? Chyba nie mam nic w planach.": { src: "glosy/ogrod/say03.mp3", rate: 1 },
    "Pogram sobie na konsoli.": { src: "glosy/ogrod/say04.mp3", rate: 1 },
    "Normalnie oszust. Umawiaj się z takim.": { src: "glosy/ogrod/say05.mp3", rate: 1 },
    "Pudzij no!": { src: "glosy/ogrod/say06.mp3", rate: 1 },
    "Miał dziś posprzątać na zimę. Ja to zrobię pługiem, jak nie ma czasu, oszust jeden.": { src: "glosy/ogrod/say07.mp3", rate: 1 },
    "Piękna robota. Wszystko przygotowane na kolejny sezon.": { src: "glosy/ogrod/say08.mp3", rate: 1 },
    "Co tam, Alina? Kiedy coś działamy?": { src: "glosy/ogrod/say09.mp3", rate: 1 },
    "Mieliśmy dziś sprzątać warzywnik!": { src: "glosy/ogrod/say10.mp3", rate: 1 },
    "Mieliśmy dziś sprzątać warzywnik!!": { src: "glosy/ogrod/say11.mp3", rate: 1 },
    "MIELIŚMY DZIŚ SPRZĄTAĆ WARZYWNIK!!!": { src: "glosy/ogrod/say12.mp3", rate: 1 },
    "MIELIŚMY DZIŚ SPRZĄTAĆ WARZYYYWNIIIK!!!": { src: "glosy/ogrod/say13.mp3", rate: 1 },
    "MIELIŚMY DZIŚ SPRZĄTAĆ WARZYYYYWNIIIIIK!!!!": { src: "glosy/ogrod/say14.mp3", rate: 1 }
  };

  const DEEP = 1;
  const clipEls = {};   // tylko wczytanie z wyprzedzeniem, nigdy nie grane
  // 3 odtwarzacze na wszystkie kwestie; na starcie odblokowane krotka cisza (bez puszczania nagran)
  const SILENT = "data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQIAAACAgA==";
  const voices = [new Audio(), new Audio(), new Audio()];
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){ const a = new Audio(); a.preload = "auto"; a.src = src; clipEls[src] = a; }
    return { src, rate };
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(clipFor);
    voices.forEach(v => { v.src = SILENT; v.play().catch(() => {}); });
  }
  let lastVoice = null;
  function playClip(c){
    const v = voices.find(x => x.paused || x.ended) || voices[0];
    lastVoice = v;
    return new Promise(res => {
      v.pause(); v.src = c.src; v.playbackRate = c.rate;
      v.preservesPitch = v.mozPreservesPitch = v.webkitPreservesPitch = c.rate === 1;
      const guard = setTimeout(res, 15000);
      v.onended = v.onerror = () => { clearTimeout(guard); res(); };
      v.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // ---------- mowienie: usta (.mC/.mO) w aktualnie widocznym egzemplarzu postaci ----------
  // who[k].el = id grupy postaci w biezacym ujeciu (zmieniane przez line(..., el))
  function flap(w, on){
    const el = $(w.el), mC = el && el.querySelector(".mC"), mO = el && el.querySelector(".mO");
    if (!mO) return;
    clearInterval(w._flap);
    let open = false;
    const set = o => { mC.style.display = o ? "none" : ""; mO.style.display = o ? "" : "none";
      mO.style.transformBox = "fill-box"; mO.style.transformOrigin = "50% 0";
      mO.style.transform = o ? `scaleY(${0.55 + Math.random() * 0.5})` : ""; };
    if (on) w._flap = setInterval(() => set(open = !open), 110);
    else set(false);
  }
  function talking(k, on){
    const w = who[k], bob = $(w.el) && $(w.el).querySelector(".bob");
    if (bob){
      if (on) w._talk = bob.animate([{ transform: "translateY(0)" }, { transform: "translateY(-5px)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
    }
    flap(w, on);
  }
  // kwestia bez dymka: glos + usta, potem pauza `hold`
  async function line(k, text, hold = 500, el){
    const w = who[k];
    if (el) w.el = el;
    talking(k, true);
    const spoken = speak(text, w);
    if (spoken) await spoken; else await sleep(600 + text.length * 55);
    talking(k, false);
    await sleep(hold);
  }

  // ===== DZWIEKI =====
  const sfx = {
    chapter(){ tone(55, 1.2, "sine", 0.6, 35); noise(0.5, { freq: 200, type: "lowpass", vol: 0.3 }); },
    glitch(){ tone(200 + Math.random() * 1800, 0.06, "square", 0.05); },
    krok(){ noise(0.12, { freq: 900 + Math.random() * 400, q: 0.8, vol: 0.22 }); },
    skrzyp(){ tone(420, 0.9, "sawtooth", 0.025, 680); tone(300, 0.9, "triangle", 0.03, 520); },
    pies(){ [0, 0.28].forEach(w => { tone(520, 0.12, "sawtooth", 0.04, 300, w); noise(0.1, { freq: 900, vol: 0.08, when: w }); }); },
    lyk(){ tone(180, 0.18, "sine", 0.25, 90); },
    kieliszek(){ tone(2400, 0.25, "sine", 0.06); tone(3100, 0.2, "sine", 0.03); },
    zapalka(){ noise(0.25, { freq: 3500, q: 1, vol: 0.2, sweepTo: 1200 }); },
    tlumik(){ noise(0.22, { freq: 400, type: "lowpass", vol: 0.9, sweepTo: 90 }); tone(70, 0.25, "sine", 0.6, 35); },
    // stek bolu (zenski) + dziwaczne uderzenie
    steknij(){ const a = ac(); [0, 0.05].forEach((w, i) => tone(i ? 310 : 260, 0.55, "sawtooth", 0.05, 170, w)); noise(0.5, { freq: 900, q: 4, vol: 0.12 }); },
    dziwne(){ tone(900, 0.7, "sine", 0.3, 70); tone(1400, 0.9, "triangle", 0.08, 2600); noise(0.15, { freq: 300, type: "lowpass", vol: 0.8 });
      [0.1, 0.22, 0.34].forEach(w => tone(160, 0.12, "square", 0.08, 120, w)); },
    // kruche pekniecie kosci: seria ostrych trzaskow + gluche uderzenie
    chrup(){ [0, .03, .07, .1, .16].forEach((w, i) => noise(.05 + i * .01, { freq: 2500 + Math.random() * 3000, q: 6, vol: .5, when: w }));
      tone(1800, .08, "square", .12, 400); tone(120, .25, "sine", .6, 50); noise(.2, { freq: 300, type: "lowpass", vol: .5 }); },
    siku(ms = 2600){ noise(ms / 1000, { freq: 3200, q: 2, vol: 0.12 }); },
    prrrt(){ const a = ac(), t = a.currentTime, o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), g = a.createGain();
      o.type = "square"; o.frequency.value = 75; l.frequency.value = 23; lg.gain.value = 30; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(g); g.connect(out()); o.start(t); l.start(t); o.stop(t + 1.25); l.stop(t + 1.25); },
    chlup(){ noise(0.6, { freq: 500, q: 1, vol: 0.25, sweepTo: 200 }); },
    bum(){ tone(90, 0.4, "sine", 0.7, 40); noise(0.3, { freq: 300, type: "lowpass", vol: 0.5 }); },
    plusk(){ noise(0.35, { freq: 1500, q: 1, vol: 0.2, sweepTo: 400 }); },
    syrena(ms = 3000){ for (let i = 0; i < ms / 600; i++) tone(i % 2 ? 660 : 880, 0.3, "triangle", 0.05, null, i * 0.3); },
    whoosh(){ noise(0.35, { freq: 600, q: 0.7, vol: 0.25, sweepTo: 2400 }); },
    drzwi(){ noise(0.15, { freq: 500, type: "lowpass", vol: 0.4 }); tone(110, 0.15, "square", 0.06, 70); }
  };
  // petle: silnik C-330, ogien/skwierczenie
  function loop(make){ let on = true; const step = () => { if (on){ make(); } }; const t = setInterval(step, 100); step(); return () => { on = false; clearInterval(t); }; }
  function silnik(rpm = 1){

    const eng = silnik(1); keep(() => eng.stop());
    const dym = keep(every(220, () => { const p = pos.trAlW; puff(p.x + 361 * .5, 800 - 245, { col: "#3a3a3a", r: 10, up: 120, ms: 1400, op: .8 }); }));
    await fadeIn(400);
    await crash({ x: 330, y: 560, k: 2.6 });
    await line("l", "Miał dziś posprzątać na zimę. Ja to zrobię pługiem, jak nie ma czasu, oszust jeden.", 300, "trAlAlP");
    eng.set(1.8);
    await camTo({ x: 800, y: 470, k: 1 }, 800);
    // orka przez szklarnie
    let zgniecione = false;
    const trB = $("trAlW").querySelector(".trBob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-4px)" }], { duration: 120, direction: "alternate", iterations: Infinity });
    document.querySelectorAll("#trAlW .kF, #trAlW .kR").forEach(w => w.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 900, iterations: Infinity }));
    await tween(7000, k => {
      const x = 240 + 2340 * k;
      pos.trAlW.x = x; $("trAlW").style.transform = `translate(${x}px,800px) scale(.5)`;
      $("orkaClipR").setAttribute("width", Math.max(0, x - 280 + 400));
      if (!zgniecione && x + 270 > 640){
        zgniecione = true; trzask(); shake(16, 600);
        tun.style.transformBox = "fill-box"; tun.style.transformOrigin = "50% 100%";
        tun.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(.15) scaleX(1.05)" }], { duration: 900, fill: "forwards", easing: "ease-in" });
        for (let i = 0; i < 26; i++){
          const p = document.createElementNS(NS, "path"), sx = 420 + Math.random() * 900, sy = 400 + Math.random() * 200;
          p.setAttribute("d", `M${sx} ${sy} l${20 + Math.random() * 40} ${-10 + Math.random() * 20} l${-10 + Math.random() * 20} ${20 + Math.random() * 30} Z`);
          p.setAttribute("fill", Math.random() < .7 ? "#9fd4b4" : "#a87c4e"); p.setAttribute("stroke", "#141414"); p.setAttribute("stroke-width", 3);
          $("folia").append(p);
          p.animate([{ transform: "translate(0px,0px) rotate(0deg)" }, { transform: `translate(${(Math.random() - .3) * 500}px,${-200 - Math.random() * 300}px) rotate(${Math.random() * 720}deg)`, offset: .5 },
                     { transform: `translate(${(Math.random() - .3) * 800}px,${200 + Math.random() * 200}px) rotate(${Math.random() * 1080}deg)`, opacity: 0 }], { duration: 2200, fill: "forwards", easing: "ease-out" });
        }
      }
    });
    trB.cancel(); dym(); stops.pop();
    await fadeOut(600); eng.stop(.4); stops.pop(); stopAll();
  }

  // ---------- 5. wieczor: kawka, Artur na motorze, wybuch ----------
  async function partWieczor(){
    shot("shOgrodWieczor", { x: 800, y: 470, k: 1 });
    place("alWiW", 700, 860, .6); place("hondaW", -700, 860, 1);
    const al = $("alWi"), cz = al.querySelector(".czerw");
    cz.getAnimations().forEach(a => a.cancel()); cz.style.transform = "scaleY(0)";
    al.querySelector(".szyja").setAttribute("fill", "#f0b48a"); al.querySelector(".dekolt").setAttribute("fill", "#f0b48a");
    ["brwiW", "oczyW"].forEach(c => al.querySelector("." + c).style.display = ""); ["brwiZ", "oczyZ"].forEach(c => al.querySelector("." + c).style.display = "none");
    await fadeIn(700);
    await caption("Wieczorem.", 1500);
    const kub = al.querySelector(".kubek");
    const para = keep(every(380, () => { const p = pt(kub, 58, -440); puff(p.x, p.y, { r: 6, up: 50, ms: 1500, op: .6 }); }));
    await camTo({ x: 720, y: 560, k: 1.8 }, 1400);
    sfx.lyk(); await sleep(500);
    await line("l", "Piękna robota. Wszystko przygotowane na kolejny sezon.", 600, "alWi");
    // motor
    await camTo({ x: 640, y: 520, k: 1.15 }, 700);
    const eng = silnik(2.2); keep(() => eng.stop());
    $("hondaB").animate([{ transform: "translateY(0)" }, { transform: "translateY(-3px)" }], { duration: 90, direction: "alternate", iterations: Infinity });
    await move("hondaW", 200, 860, 2600, "ease-out");
    eng.set(1); $("hondaB").getAnimations().forEach(a => a.cancel());
    await crash({ x: 330, y: 560, k: 2.0 });
    await line("t", "Co tam, Alina? Kiedy coś działamy?", 400, "arMoto");
    eng.stop(.3); stops.pop();
    // czerwienienie od szyi do wlosow + czajnik + para z uszu
    await crash({ x: 700, y: 470, k: 2.6 });
    para(); stops.splice(stops.indexOf(para), 1);
    ["brwiW", "oczyW"].forEach(c => al.querySelector("." + c).style.display = "none"); ["brwiZ", "oczyZ"].forEach(c => al.querySelector("." + c).style.display = "");
    const stopCz = czajnik(3600);
    al.querySelector(".szyja").setAttribute("fill", "#e8202a"); al.querySelector(".dekolt").setAttribute("fill", "#e8202a");
    const uL = al.querySelector(".uchoL"), uR = al.querySelector(".uchoR");
    let paraUszy = null;
    await anim(cz, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 3000, easing: "linear" });
    paraUszy = keep(every(70, () => { [[uL, 40], [uR, 266]].forEach(([u, x], i) => { const p = pt(u, x, 190); puff(p.x, p.y, { r: 9, up: 30, dx: i ? 140 : -140, ms: 900, op: .9, stroke: true }); }); }));
    const drz = $("alWi").querySelector(".bob").animate([{ transform: "translate(-3px,0px)" }, { transform: "translate(3px,0px)" }], { duration: 60, direction: "alternate", iterations: Infinity });
    await sleep(900);
    stopCz();
    // krzyk + kamera odjezdza
    vol(1);
    const krzyk = line("l", "Mieliśmy dziś sprzątać warzywnik!", 300, "alWi");
    shake(14, 900);
    await camTo({ x: 700, y: 500, k: 1 }, 900);
    await camTo({ x: 700, y: 560, k: .22 }, 2600, "ease-in");
    await krzyk;
    paraUszy(); drz.cancel();
    await fadeOut(300); stopAll();
  }

  // ---------- 6. coraz dalej: wies, samolot, kosmos, ksiezyc ----------
  async function partDaleko(){
    shot("shDaleko", { x: 800, y: 540, k: 1.6 });
    await fadeIn(300);
    vol(.85); who.l.vPitch = 1.2;
    const e = line("l", "Mieliśmy dziś sprzątać warzywnik!!", 200);
    await camTo({ x: 800, y: 500, k: .8 }, 2400, "ease-out");
    await e; await fadeOut(300);
    // samolot
    shot("shSamolot", { x: 800, y: 450, k: 1 });
    const sz = szum();
    $("samolot").animate([{ transform: "translate(-700px,380px)" }, { transform: "translate(1900px,300px)" }], { duration: 6000, fill: "forwards" });
    await fadeIn(300);
    await sleep(2200);
    vol(.7); who.l.vPitch = 1.35;
    $("pasazer").animate([{ transform: "translate(380px,-14px)" }, { transform: "translate(380px,-30px)" }], { duration: 150, direction: "alternate", iterations: 6 });
    await line("l", "MIELIŚMY DZIŚ SPRZĄTAĆ WARZYWNIK!!!", 200);
    await sleep(1200); sz(); stops.pop();
    await fadeOut(300);
    // kosmos
    shot("shKosmos", { x: 800, y: 450, k: 1 });
    const a1 = $("astro1"), kl = a1.querySelector(".klucz"), zn = a1.querySelector(".znak");
    zn.style.display = "none";
    kl.style.transformBox = "fill-box"; kl.style.transformOrigin = "0% 100%";
    const krec = kl.animate([{ transform: "rotate(-20deg)" }, { transform: "rotate(25deg)" }], { duration: 300, direction: "alternate", iterations: Infinity });
    const stuk = keep(every(300, () => tone(2200, .04, "square", .03)));
    $("statek").animate([{ transform: "translate(800px,420px) rotate(-2deg)" }, { transform: "translate(800px,430px) rotate(2deg)" }], { duration: 3000, direction: "alternate", iterations: Infinity });
    await fadeIn(400);
    await camTo({ x: 950, y: 380, k: 1.6 }, 2000);
    vol(.55); who.l.vPitch = 1.5;
    const e2 = line("l", "MIELIŚMY DZIŚ SPRZĄTAĆ WARZYYYWNIIIK!!!", 200);
    await sleep(500);
    krec.cancel(); stuk(); stops.pop();
    zn.style.display = ""; sfx.whoosh();
    await anim(zn, [{ transform: "scale(.2)" }, { transform: "scale(1.2)", offset: .6 }, { transform: "scale(1)" }], { duration: 400 });
    await e2; await sleep(800);
    await fadeOut(300);
    // ksiezyc: ladowanie
    shot("shKsiezyc", { x: 800, y: 450, k: 1 });
    show("astro2W", false); show("plomien");
    $("astro2").querySelector(".znak").style.display = "none";
    $("kurz").innerHTML = "";
    await fadeIn(300);
    const rak = keep(every(90, () => noise(.12, { freq: 250, type: "lowpass", vol: .4 })));
    const plo = $("plomien").animate([{ transform: "scaleY(.8)" }, { transform: "scaleY(1.2)" }], { duration: 80, direction: "alternate", iterations: Infinity });
    await anim($("ladownik"), [{ transform: "translate(760px,-300px)" }, { transform: "translate(760px,520px)" }], { duration: 3800, easing: "ease-out" });
    for (let i = 0; i < 14; i++) puff(760 + (Math.random() - .5) * 500, 610, { col: "#b8b8b4", r: 20, up: 40, dx: (Math.random() - .5) * 300, ms: 1800, op: .9 });
    plo.cancel(); show("plomien", false); rak(); stops.pop(); sfx.bum();
    await sleep(900);
    show("astro2W"); sfx.whoosh();
    await anim($("astro2W"), [{ transform: "translate(900px,700px)" }, { transform: "translate(980px,700px)" }], { duration: 900 });
    await camTo({ x: 900, y: 520, k: 1.4 }, 900);
    vol(.45); who.l.vPitch = 1.7;
    const e3 = line("l", "MIELIŚMY DZIŚ SPRZĄTAĆ WARZYYYYWNIIIIIK!!!!", 200);
    await sleep(400);
    const z2 = $("astro2").querySelector(".znak"); z2.style.display = ""; sfx.whoosh();
    await anim(z2, [{ transform: "scale(.2)" }, { transform: "scale(1.2)", offset: .6 }, { transform: "scale(1)" }], { duration: 400 });
    await e3; vol(1); who.l.vPitch = 1.05;
    await sleep(1400);
    await fadeOut(800); stopAll();
  }

  async function koniec(){
    $("chNr").textContent = ""; $("chTitle").textContent = "KONIEC BAJKI";
    show("chapter");
    await anim($("chapter"), [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
    await sleep(2400);
    $("chTitle").textContent = "SiKet produkcja";
    await sleep(2400);
    await anim($("chapter"), [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    show("chapter", false);
  }

  async function play(){
    $("startScreen").hidden = true; $("endScreen").hidden = true; ac();
    stopAll(); vol(1); who.l.vPitch = 1.05;
    $("fade").style.opacity = 1;
    const h = location.hash;
    const parts = [["#start", partStart], ["#sypialnia", partSypialnia], ["#rano", partOgrodRano], ["#artur", partArtur],
                   ["#wkurzona", partWkurzona], ["#wieczor", partWieczor], ["#daleko", partDaleko]];
    let on = !h || h === "#x";
    for (const [id, fn] of parts){ if (id === h) on = true; if (on) await fn(); }
    await koniec();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
