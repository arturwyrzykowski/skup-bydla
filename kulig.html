<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});

  // ---------- dzwiek (generowany) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  let master = null;
  function out(){ const a = ac(); if (!master){ master = a.createGain(); master.gain.value = 0.9; master.connect(a.destination); } return master; }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo, when = 0){
    const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out()); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(dur, { freq = 1000, q = 1, type = "bandpass", vol = 0.2, sweepTo, when = 0 } = {}){
    const a = ac(), t = a.currentTime + when;
    if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out()); s.start(t); s.stop(t + dur + 0.02);
  }

  // ---------- glosy: nagrania ElevenLabs (CLIPS wypelnia dubbing.py) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  const CLIPS = {};

  const DEEP = 1;
  const clipEls = {};   // tylko wczytanie z wyprzedzeniem, nigdy nie grane
  // 3 odtwarzacze na wszystkie kwestie; na starcie odblokowane krotka cisza (bez puszczania nagran)
  const SILENT = "data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQIAAACAgA==";
  const voices = [new Audio(), new Audio(), new Audio()];
  function clipFor(text){
    const c = CLIPS[text];
    if (!c) return null;
    const src = c.src || c, rate = c.rate || DEEP;
    if (!clipEls[src]){ const a = new Audio(); a.preload = "auto"; a.src = src; clipEls[src] = a; }
    return { src, rate };
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(clipFor);
    voices.forEach(v => { v.src = SILENT; v.play().catch(() => {}); });
  }
  let lastVoice = null;
  function playClip(c){
    const v = voices.find(x => x.paused || x.ended) || voices[0];
    lastVoice = v;
    return new Promise(res => {
      v.pause(); v.src = c.src; v.playbackRate = c.rate;
      v.preservesPitch = v.mozPreservesPitch = v.webkitPreservesPitch = c.rate === 1;
      const guard = setTimeout(res, 15000);
      v.onended = v.onerror = () => { clearTimeout(guard); res(); };
      v.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // ---------- mowienie: usta (.mC/.mO) w aktualnie widocznym egzemplarzu postaci ----------
  // who[k].el = id grupy postaci w biezacym ujeciu (zmieniane przez line(..., el))
  function flap(w, on){
    const el = $(w.el), mC = el && el.querySelector(".mC"), mO = el && el.querySelector(".mO");
    if (!mO) return;
    clearInterval(w._flap);
    let open = false;
    const set = o => { mC.style.display = o ? "none" : ""; mO.style.display = o ? "" : "none";
      mO.style.transformBox = "fill-box"; mO.style.transformOrigin = "50% 0";
      mO.style.transform = o ? `scaleY(${0.55 + Math.random() * 0.5})` : ""; };
    if (on) w._flap = setInterval(() => set(open = !open), 110);
    else set(false);
  }
  function talking(k, on){
    const w = who[k], bob = $(w.el) && $(w.el).querySelector(".bob");
    if (bob){
      if (on) w._talk = bob.animate([{ transform: "translateY(0)" }, { transform: "translateY(-5px)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
    }
    flap(w, on);
  }
  // kwestia bez dymka: glos + usta, potem pauza `hold`
  async function line(k, text, hold = 500, el){
    const w = who[k];
    if (el) w.el = el;
    talking(k, true);
    const spoken = speak(text, w);
    if (spoken) await spoken; else await sleep(600 + text.length * 55);
    talking(k, false);
    await sleep(hold);
  }

  // ===== DZWIEKI =====
  const sfx = {
    chapter(){ tone(55, 1.2, "sine", 0.6, 35); noise(0.5, { freq: 200, type: "lowpass", vol: 0.3 }); },
    glitch(){ tone(200 + Math.random() * 1800, 0.06, "square", 0.05); },
    krok(){ noise(0.12, { freq: 900 + Math.random() * 400, q: 0.8, vol: 0.22 }); },
    skrzyp(){ tone(420, 0.9, "sawtooth", 0.025, 680); tone(300, 0.9, "triangle", 0.03, 520); },
    pies(){ [0, 0.28].forEach(w => { tone(520, 0.12, "sawtooth", 0.04, 300, w); noise(0.1, { freq: 900, vol: 0.08, when: w }); }); },
    lyk(){ tone(180, 0.18, "sine", 0.25, 90); },
    kieliszek(){ tone(2400, 0.25, "sine", 0.06); tone(3100, 0.2, "sine", 0.03); },
    zapalka(){ noise(0.25, { freq: 3500, q: 1, vol: 0.2, sweepTo: 1200 }); },
    tlumik(){ noise(0.22, { freq: 400, type: "lowpass", vol: 0.9, sweepTo: 90 }); tone(70, 0.25, "sine", 0.6, 35); },
    // stek bolu (zenski) + dziwaczne uderzenie
    steknij(){ const a = ac(); [0, 0.05].forEach((w, i) => tone(i ? 310 : 260, 0.55, "sawtooth", 0.05, 170, w)); noise(0.5, { freq: 900, q: 4, vol: 0.12 }); },
    dziwne(){ tone(900, 0.7, "sine", 0.3, 70); tone(1400, 0.9, "triangle", 0.08, 2600); noise(0.15, { freq: 300, type: "lowpass", vol: 0.8 });
      [0.1, 0.22, 0.34].forEach(w => tone(160, 0.12, "square", 0.08, 120, w)); },
    siku(ms = 2600){ noise(ms / 1000, { freq: 3200, q: 2, vol: 0.12 }); },
    prrrt(){ const a = ac(), t = a.currentTime, o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), g = a.createGain();
      o.type = "square"; o.frequency.value = 75; l.frequency.value = 23; lg.gain.value = 30; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(g); g.connect(out()); o.start(t); l.start(t); o.stop(t + 1.25); l.stop(t + 1.25); },
    chlup(){ noise(0.6, { freq: 500, q: 1, vol: 0.25, sweepTo: 200 }); },
    bum(){ tone(90, 0.4, "sine", 0.7, 40); noise(0.3, { freq: 300, type: "lowpass", vol: 0.5 }); },
    plusk(){ noise(0.35, { freq: 1500, q: 1, vol: 0.2, sweepTo: 400 }); },
    syrena(ms = 3000){ for (let i = 0; i < ms / 600; i++) tone(i % 2 ? 660 : 880, 0.3, "triangle", 0.05, null, i * 0.3); },
    whoosh(){ noise(0.35, { freq: 600, q: 0.7, vol: 0.25, sweepTo: 2400 }); },
    drzwi(){ noise(0.15, { freq: 500, type: "lowpass", vol: 0.4 }); tone(110, 0.15, "square", 0.06, 70); }
  };
  // petle: silnik C-330, ogien/skwierczenie
  function loop(make){ let on = true; const step = () => { if (on){ make(); } }; const t = setInterval(step, 100); step(); return () => { on = false; clearInterval(t); }; }
  function silnik(rpm = 1){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), o2 = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = "square"; o2.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 500; g.gain.value = 0.0001;
    lfo.frequency.value = 11; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(out()); o.start(); o2.start(); lfo.start();
    const set = (r, ramp = 0.4) => { const n = a.currentTime; o.frequency.linearRampToValueAtTime(32 * r, n + ramp); o2.frequency.linearRampToValueAtTime(64.5 * r, n + ramp);
      lfo.frequency.linearRampToValueAtTime(11 * r, n + ramp); g.gain.linearRampToValueAtTime(0.09, n + ramp); f.frequency.linearRampToValueAtTime(380 + 300 * r, n + ramp); };
    set(rpm, 0.6);
    return { set, stop(ramp = 0.6){ const n = a.currentTime; g.gain.cancelScheduledValues(n); g.gain.linearRampToValueAtTime(0.0001, n + ramp); [o, o2, lfo].forEach(x => x.stop(n + ramp + 0.05)); } };
  }
  const skwierczy = () => loop(() => { if (Math.random() < 0.6) noise(0.05, { freq: 4000 + Math.random() * 3000, q: 3, vol: 0.06 }); });

  // ===== MUZYKA: wlasny energiczny podklad klubowy (128 BPM, a-moll) =====
  const music = {
    kulig(){
      const a = ac(), bpm = 128, b = 60 / bpm, bus = a.createGain(); bus.gain.value = 0.55; bus.connect(out());
      const N = n => 440 * Math.pow(2, (n - 69) / 12);
      const bass = [45, 45, 48, 50, 45, 45, 52, 50];          // A A C D A A E D (po takcie)
      const lead = [69, 72, 76, 72, 74, 72, 71, 67, 69, 72, 76, 79, 77, 76, 74, 72];
      const kick = t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
        g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.32); };
      const hat = t => { const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); noise(0.001, { vol: 0.0001 });
        s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 8000; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + 0.06); };
      const saw = (t, freq, dur, vol, cut, det = [0]) => det.forEach(d => { const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
        o.type = "sawtooth"; o.frequency.value = freq; o.detune.value = d; f.type = "lowpass"; f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(cut / 4, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02); });
      let step = 0, next = a.currentTime + 0.05, on = true;
      const crash = t => { const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 3000;
        g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.6); s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + 1.7); };
      noise(0.001, { vol: 0.0001 });   // tworzy noiseBuf
      crash(next);
      const tick = setInterval(() => {
        while (on && next < a.currentTime + 0.2){
          const s16 = step % 16, bar = Math.floor(step / 16);
          if (s16 % 4 === 0) kick(next);
          if (s16 % 4 === 2) { hat(next); saw(next, N(bass[bar % 8] - 12), b / 2, 0.16, 900); }
          if (s16 % 2 === 0 && bar >= 2) saw(next, N(lead[(step / 2) % 16]), b / 2.2, 0.05, 3800, [-14, 0, 14]);
          if (s16 === 0 && bar % 8 === 0 && bar) crash(next);
          next += b / 4; step++;
        }
      }, 50);
      return { stop(ms = 400){ on = false; clearInterval(tick); bus.gain.linearRampToValueAtTime(0.0001, a.currentTime + ms / 1000); } };
    }
  };

  // ===== KINO: ujecia, kamera, pasy, plansze, ziarno =====
  // ujecie = <g id="sh..."> w #shots; widoczne tylko jedno naraz
  const SHOTS = [...document.querySelectorAll("#shots > g.shot")];
  let curShot = null;
  function shot(id, c = { x: 800, y: 450, k: 1 }){
    SHOTS.forEach(g => g.style.display = g.id === id ? "" : "none");
    curShot = id; $("fx2").innerHTML = "";
    camSet(c);
  }
  // kamera = transform #shots: punkt (x,y) ujecia na srodku ekranu, powiekszenie k
  const camT = c => `translate(800px,450px) scale(${c.k}) translate(${-c.x}px,${-c.y}px)`;
  let cam = { x: 800, y: 450, k: 1 };
  function camSet(c){ cam = { ...cam, ...c }; $("shots").getAnimations().forEach(a => a.cancel()); $("shots").style.transform = camT(cam); }
  async function camTo(c, ms, easing = "ease-in-out"){
    const from = camT(cam), to = { ...cam, ...c };
    cam = to;
    await anim($("shots"), [{ transform: from }, { transform: camT(to) }], { duration: ms, easing });
  }
  const crash = (c, ms = 170) => camTo(c, ms, "cubic-bezier(.2,.9,.2,1)");   // szybki najazd (Tarantino)
  function shake(power = 12, ms = 400){
    const f = [0, 1, 2, 3, 4, 5, 6].map(i => ({ transform: i === 6 ? "translate(0px,0px)" :
      `translate(${(Math.random() - .5) * power * 2}px,${(Math.random() - .5) * power * 2}px)` }));
    return $("cam").animate(f, { duration: ms }).finished.catch(() => {});
  }
  // plansza rozdzialu
  async function chapter(nr, title, ms = 2000){
    $("chNr").textContent = "ROZDZIAŁ " + nr; $("chTitle").textContent = title;
    $("chapter").style.display = ""; sfx.chapter();
    await anim($("chapter"), [{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
    await sleep(ms);
    await anim($("chapter"), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
    $("chapter").style.display = "none";
  }
  // napis w kadrze (np. nazwa miejsca) - zolty, w dolnym pasie
  async function caption(txt, ms = 2200){
    $("capTxt").textContent = txt; $("capTxt").style.display = "";
    await anim($("capTxt"), [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    await sleep(ms);
    await anim($("capTxt"), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
    $("capTxt").style.display = "none";
  }
  // zatrzymana klatka: animacje staja, biale mrugniecie
  async function freeze(ms = 1200){
    const all = document.getAnimations().filter(a => a.playState === "running");
    all.forEach(a => a.pause());
    flash(0.85);
    await sleep(ms);
    all.forEach(a => { try { a.play(); } catch (e) {} });
  }
  function flash(op = 0.8){ $("flash").animate([{ opacity: op }, { opacity: 0 }], { duration: 220 }); }
  async function fadeOut(ms = 500){ await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: ms }); }
  async function fadeIn(ms = 500){ await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: ms }); }
  // glitch (zawieszony obraz): szarpanie kadru i kolorowe paski
  async function glitch(ms = 1800){
    const t0 = performance.now(), bars = [...document.querySelectorAll("#glitch rect")];
    $("glitch").style.display = "";
    while (performance.now() - t0 < ms){
      $("cam").style.transform = `translate(${(Math.random() - .5) * 50}px,${(Math.random() - .5) * 12}px)`;
      bars.forEach(b => { b.setAttribute("y", Math.random() * 860); b.setAttribute("height", 8 + Math.random() * 90); b.setAttribute("x", (Math.random() - .5) * 200); });
      sfx.glitch();
      await sleep(80);
    }
    $("cam").style.transform = ""; $("glitch").style.display = "none";
  }
  // snieg w petli (warstwa nad ujeciem, niezalezna od kamery)
  function snow(on, n = 110, wind = 120){
    $("snow").innerHTML = ""; $("snow").style.display = on ? "" : "none";
    if (!on) return;
    for (let i = 0; i < n; i++){
      const c = document.createElementNS(NS, "circle"), r = 1.5 + Math.random() * 4;
      c.setAttribute("cx", Math.random() * 1800 - 100); c.setAttribute("cy", -20); c.setAttribute("r", r);
      c.setAttribute("fill", "#fff"); c.setAttribute("opacity", 0.5 + r / 10);
      $("snow").append(c);
      const d = 5000 + Math.random() * 5000;
      c.animate([{ transform: "translate(0px,0px)" }, { transform: `translate(${(Math.random() - .3) * wind}px,960px)` }],
        { duration: d, delay: -Math.random() * d, iterations: Infinity });
    }
  }
  // oblok (para z ust, dym) w ukladzie biezacego ujecia (#fx2 jest w #shots)
  function puff(x, y, { col = "#fff", r = 14, up = 60, dx = 0, ms = 1400, op = 0.7, stroke = false } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r); c.setAttribute("fill", col);
    if (stroke){ c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", 3); }
    c.style.transformBox = "fill-box"; c.style.transformOrigin = "center";
    $("fx2").append(c);
    c.animate([{ transform: "translate(0px,0px) scale(.4)", opacity: op },
               { transform: `translate(${dx + (Math.random() - .5) * 40}px,${-up}px) scale(2.4)`, opacity: 0 }],
      { duration: ms, easing: "ease-out", fill: "forwards" }).finished.then(() => c.remove()).catch(() => {});
  }
  const breath = (x, y, dx = 20) => puff(x, y, { r: 7, up: 26, dx, ms: 1000, op: 0.6 });
  function smoke(x, y, n = 6, col = "#2a2a2a", r = 22){ for (let i = 0; i < n; i++) setTimeout(() => puff(x, y, { col, r, up: 180, ms: 1900, op: 0.9 }), i * 110); }
  // powtarzaj fn co ms, az do stop()
  function every(ms, fn){ fn(); const t = setInterval(fn, ms); return () => clearInterval(t); }
  // ziarno filmu "drga"
  setInterval(() => { const t = $("grainT"); if (t) t.setAttribute("seed", Math.random() * 99 | 0); }, 90);

  const who = {
    a: { el: "aAlma", vPitch: 0.8, vRate: 1.15 },
    r: { el: "rAlma", vPitch: 0.95, vRate: 1.05 },
    s: { el: "sAlma", vPitch: 0.2, vRate: 0.9 },
    u: { el: "uKulig", vPitch: 0.55, vRate: 1.0 },
    n: { el: "nKulig", vPitch: 1.4, vRate: 1.1 },
    p: { el: "pKrzak", vPitch: 0.7, vRate: 1.0 },
    m: { el: "mSor", vPitch: 0.6, vRate: 1.0 }
  };

  // ===== SCENARIUSZ =====
  const stops = [];                 // petle do zatrzymania przy zmianie rozdzialu
  const keep = f => (stops.push(f), f);
  function stopAll(){ while (stops.length) { try { stops.pop()(); } catch (e) {} } }
  const gile = () => document.querySelectorAll(".gil").forEach(e => e.animate(
    [{ transform: "scaleY(1)" }, { transform: "scaleY(1.5)" }, { transform: "scaleY(0.6)" }, { transform: "scaleY(1)" }],
    { duration: 2600, iterations: Infinity, easing: "ease-in-out" }));
  const zary = () => document.querySelectorAll(".zar").forEach(e => e.animate([{ opacity: 1 }, { opacity: .45 }], { duration: 500, direction: "alternate", iterations: Infinity }));

  // przesuniecie wrappera postaci/rekwizytu (atrybut transform -> CSS transform)
  function moveW(id, x0, y0, x1, y1, s, ms, easing = "linear"){
    return anim($(id), [{ transform: `translate(${x0}px,${y0}px) scale(${s})` }, { transform: `translate(${x1}px,${y1}px) scale(${s})` }], { duration: ms, easing });
  }
  // chod: nogi wymachuja (klasy .legL/.legR w postaci)
  function legsGo(id, on, ms = 380){
    $(id).querySelectorAll(".legL,.legR").forEach((l, i) => {
      l.getAnimations().forEach(a => a.cancel());
      if (on) l.animate([{ transform: `rotate(${i ? -18 : 18}deg)` }, { transform: `rotate(${i ? 18 : -18}deg)` }], { duration: ms, direction: "alternate", iterations: Infinity, easing: "ease-in-out" });
    });
  }

  // ---------- ROZDZIAL I: ALMA ----------
  async function partAlma(){
    await chapter("I", "ALMA");
    shot("shAlma", { x: 800, y: 450, k: 1 }); snow(true);
    gile(); zary();
    // para z ust + dym z fajek u trzech chlopakow
    keep(every(1500, () => { breath(920, 300); breath(1052, 300); breath(1184, 298); }));
    keep(every(2100, () => { puff(1086, 120, { col: "#9aa3ad", r: 24, up: 120, ms: 2600, op: .6 }); }));
    await fadeIn(600);
    await caption("Zima. Pod sklepem.", 1800);
    await camTo({ x: 1030, y: 470, k: 1.9 }, 2600);
    await line("a", "Może by zrobić kulig?", 400, "aAlma");
    await crash({ x: 1040, y: 380, k: 3.2 });
    await line("s", "A sanki masz?", 300, "sAlma");
    await crash({ x: 900, y: 380, k: 3.2 });
    await line("a", "Nie.", 600, "aAlma");
    // zblizenie: gil
    shot("shGil", { x: 800, y: 600, k: 1 });
    keep(every(1300, () => breath(800, 745, 40)));
    await camTo({ x: 760, y: 680, k: 1.45 }, 2400);
    await sleep(300);
    shot("shAlma", { x: 1100, y: 470, k: 2.2 });
    await line("r", "To se pożyczymy.", 700, "rAlma");
    sfx.lyk();
    await sleep(600);
    await fadeOut(600); stopAll(); snow(false);
  }

  // ---------- ROZDZIAL II: SZKOLA ----------
  async function partSzkola(){
    await chapter("II", "SZKOŁA");
    shot("shSzkola", { x: 800, y: 450, k: 1 }); snow(true, 50, 60);
    document.querySelectorAll(".gw").forEach((e, i) => e.animate([{ opacity: 1 }, { opacity: .3 }], { duration: 900 + (i % 7) * 250, direction: "alternate", iterations: Infinity }));
    // latarki omiataja snieg
    document.querySelectorAll("#beams .beamR").forEach((b, i) => b.animate([{ transform: "rotate(-6deg)" }, { transform: "rotate(16deg)" }], { duration: 1300 + i * 270, direction: "alternate", iterations: Infinity, easing: "ease-in-out" }));
    await fadeIn(700);
    caption("Tej samej nocy.", 1800);
    sfx.pies();
    const go = [["aNoc", -200, 690, 1000], ["sNoc", -360, 700, 870], ["rNoc", -520, 690, 740]];
    const beamsOf = { aNoc: "bA", sNoc: "bS", rNoc: "bR" };
    keep(every(330, () => sfx.krok()));
    await Promise.all(go.map(([id, x0, y, x1]) => { legsGo(id, true);
      return Promise.all([moveW(id + "W", x0, y, x1, y, .7, 5200), anim($(beamsOf[id]), [{ transform: `translate(${x0 + 92 * .7}px,${y - 124 * .7}px)` }, { transform: `translate(${x1 + 92 * .7}px,${y - 124 * .7}px)` }], { duration: 5200, easing: "linear" })]); }));
    stopAll(); go.forEach(([id]) => legsGo(id, false));
    await camTo({ x: 1230, y: 540, k: 1.9 }, 1600);
    sfx.skrzyp();
    await anim($("shedDoor"), [{ transform: "scaleX(1)" }, { transform: "scaleX(-0.35)" }], { duration: 1100, easing: "ease-in-out" });
    await sleep(300);
    // zblizenie: tabliczka w swietle latarki
    shot("shTabliczka", { x: 800, y: 450, k: 1 });
    const sp = $("spot");
    await anim(sp, [{ transform: "translate(-100px,300px)" }, { transform: "translate(440px,470px)" }], { duration: 1400, easing: "ease-out" });
    await camTo({ x: 470, y: 470, k: 1.5 }, 900);
    await sleep(900);
    camSet({ x: 800, y: 450, k: 1 });
    await anim(sp, [{ transform: "translate(440px,470px)" }, { transform: "translate(1020px,560px)" }], { duration: 1100, easing: "ease-in-out" });
    await sleep(700);
    // ucieczka na tle ksiezyca
    shot("shUcieczka", { x: 800, y: 450, k: 1 }); snow(true, 40, 60);
    sfx.pies();
    const run = [["aUc", -200, 1900], ["sUc", -420, 1700], ["rUc", -640, 1500]];
    run.forEach(([id]) => legsGo(id, true, 200));
    keep(every(200, () => sfx.krok()));
    await Promise.all(run.map(([id, x0, x1], i) => moveW(id + "W", x0, 700, x1 + 600, 700, .75, 4200 + i * 300)));
    stopAll(); sfx.pies();
    await fadeOut(700); snow(false);
  }

  async function play(){
    $("startScreen").hidden = true; $("endScreen").hidden = true; ac();
    $("fade").style.opacity = 1;
    const h = location.hash;
    if (!h) { $("fade").style.opacity = 0; await ziomkiIntro2("KULIG", 21, 3, 1); $("fade").style.opacity = 1; }
    const parts = [["#alma", partAlma], ["#szkola", partSzkola]];
    let on = !h;
    for (const [id, fn] of parts){ if (id === h) on = true; if (on) await fn(); }
    if (!h) await ziomkiOutro();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
