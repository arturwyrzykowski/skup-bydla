<script src="intro.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    stomp(){ tone(150, 0.3, "sine", 0.55, 38); noise(0.14, { freq: 320, type: "lowpass", vol: 0.3 }); },
    squelch(){ noise(0.35, { freq: 420, q: 3, vol: 0.4, sweepTo: 160 }); tone(90, 0.3, "sine", 0.3, 50); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scField"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    s1: { el: "s1", img: true, x: -300, y: 800, s: 1, head: 385, pitch: 170, vPitch: 0.7, vRate: 1.0 },
    s2: { el: "s2", img: true, x: -150, y: 800, s: 1, head: 385, pitch: 210, vPitch: 0.95, vRate: 1.05 },
    m:  { el: "mirek", img: true, x: 0, y: 800, s: 1, head: 385, pitch: 85, vPitch: 0, vRate: 0.85 },
    u:  { el: "ubij", x: 360, y: 800, s: 0.95, head: 470, pitch: 150, vPitch: 0.75, vRate: 1.1, mouthO: "uMouthO", mouthC: "uMouthC" }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing(k + "LegL", 24); swing(k + "LegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  // nagrane kwestie (kierowca): odtwarzane wolniej i bez zachowania wysokosci = bardzo niski, gruby glos
  const CLIPS = {
    "Co, zakopał się?": "glosy/kierowca5.m4a",
    "Paweł, chodź, żeby mi nie wiało w mikrofon… ustań, żeby nie wiało.": "glosy/kierowca6.m4a",
    "Kurde, nie mam karty pamięci.": "glosy/kierowca7.m4a",
    "Widzisz, koło się zapada, siądzie znowu.": "glosy/kierowca8.m4a",
    "Saper, wypierdalaj sprzed kamery!": "glosy/kierowca9.m4a"
  };

  const DEEP = 0.55;
  const clipEls = {};
  function clipFor(text){
    const src = CLIPS[text];
    if (!src) return null;
    if (!clipEls[src]){
      const a = new Audio(src); a.preload = "auto";
      a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
      clipEls[src] = a;
    }
    return clipEls[src];
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(t => { const a = clipFor(t); a.muted = true;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); });
  }
  function playClip(a){
    return new Promise(res => {
      a.currentTime = 0; a.playbackRate = DEEP;
      a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
      const guard = setTimeout(res, 8000);
      a.onended = a.onerror = () => { clearTimeout(guard); res(); };
      a.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  function talking(k, on){
    const w = who[k];
    if (w.img){
      if (on) w._talk = $(w.el).querySelector(".bob").animate(
        [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(-8px) scaleY(1.02)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
      return;
    }
    clearInterval(w._talk);
    let open = false;
    if (on) w._talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    else { $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = ""; }
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){
    const w = who[k], tx = w.x, ty = w.y - w.head;
    const b = makeBubble(tx, ty, lines, shift);
    await anim(b.g, [{ transform: `translate(${tx}px,${ty}px) scale(0)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }],
               { duration: 200, easing: "cubic-bezier(.3,1.6,.6,1)" });
    if (instant){ b.spans.forEach((s, i) => s.textContent = lines[i]); return b; }
    talking(k, true);
    const spoken = speak(lines.join(" "), w, { pitch, rate });
    for (let i = 0; i < lines.length; i++){
      for (const ch of lines[i]){
        b.spans[i].textContent += ch;
        if (ch !== " " && !spoken) sfx.voice(w.pitch);
        await sleep(spoken ? 45 : 58);
      }
    }
    if (spoken) await spoken;
    talking(k, false);
    return b;
  }
  async function unsay(b){
    await anim(b.g, [{ transform: `translate(${b.tipX}px,${b.tipY}px) scale(1)` }, { transform: `translate(${b.tipX}px,${b.tipY}px) scale(0)` }], { duration: 150 });
    b.g.remove();
  }
  async function line(k, lines, hold = 1600, shift = 0, opts){
    const b = await say(k, lines, shift, opts);
    await sleep(hold); await unsay(b); await sleep(250);
  }

  // ---------- rekwizyty ----------
  let wheelAnims = [];
  function spinWheels(dir, period = 0.5){
    wheelAnims.forEach(a => a.cancel()); wheelAnims = [];
    if (!dir) return;
    document.querySelectorAll("#bus .bw").forEach(w => wheelAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${dir * 360}deg)` }],
                { duration: period * 1000, iterations: Infinity })));
  }
  let busX = 1750;
  async function busDrive(x, dur, easing = "cubic-bezier(.2,.7,.35,1)", y = 494){
    const from = busT(busX, y); busX = x;
    await anim($("bus"), [{ transform: from }, { transform: busT(x, y) }], { duration: dur, easing });
  }
  function exhaust(y = 494){ return setInterval(() => puff(busX + 600, y + 250, { r: 18, dur: 1000, dx: 50, dy: -40, color: "#9a9a9a" }), 140); }

  // wykrywacz: pierscienie przy talerzu wykrywacza + pisk, coraz szybciej
  async function detector(times){
    const hx = who.s2.x + 86, hy = who.s2.y - 26;
    for (let i = 0; i < times; i++){
      sfx.beep();
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", hx); c.setAttribute("cy", hy); c.setAttribute("r", 20);
      c.setAttribute("fill", "none"); c.setAttribute("stroke", "#ffd23f"); c.setAttribute("stroke-width", "6");
      c.style.transformOrigin = `${hx}px ${hy}px`;
      $("detFx").append(c);
      c.animate([{ transform: "scale(.4)", opacity: 1 }, { transform: "scale(3)", opacity: 0 }], { duration: 600, fill: "forwards" })
       .finished.then(() => c.remove()).catch(() => {});
      await sleep(Math.max(90, 520 - i * 38));
    }
  }

  // papierosy: czubek wzgledem stop postaci
  const CIG_TIP = { s1: [32, -252], s2: [16, -285], m: [36, -270] };
  let cigSmoke = null;
  function smokeCigs(on, ks = ["s1", "s2"]){
    clearInterval(cigSmoke);
    ["s1", "s2", "m"].forEach(k => $(who[k].el).querySelector(".cig").style.display = on && ks.includes(k) ? "" : "none");
    if (!on) return;
    cigSmoke = setInterval(() => ks.forEach(k => {
      const [dx, dy] = CIG_TIP[k];
      puff(who[k].x + dx, who[k].y + dy - 6, { r: 7, dur: 1600, dx: 10 + Math.random() * 20, dy: -90, color: "#cfcfcf" });
    }), 380);
  }
  function burp(){ const a = ac(), t = a.currentTime;
    tone(95 + Math.random() * 30, 0.55, "sawtooth", 0.12, 55); noise(0.45, { freq: 260, q: 4, vol: 0.25 }); }
  function gulp(){ tone(180, 0.09, "sine", 0.15, 90); }
  // przesuniecie puszki do ust [dx, dy, obrot]: wieczko przy ustach, dno do gory
  const SIP = { s1: [20, -212, 110], s2: [-40, -194, -110], m: [-21, -186, -110] };
  async function drink(ks){
    const up = k => `translate(${SIP[k][0]}px,${SIP[k][1]}px) rotate(${SIP[k][2]}deg)`;
    const rest = "translate(0,0) rotate(0deg)";
    await Promise.all(ks.map(k => anim($(who[k].el).querySelector(".can"), [{ transform: rest }, { transform: up(k) }], { duration: 450, easing: "ease-out" })));
    for (let i = 0; i < 4; i++){ gulp(); await sleep(260); }
    await Promise.all(ks.map(k => anim($(who[k].el).querySelector(".can"), [{ transform: up(k) }, { transform: rest }], { duration: 400 })));
  }
  function lighter(){ noise(0.06, { freq: 5000, q: 2, vol: 0.15 }); tone(300, 0.2, "sine", 0.02); }


  // ---------- koparka ----------
  let catWheels = [];
  function spinCat(period){
    catWheels.forEach(a => a.cancel()); catWheels = [];
    if (!period) return;
    document.querySelectorAll("#scField .cw").forEach(w => catWheels.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: period * 1000, iterations: Infinity })));
  }
  // bloto spod kol (tylne kolo pryska do tylu = w lewo)
  function mudSpray(ms, strong = false){
    const t = setInterval(() => {
      for (let i = 0; i < (strong ? 4 : 2); i++){
        clod(830 + Math.random() * 60, 700, -(180 + Math.random() * (strong ? 420 : 220)), 120 + Math.random() * 160);
        if (strong) clod(1150 + Math.random() * 40, 720, 160 + Math.random() * 360, 120 + Math.random() * 160);
      }
    }, 90);
    return sleep(ms).then(() => clearInterval(t));
  }
  function catSmoke(){ return setInterval(() => puff(1058, 450, { r: 16, dur: 1200, dx: -30, dy: -90, color: "#555" }), 180); }
  async function catLift(cat){
    cat.set(115, 0.18, 0.3);
    await anim($("boom"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-14deg)" }], { duration: 600, easing: "ease-in" });
    await anim($("catBody"), [{ transform: "translate(0,0) rotate(0deg)" }, { transform: "translate(0,-44px) rotate(-3deg)" }], { duration: 700, easing: "ease-out" });
    await sleep(350);
    cat.set(70, 0.1, 0.3);
    anim($("boom"), [{ transform: "rotate(-14deg)" }, { transform: "rotate(0deg)" }], { duration: 500 });
    await anim($("catBody"), [{ transform: "translate(0,-44px) rotate(-3deg)" }, { transform: "translate(0,0) rotate(0deg)" }], { duration: 260, easing: "ease-in" });
    sfx.squelch(); shake(8, 280);
    puff(700, 770, { r: 26, color: "#3b2a1a", dx: -60, dy: -50 }); puff(1150, 780, { r: 26, color: "#3b2a1a", dx: 60, dy: -50 });
  }

  // ---------- kamera Siketa ----------
  let recTimer = null, recBlink = null;
  function recording(on){
    clearInterval(recTimer); if (recBlink) recBlink.cancel();
    $("recLabel").textContent = "REC"; $("recDot").style.display = "";
    $("camcorder").style.display = on ? "" : "none"; $("rec").style.display = on ? "" : "none";
    if (!on) return;
    const t0 = Date.now();
    recTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      $("recTime").textContent = `00:${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    }, 250);
    recBlink = $("recDot").animate([{ opacity: 1 }, { opacity: 0.1 }], { duration: 500, direction: "alternate", iterations: Infinity });
  }

  // ---------- wiatr ----------
  function wind(ms){
    noise(ms / 1000, { freq: 500, q: 0.7, vol: 0.35, sweepTo: 900 });
    const t = setInterval(() => {
      const l = document.createElementNS(NS, "path"), y = 150 + Math.random() * 600, w = 120 + Math.random() * 200;
      l.setAttribute("d", `M0 ${y} q${w / 2} -18 ${w} 0`); l.setAttribute("fill", "none");
      l.setAttribute("stroke", "#ffffff"); l.setAttribute("stroke-width", "5"); l.setAttribute("stroke-linecap", "round"); l.setAttribute("opacity", "0.8");
      $("fx").append(l);
      l.animate([{ transform: "translate(1700px,0)" }, { transform: `translate(${-w - 100}px,20px)` }], { duration: 700 + Math.random() * 300, fill: "forwards" })
       .finished.then(() => l.remove()).catch(() => {});
    }, 90);
    return sleep(ms).then(() => clearInterval(t));
  }

  // ---------- ubijacz: tupie noga w ziemie ----------
  async function stomp(big){
    const leg = $("uLegR"), u = who.u;
    await anim(leg, [{ transform: "rotate(0deg)" }, { transform: "rotate(-40deg)" }], { duration: 220, easing: "ease-out" });
    await anim(leg, [{ transform: "rotate(-40deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(0deg)" }], { duration: 110, easing: "ease-in" });
    sfx.stomp(); sfx.squelch();
    puff(u.x + 40, u.y, { r: 16, dur: 700, dx: 50, dy: -40, color: "#3b2a1a" });
    puff(u.x + 10, u.y, { r: 16, dur: 700, dx: -40, dy: -40, color: "#3b2a1a" });
    if (big) shake(14, 380);
  }

  function reset(){
    if (tts) tts.cancel();
    document.getAnimations().forEach(a => a.cancel());
    wheelAnims = []; catWheels = [];
    Object.keys(gaits).forEach(k => gaits[k] = []);
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = ""; $("detFx").innerHTML = "";
    ["s1", "s2", "m"].forEach(hide);
    Object.assign(who.u, { x: 360, y: 800, head: 470 }); place("u", 360, 800);
    $("bus").style.display = "none"; busX = 1750; $("bus").style.transform = busT(busX);
    $("busDrv").style.display = ""; inBus("s1", false); inBus("s2", false);
    $("uSink").style.display = "none"; $("uDirt").style.display = "none";
    document.querySelectorAll(".uDirtLeg, .muddy, .cig, .can").forEach(e => e.style.display = "none");
    $("splats").style.display = "none"; recording(false);
    $("uArmPush").style.display = "none"; $("uArmPocketR").style.display = "";
    $("uArmsWave").style.display = "none"; $("uArmPocketL").style.display = "";
    Object.assign(who.s2, { s: 1, y: 800, head: 385 }); $("cam").style.transform = "";
    $("uMouthO").style.display = "none"; $("uMouthC").style.display = "";
    $("fade").style.opacity = 0; $("flash").style.opacity = 0;
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    await ziomkiIntro("MOKRE POLE", 3);
    const cat = engine(); cat.set(60, 0.08, 0.3);
    const beacon = $("beacon").animate([{ fill: "#ff7a1a" }, { fill: "#ffe27a" }], { duration: 350, direction: "alternate", iterations: Infinity });
    const smoke = catSmoke();

    // 1. buksowanie w blocie, ubijacz tupie
    await sleep(700);
    cat.set(120, 0.2, 0.3); spinCat(0.25);
    await mudSpray(1800);
    spinCat(0); cat.set(60, 0.08, 0.4);
    await stomp(); await stomp();
    await line("u", ["Tu jest twardo, panie!", "Ja mówię, twardo!"], 700, 90);
    await stomp();
    document.querySelectorAll(".uDirtLeg").forEach(e => e.style.display = "");

    // 2. podpiera sie lyzka
    await catLift(cat);
    await line("u", ["Łyżką go, łyżką!", "Podpieraj!"], 600, 90);
    await stomp();
    await catLift(cat);
    await sleep(400);

    // 3. przyjezdza ekipa
    $("bus").style.display = ""; inBus("s1", true); inBus("s2", true);
    let eng = engine(); eng.set(70, 0.09, 0.2);
    spinWheels(-1, 0.45);
    let ex = exhaust();
    await busDrive(1330, 3000);
    spinWheels(0); sfx.brake(); clearInterval(ex); eng.set(40, 0.04, 0.6);
    await sleep(500);
    sfx.door(); eng.stop(0.6);
    $("busDrv").style.display = "none";
    place("m", 1440, 800); await hop("m", 70, 420);
    recording(true); tone(1200, 0.12, "sine", 0.08);
    walkTo("m", 1250, 1300, 0.34);
    inBus("s1", false); place("s1", 1440, 800); await hop("s1", 60, 380);
    walkTo("s1", 1110, 1700, 0.34);
    inBus("s2", false); place("s2", 1440, 800); await hop("s2", 60, 380);
    await walkTo("s2", 980, 2200, 0.34);
    await sleep(300);

    await line("m", ["Co, zakopał się?"], 900, -40);
    await line("u", ["A gdzie tam!", "Tu jest twardo jak beton!"], 400, 90);
    // tupie tak mocno, ze sam sie zapada po kolana
    await stomp(true);
    sfx.squelch();
    $("uSink").style.display = "";
    await anim($("ubij"), [{ transform: actT(who.u) }, { transform: actT(who.u, who.u.x, who.u.y + 90) }], { duration: 600, easing: "ease-in" });
    who.u.y += 90;
    await sleep(900);

    // wieje - Siket nagrywa telefonem i wola Pawla
    const gust = wind(5200);
    const lean = [ "m", "s1", "s2" ].map(k => $(who[k].el).querySelector(".bob").animate(
      [{ transform: "rotate(0deg)" }, { transform: "rotate(-4deg)" }], { duration: 600, direction: "alternate", iterations: Infinity }));
    await sleep(800);
    await line("m", ["Paweł, chodź, żeby mi nie wiało w mikrofon…", "ustań, żeby nie wiało."], 500, -160);
    lean[1].cancel();
    await walkTo("s1", 1335, 1300, 0.34);
    await hop("s1", 20, 250);
    await gust;
    lean.forEach(a => a.cancel());
    await sleep(600);

    // saper wlazi przed kamere (wielki, na pierwszym planie)
    const s2x = who.s2.x;
    Object.assign(who.s2, { s: 2.4, y: 1300, head: 380 }); place("s2", 1800, 1300);
    await walkTo("s2", 900, 1500, 0.3);
    await line("m", ["Saper, wypierdalaj", "sprzed kamery!"], 500, -200);
    await walkTo("s2", 1900, 900, 0.25);
    Object.assign(who.s2, { s: 1, y: 800, head: 385 }); place("s2", s2x, 800);
    await sleep(500);

    // kamera na chwile skreca w lewo - stoi tam trzymetrowy facet
    const pan = x => `translate(${x}px,0)`;
    await anim($("cam"), [{ transform: pan(0) }, { transform: pan(900) }], { duration: 1100, easing: "ease-in-out" });
    tone(55, 2.4, "sine", 0.35); tone(58, 2.4, "sine", 0.2); noise(2.2, { freq: 300, q: 6, vol: 0.12 });
    const slsw = $("slSway").animate([{ transform: "rotate(-1.5deg)" }, { transform: "rotate(1.5deg)" }], { duration: 900, direction: "alternate", iterations: Infinity });
    await sleep(2200);
    await anim($("cam"), [{ transform: pan(900) }, { transform: pan(0) }], { duration: 700, easing: "ease-in-out" });
    slsw.cancel(); $("cam").style.transform = "";
    await sleep(500);

    // 5. Siket: brak karty pamieci
    await sleep(400);
    await line("m", ["Kurde,", "nie mam karty pamięci."], 700, -60);
    clearInterval(recTimer); recBlink.cancel();
    $("recLabel").textContent = "BRAK KARTY"; $("recDot").style.display = "none";
    tone(440, 0.15, "square", 0.05); await sleep(180); tone(330, 0.3, "square", 0.05);
    await anim($("rec"), [{ opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }], { duration: 1400 });
    recording(false); $("camcorder").style.display = "";
    await sleep(400);

    // 6. gaz - ale koparka zakopuje sie jeszcze glebiej
    walkTo("s2", 1000, 900, 0.34);
    cat.set(150, 0.24, 0.3); spinCat(0.1);
    const dig = mudSpray(2400, true);
    await anim($("catBody"), [{ transform: "translate(0,0) rotate(0deg)" }, { transform: "translate(0,95px) rotate(3deg)" }], { duration: 2400, easing: "ease-in" });
    await dig;
    sfx.squelch(); sfx.squelch();
    spinCat(0); cat.set(55, 0.07, 0.6);
    await sleep(600);
    await line("m", ["Widzisz, koło się zapada,", "siądzie znowu."], 600, -120);
    await line("s2", ["Ta, patrz, te koło", "się zaraz zajebie."], 900, 40);

    // 7. ubijacz wylazi z blota, kopie w kolo i pcha koparke reka
    sfx.squelch();
    await anim($("ubij"), [{ transform: actT(who.u) }, { transform: actT(who.u, who.u.x, who.u.y - 90) }], { duration: 600, easing: "ease-out" });
    who.u.y -= 90; $("uSink").style.display = "none";
    // chodzi dookola koparki i tlumaczy operatorowi na migi (bez slow), machajac rekami
    await walkTo("u", 1180, 2600, 0.4);
    await sleep(300);
    await walkTo("u", 780, 2000, 0.4);
    ["uArmPocketL", "uArmPocketR"].forEach(id => $(id).style.display = "none");
    $("uArmsWave").style.display = "";
    const waveO = { duration: 260, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    const w1 = $("uWaveL").animate([{ transform: "rotate(-25deg)" }, { transform: "rotate(30deg)" }], waveO);
    const w2 = $("uWaveR").animate([{ transform: "rotate(25deg)" }, { transform: "rotate(-30deg)" }], Object.assign({}, waveO, { delay: 130 }));
    const nod = $("catOp").animate([{ transform: "translateY(0)" }, { transform: "translateY(8px)" }], { duration: 400, direction: "alternate", iterations: Infinity });
    talking("u", true);
    const mumble = setInterval(() => sfx.voice(150), 90);
    for (let n = 0; n < 3; n++){
      await anim($("uLean"), [{ transform: "rotate(0deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(-3deg)" }, { transform: "rotate(0deg)" }], { duration: 900 });
    }
    clearInterval(mumble); talking("u", false);
    w1.cancel(); w2.cancel(); nod.cancel();
    $("uArmsWave").style.display = "none";
    ["uArmPocketL", "uArmPocketR"].forEach(id => $(id).style.display = "");
    await walkTo("u", 700, 700, 0.4);
    for (let n = 0; n < 2; n++){
      await anim($("uLegR"), [{ transform: "rotate(0deg)" }, { transform: "rotate(25deg)" }], { duration: 200, easing: "ease-out" });
      await anim($("uLegR"), [{ transform: "rotate(25deg)" }, { transform: "rotate(-55deg)" }], { duration: 120, easing: "ease-in" });
      sfx.thud(); tone(70, 0.2, "sine", 0.4, 40); shake(6, 200);
      await anim($("uLegR"), [{ transform: "rotate(-55deg)" }, { transform: "rotate(0deg)" }], { duration: 220 });
      await sleep(250);
    }
    $("uArmPocketR").style.display = "none"; $("uArmPush").style.display = "";
    for (let n = 0; n < 3; n++){
      tone(110, 0.35, "sawtooth", 0.05, 80);
      await anim($("uLean"), [{ transform: "rotate(0deg)" }, { transform: "rotate(9deg)" }, { transform: "rotate(4deg)" }], { duration: 650, easing: "ease-in-out" });
      anim($("catBody"), [{ transform: "translate(0,95px) rotate(3deg)" }, { transform: "translate(6px,92px) rotate(2deg)" }, { transform: "translate(0,95px) rotate(3deg)" }], { duration: 300 });
    }
    await sleep(300);

    // operator wyciaga daleko lyzki i podnosi koparke na lyzkach, ubijacz dyryguje
    $("uArmPush").style.display = "none"; $("uArmPocketR").style.display = "";
    await walkTo("u", 560, 900, 0.4);
    await line("u", ["Wyciągnij łyżkę daleko!", "Dalej! Jeszcze dalej!"], 300, 90);
    cat.set(110, 0.16, 0.3);
    await anim($("boom"), [{ transform: "rotate(0deg)" }, { transform: "rotate(18deg)" }], { duration: 900, easing: "ease-in-out" });
    await line("u", ["Teraz dociśnij!", "I przednią też!"], 300, 90);
    cat.set(135, 0.2, 0.3);
    const lift = Promise.all([
      anim($("boom"), [{ transform: "rotate(18deg)" }, { transform: "rotate(-16deg)" }], { duration: 1200, easing: "ease-in" }),
      anim($("loader"), [{ transform: "rotate(0deg)" }, { transform: "rotate(9deg)" }], { duration: 1200, easing: "ease-in" }),
      anim($("catBody"), [{ transform: "translate(0,95px) rotate(3deg)" }, { transform: "translate(0,-40px) rotate(0deg)" }], { duration: 2600, easing: "ease-in-out", delay: 500 })
    ]);
    await line("u", ["Pomału, pomału!"], 200, 90, { rate: 0.9 });
    await lift;
    sfx.squelch();
    await line("u", ["Stój! Stój!"], 400, 90, { pitch: 1.3, rate: 1.4 });
    cat.set(70, 0.1, 0.3);
    await sleep(500);
    anim($("boom"), [{ transform: "rotate(-16deg)" }, { transform: "rotate(0deg)" }], { duration: 700 });
    anim($("loader"), [{ transform: "rotate(9deg)" }, { transform: "rotate(0deg)" }], { duration: 700 });
    await anim($("catBody"), [{ transform: "translate(0,-40px) rotate(0deg)" }, { transform: "translate(0,95px) rotate(3deg)" }], { duration: 500, easing: "ease-in" });
    sfx.squelch(); shake(10, 300);
    await sleep(400);

    // 8. pelny gaz - koparka wyrywa sie z blota i ochlapuje wszystkich
    cat.set(150, 0.24, 0.3); spinCat(0.1);
    const spray = mudSpray(2200, true);
    await sleep(700);
    anim($("catBody"), [{ transform: "translate(0,95px) rotate(3deg)" }, { transform: "translate(60px,-60px) rotate(-4deg)", offset: 0.4 },
                        { transform: "translate(110px,-20px) rotate(0deg)", offset: 0.7 }, { transform: "translate(170px,-24px) rotate(0deg)" }], { duration: 2200, easing: "ease-out" });
    await sleep(500);
    sfx.squelch(); sfx.squelch();
    anim($("uLean"), [{ transform: "rotate(4deg)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(0deg)" }], { duration: 500 });
    $("uArmPush").style.display = "none"; $("uArmPocketR").style.display = "";
    document.querySelectorAll(".muddy").forEach(e => e.style.display = "");
    $("uDirt").style.display = "";
    $("splats").style.display = "";
    document.querySelectorAll("#splats .sp").forEach((e, k) =>
      anim(e, [{ transform: "scale(0)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 300, delay: k * 120 }));
    shake(10, 400);
    await spray;
    spinCat(0); cat.set(60, 0.08, 0.6);
    await sleep(1200);
    await line("u", ["Tak się dyryguje,", "kurwancka!"], 1500, 90);
    await stomp();
    await sleep(1400);
    clearInterval(smoke); beacon.cancel(); cat.stop(0.6); recording(false);
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
