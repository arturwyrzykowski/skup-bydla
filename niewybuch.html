<style>
  html, body { margin:0; height:100%; background:#111; }
  body { display:flex; align-items:center; justify-content:center;
    font-family:"Comic Sans MS","Chalkboard SE",sans-serif; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16 / 9; }
  #stage { width:100%; height:100%; display:block; background:#9fd3ff; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:24px; text-align:center; color:#fff; background:rgba(0,0,0,.72); }
  .overlay h1 { margin:0; font-size:clamp(40px,8vw,120px); color:#ffd23f; letter-spacing:2px;
    -webkit-text-stroke:3px #000; text-shadow:6px 6px 0 #000; transform:rotate(-3deg); }
  .overlay p { margin:0; font-size:clamp(16px,2vw,28px); }
  .btn { font:inherit; font-weight:bold; font-size:clamp(20px,2.6vw,36px); padding:.4em 1.2em;
    color:#000; background:#ffd23f; border:4px solid #000; border-radius:14px;
    box-shadow:5px 5px 0 #000; cursor:pointer; }
  .btn:focus-visible { outline:4px solid #fff; outline-offset:4px; }
  [hidden] { display:none !important; }
</style>
</head>

      <path d="M-74 14 Q-72 -44 0 -46 Q72 -44 78 14 Q0 -6 -74 14 Z" fill="#5a4a3a"/>
      <path d="M30 6 Q86 0 112 18 Q80 26 40 16 Z" fill="#473a2d"/>
    </g>

    <g id="fx"></g>
    <g id="bubbles"></g>
  </g>
  <rect id="flash" width="1600" height="900" fill="#fff" opacity="0" pointer-events="none"/>
  <rect id="fade" width="1600" height="900" fill="#000" opacity="0" pointer-events="none"/>
</svg>

<div class="overlay" id="startScreen">
  <h1>NIEWYBUCH</h1>
  <p>odcinek 2</p>
  <button class="btn" id="playBtn" autofocus>▶ Odtwórz</button>
</div>
<div class="overlay" id="endScreen" hidden>
  <h1>KONIEC</h1>
  <button class="btn" id="againBtn">↺ Od nowa</button>
</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scForest", "scRoad", "scYard"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    s1: { el: "s1", img: true, x: -300, y: 800, s: 1, head: 385, pitch: 170, vPitch: 0.7, vRate: 1.0 },
    s2: { el: "s2", img: true, x: -150, y: 800, s: 1, head: 385, pitch: 210, vPitch: 0.95, vRate: 1.05 },
    m:  { el: "mirek", img: true, x: 0, y: 800, s: 1, head: 385, pitch: 260, vPitch: 1.3, vRate: 1.15 },
    z:  { el: "zlom", x: 330, y: 800, s: 0.85, head: 420, pitch: 130, vPitch: 0.45, vRate: 0.9, mouthO: "zMouthO", mouthC: "zMouthC" }
  };
  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  function speak(text, w, { pitch, rate } = {}){
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  function talking(k, on){
    const w = who[k];
    if (w.img){
      if (on) w._talk = $(w.el).querySelector(".bob").animate(
        [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(-8px) scaleY(1.02)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
      return;
    }
    clearInterval(w._talk);
    let open = false;
    if (on) w._talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    else { $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = ""; }
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){
    const w = who[k], tx = w.x, ty = w.y - w.head;
    const b = makeBubble(tx, ty, lines, shift);
    await anim(b.g, [{ transform: `translate(${tx}px,${ty}px) scale(0)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }],
               { duration: 200, easing: "cubic-bezier(.3,1.6,.6,1)" });
    if (instant){ b.spans.forEach((s, i) => s.textContent = lines[i]); return b; }
    talking(k, true);
    const spoken = speak(lines.join(" "), w, { pitch, rate });
    for (let i = 0; i < lines.length; i++){
      for (const ch of lines[i]){
        b.spans[i].textContent += ch;
        if (ch !== " " && !spoken) sfx.voice(w.pitch);
        await sleep(spoken ? 45 : 58);
      }
    }
    if (spoken) await spoken;
    talking(k, false);
    return b;
  }
  async function unsay(b){
    await anim(b.g, [{ transform: `translate(${b.tipX}px,${b.tipY}px) scale(1)` }, { transform: `translate(${b.tipX}px,${b.tipY}px) scale(0)` }], { duration: 150 });
    b.g.remove();
  }
  async function line(k, lines, hold = 1600, shift = 0, opts){
    const b = await say(k, lines, shift, opts);
    await sleep(hold); await unsay(b); await sleep(250);
  }

  // ---------- rekwizyty ----------
  let wheelAnims = [];
  function spinWheels(dir, period = 0.5){
    wheelAnims.forEach(a => a.cancel()); wheelAnims = [];
    if (!dir) return;
    document.querySelectorAll("#bus .bw").forEach(w => wheelAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${dir * 360}deg)` }],
                { duration: period * 1000, iterations: Infinity })));
  }
  let busX = 1750;
  async function busDrive(x, dur, easing = "cubic-bezier(.2,.7,.35,1)", y = 494){
    const from = busT(busX, y); busX = x;
    await anim($("bus"), [{ transform: from }, { transform: busT(x, y) }], { duration: dur, easing });
  }
  function exhaust(y = 494){ return setInterval(() => puff(busX + 600, y + 250, { r: 18, dur: 1000, dx: 50, dy: -40, color: "#9a9a9a" }), 140); }

  // wykrywacz: pierscienie przy talerzu wykrywacza + pisk, coraz szybciej
  async function detector(times){
    const hx = who.s2.x + 86, hy = who.s2.y - 26;
    for (let i = 0; i < times; i++){
      sfx.beep();
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", hx); c.setAttribute("cy", hy); c.setAttribute("r", 20);
      c.setAttribute("fill", "none"); c.setAttribute("stroke", "#ffd23f"); c.setAttribute("stroke-width", "6");
      c.style.transformOrigin = `${hx}px ${hy}px`;
      $("detFx").append(c);
      c.animate([{ transform: "scale(.4)", opacity: 1 }, { transform: "scale(3)", opacity: 0 }], { duration: 600, fill: "forwards" })
       .finished.then(() => c.remove()).catch(() => {});
      await sleep(Math.max(90, 520 - i * 38));
    }
  }

  // papierosy: czubek wzgledem stop postaci
  const CIG_TIP = { s1: [32, -252], s2: [16, -285] };
  let cigSmoke = null;
  function smokeCigs(on){
    clearInterval(cigSmoke);
    ["s1", "s2"].forEach(k => $(who[k].el).querySelector(".cig").style.display = on ? "" : "none");
    if (!on) return;
    cigSmoke = setInterval(() => ["s1", "s2"].forEach(k => {
      const [dx, dy] = CIG_TIP[k];
      puff(who[k].x + dx, who[k].y + dy - 6, { r: 7, dur: 1600, dx: 10 + Math.random() * 20, dy: -90, color: "#cfcfcf" });
    }), 380);
  }
  function lighter(){ noise(0.06, { freq: 5000, q: 2, vol: 0.15 }); tone(300, 0.2, "sine", 0.02); }

  function reset(){
    if (tts) tts.cancel();
    document.getAnimations().forEach(a => a.cancel());
    wheelAnims = [];
    Object.keys(gaits).forEach(k => gaits[k] = []);
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = ""; $("detFx").innerHTML = "";
    scene("scForest");
    ["s1", "s2", "m", "z"].forEach(hide);
    Object.assign(who.s1, { x: -300, y: 800 }); Object.assign(who.s2, { x: -150, y: 800 });
    $("bus").style.display = "none"; busX = 1750; $("bus").style.transform = busT(busX);
    $("busDrv").style.display = "";
    $("bombF").style.transform = "translate(820px,980px) rotate(-90deg)"; $("bombF").style.display = "";
    $("granF").style.transform = "translate(900px,820px)"; $("granF").style.display = "";
    $("bombY").style.display = "none";
    $("shovel").style.display = "none";
    $("phone").style.display = "none";
    $("scaleTxt").textContent = "0 kg";
    $("zFace").style.fill = ""; $("zBurn").style.display = "none"; $("zCig").style.display = "";
    $("zCap").style.transform = "";
    $("zMouthO").style.display = "none"; $("zMouthC").style.display = "";
    document.querySelectorAll(".cig").forEach(c => c.style.display = "none"); clearInterval(cigSmoke);
    $("fade").style.opacity = 0; $("flash").style.opacity = 0;
    $("nuke").style.display = "none"; $("capFall").style.display = "none"; $("farYard").style.display = "none";
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;

    // ===== 1. LAS: saperzy wchodza, wykrywacz piszczy =====
    place("s1", -330); place("s2", -150);
    await sleep(500);
    walkTo("s1", 250, 3600, 0.38);
    await walkTo("s2", 520, 3600, 0.38);
    await sleep(300);
    // omiatanie wykrywaczem
    const sweep = $("s2").querySelector(".bob").animate(
      [{ transform: "rotate(-4deg)" }, { transform: "rotate(4deg)" }],
      { duration: 500, direction: "alternate", iterations: Infinity, easing: "ease-in-out" });
    await detector(12);
    sweep.cancel();
    await hop("s2", 50);
    await line("s2", ["Ty, pika", "jak pojebane!"], 1400);
    await line("s1", ["Kopiemy. Tylko", "delikatnie, kurwa."], 1400, 60);

    // ===== 2. KOPANIE =====
    await walkTo("s1", 1140, 2600, 0.36);
    $("shovel").style.display = "";
    for (let i = 0; i < 6; i++){
      await anim($("shovel"), [{ transform: "rotate(0deg) translateY(0)" }, { transform: "rotate(12deg) translateY(26px)" }], { duration: 260, easing: "ease-in" });
      sfx.dig();
      anim($("s1").querySelector(".bob"), [{ transform: "translateY(0)" }, { transform: "translateY(10px) rotate(-3deg)" }, { transform: "translateY(0)" }], { duration: 400 });
      await anim($("shovel"), [{ transform: "rotate(12deg) translateY(26px)" }, { transform: "rotate(-18deg) translateY(-10px)" }], { duration: 300, easing: "ease-out" });
      for (let j = 0; j < 3; j++) clod(990 + Math.random() * 30, 730, 160 + Math.random() * 140, 160 + Math.random() * 100);
      await anim($("shovel"), [{ transform: "rotate(-18deg) translateY(-10px)" }, { transform: "rotate(0deg) translateY(0)" }], { duration: 220 });
    }
    // brzdek - szpadel trafia w metal
    await anim($("shovel"), [{ transform: "rotate(0deg) translateY(0)" }, { transform: "rotate(12deg) translateY(26px)" }], { duration: 260, easing: "ease-in" });
    sfx.clank();
    await anim($("shovel"), [{ transform: "rotate(12deg) translateY(26px)" }, { transform: "rotate(8deg) translateY(10px)" }, { transform: "rotate(12deg) translateY(26px)" }], { duration: 200 });
    await sleep(500);
    $("shovel").style.display = "none";

    // bomba wyjezdza z dolu
    shake(6, 300);
    await anim($("bombF"), [
      { transform: "translate(820px,980px) rotate(-90deg)" },
      { transform: "translate(820px,640px) rotate(-80deg)", offset: 0.6 },
      { transform: "translate(820px,600px) rotate(-10deg)", offset: 0.85 },
      { transform: "translate(820px,682px) rotate(0deg) scale(0.85)" }], { duration: 2600, easing: "ease-in-out" });
    sfx.thud(); shake(12, 380);
    puff(700, 730, { r: 24, color: "#8f7550", dx: -40, dy: -40 }); puff(940, 730, { r: 24, color: "#8f7550", dx: 40, dy: -40 });
    await sleep(500);
    await line("s1", ["O ja pierdolę…", "ale sztuka!"], 1400, 40);

    // granat wyskakuje
    await anim($("granF"), [
      { transform: "translate(900px,820px) rotate(0deg)" },
      { transform: "translate(960px,560px) rotate(200deg)", offset: 0.5 },
      { transform: "translate(1015px,690px) rotate(360deg)" }], { duration: 900, easing: "ease-out" });
    sfx.clank();
    await hop("s2", 40);
    await line("s2", ["I granat", "gratis!"], 1300);

    // telefon do Mirka
    const ph = $("phone");
    ph.setAttribute("x", who.s2.x + 40); ph.setAttribute("y", who.s2.y - 300); ph.style.display = "";
    sfx.dial(); await sleep(1100); sfx.dial(); await sleep(1100);
    await line("s2", ["Mirek, podjeżdżaj busem,", "mamy towar."], 1300, 120);
    ph.style.display = "none";

    // ===== 3. BUS =====
    $("bus").style.display = ""; busX = 1750; $("bus").style.transform = busT(busX);
    let eng = engine(); eng.set(70, 0.09, 0.2);
    spinWheels(-1, 0.45);
    let smoke = exhaust();
    await busDrive(1270, 3200);
    spinWheels(0); sfx.brake(); clearInterval(smoke); eng.set(40, 0.04, 0.6);
    await sleep(700);
    sfx.door();
    $("busDrv").style.display = "none";
    place("m", 1340, 800);
    await hop("m", 70, 420);
    eng.stop(0.6);
    await line("m", ["Ładować! Jedziemy", "na złom do Obrytego."], 1500, -120);

    // zaladunek
    anim($("bombF"), [{ transform: "translate(820px,682px) rotate(0deg) scale(0.85)" },
                      { transform: "translate(1150px,520px) rotate(-8deg) scale(0.8)", offset: 0.6 },
                      { transform: "translate(1480px,640px) rotate(0deg) scale(0.4)", opacity: 0 }], { duration: 1800, easing: "ease-in-out" });
    await anim($("granF"), [{ transform: "translate(1015px,690px)" }, { transform: "translate(1300px,520px) rotate(300deg)", offset: 0.6 },
                            { transform: "translate(1470px,650px) rotate(400deg) scale(0.5)", opacity: 0 }], { duration: 1500, easing: "ease-in-out" });
    sfx.clank(); await sleep(300); sfx.clank();
    walkTo("s2", 1500, 2300, 0.3);
    walkTo("m", 1300, 600, 0.3);
    await walkTo("s1", 1500, 1200, 0.3);
    hide("s1"); sfx.door();
    await sleep(1100);
    hide("s2"); hide("m"); $("busDrv").style.display = ""; sfx.door();
    await sleep(400);

    eng = engine(); eng.set(95, 0.12, 0.2);
    spinWheels(1, 0.14);
    smoke = exhaust();
    await busDrive(-750, 2600, "cubic-bezier(.5,0,.8,.4)");
    clearInterval(smoke); spinWheels(0); eng.stop(0.3);

    // ===== 4. DROGA DO OBRYTEGO =====
    await fadeTo(() => { scene("scRoad"); busX = 1700; $("bus").style.transform = busT(busX, 474); });
    eng = engine(); eng.set(80, 0.1, 0.3);
    spinWheels(1, 0.18);
    smoke = exhaust(474);
    const bounce = $("busBody").animate(
      [{ transform: "translateY(0) rotate(0deg)" }, { transform: "translateY(-16px) rotate(-1.5deg)" }, { transform: "translateY(0) rotate(0deg)" }],
      { duration: 520, iterations: Infinity });
    const clanks = setInterval(() => sfx.clank(), 520);
    await busDrive(-700, 6500, "linear", 474);
    clearInterval(clanks); bounce.cancel(); clearInterval(smoke); spinWheels(0); eng.stop(0.3);

    // ===== 5. ZLOMOWISKO =====
    await fadeTo(() => {
      scene("scYard"); busX = 1750; $("bus").style.transform = busT(busX);
      place("z", 330, 800);
    });
    eng = engine(); eng.set(70, 0.09, 0.2);
    spinWheels(-1, 0.45); smoke = exhaust();
    await busDrive(1010, 3000);
    spinWheels(0); sfx.brake(); clearInterval(smoke); eng.set(40, 0.04, 0.6);
    await sleep(600);
    sfx.door(); $("busDrv").style.display = "none";
    eng.stop(0.6);
    // wszyscy wysiadaja
    place("s2", 1160, 800); await hop("s2", 60, 380);
    await sleep(300);
    place("s1", 1160, 800); await hop("s1", 60, 380);
    walkTo("s1", 1060, 600, 0.34);
    await walkTo("s2", 1190, 300, 0.34);
    place("m", 1160, 800); await hop("m", 70, 420);
    await walkTo("m", 950, 1100, 0.34);
    await sleep(300);
    // saperzy odpalaja papierosy
    lighter(); await sleep(250); lighter();
    smokeCigs(true);

    // bomba laduje na wadze
    const bY = $("bombY"); bY.style.display = "";
    await anim(bY, [{ transform: "translate(1100px,640px) scale(0.3)", opacity: 0 },
                    { transform: "translate(880px,460px) rotate(-12deg) scale(0.8)", opacity: 1, offset: 0.5 },
                    { transform: "translate(640px,730px) scale(0.8)" }], { duration: 1300, easing: "ease-in-out" });
    sfx.thud(); shake(8, 300);
    for (let kg = 0; kg <= 200; kg += 10){ $("scaleTxt").textContent = kg + " kg"; sfx.voice(900); await sleep(60); }
    sfx.ding();
    await sleep(400);

    await line("z", ["Dwieście kilo.", "Stówa i spadajcie."], 1500, 60);
    await line("m", ["Panie,", "to zabytek!"], 1200);
    await line("z", ["To idź pan", "do muzeum."], 1500, 60);

    // wszyscy wracaja do busa, odjazd
    await sleep(600);
    smokeCigs(false);
    walkTo("s1", 1160, 600, 0.3);
    await walkTo("s2", 1160, 300, 0.3);
    hide("s2"); sfx.door();
    await sleep(400);
    hide("s1"); sfx.door();
    await walkTo("m", 1160, 1200, 0.3);
    hide("m"); sfx.door(); $("busDrv").style.display = "";
    await sleep(300);
    eng = engine(); eng.set(95, 0.12, 0.2);
    spinWheels(1, 0.14); smoke = exhaust();
    await busDrive(-750, 2600, "cubic-bezier(.5,0,.8,.4)");
    clearInterval(smoke); spinWheels(0); eng.stop(0.3);
    $("bus").style.display = "none";

    // zlomiarz kopie bombe...
    await sleep(500);
    await walkTo("z", 440, 1200, 0.4);
    await anim($("zLegR"), [{ transform: "rotate(0deg)" }, { transform: "rotate(30deg)" }], { duration: 250, easing: "ease-out" });
    await anim($("zLegR"), [{ transform: "rotate(30deg)" }, { transform: "rotate(-45deg)" }], { duration: 140, easing: "ease-in" });
    sfx.clank();
    await anim($("zLegR"), [{ transform: "rotate(-45deg)" }, { transform: "rotate(0deg)" }], { duration: 250 });
    const hm = await say("z", ["Hm?"], 60, { instant: true });
    await sleep(1100); await unsay(hm);

    await sleep(300);

    // ...BUM - z daleka: bus na drodze, w oddali grzyb atomowy nad zlomowiskiem
    await fadeTo(() => {
      scene("scRoad"); hide("z"); $("bombY").style.display = "none"; $("farYard").style.display = "";
      $("bus").style.display = ""; $("busDrv").style.display = "";
      busX = 1700; $("bus").style.transform = busT(busX, 474);
    });
    eng = engine(); eng.set(80, 0.1, 0.3);
    spinWheels(1, 0.18); smoke = exhaust(474);
    const drive = busDrive(-750, 9000, "linear", 474);
    await sleep(4400);   // bus mija budynek, dopiero wtedy wybuch

    // blysk bez dzwieku (swiatlo szybsze niz huk)
    anim($("flash"), [{ opacity: 1 }, { opacity: 0 }], { duration: 1200, easing: "ease-out" });
    anim($("skyGlow"), [{ opacity: 0 }, { opacity: 0.45, offset: 0.1 }, { opacity: 0.18 }], { duration: 5000 });
    $("nuke").style.display = "";
    // budynek skupu rozlatuje sie na kawalki
    document.querySelectorAll("#farYard .piece").forEach((el, i) => {
      const dx = (i % 2 ? 1 : -1) * (80 + Math.random() * 260), dy = -(200 + Math.random() * 380), r = (Math.random() - 0.5) * 900;
      el.style.transformBox = "fill-box"; el.style.transformOrigin = "center";
      anim(el, [{ transform: "translate(0,0) rotate(0deg)", opacity: 1 }, { transform: `translate(${dx}px,${dy}px) rotate(${r}deg)`, opacity: 0 }],
           { duration: 1600 + Math.random() * 600, easing: "cubic-bezier(.2,.8,.4,1)" });
    });
    anim($("nuke"), [{ transform: "scale(0.05)" }, { transform: "scale(0.95)", offset: 0.4 }, { transform: "scale(1.35)" }], { duration: 3200, easing: "ease-out" });
    anim($("nukeGlow"), [{ opacity: 1 }, { opacity: 1, offset: 0.3 }, { opacity: 0 }], { duration: 4000 });
    await sleep(1300);

    // fala uderzeniowa
    sfx.boom(); shake(22, 1100);
    for (let i = 0; i < 14; i++) puff(1600 - i * 40, 700 + Math.random() * 120,
      { r: 30 + Math.random() * 20, dur: 1400, dx: -500 - Math.random() * 300, dy: -60 - Math.random() * 80, color: "#b8a27a" });
    await drive;
    clearInterval(smoke); spinWheels(0); eng.stop(0.3);
    $("bus").style.display = "none";

    // czapka zlomiarza spada z nieba
    await sleep(600);
    const cap = $("capFall"); cap.style.display = "";
    await anim(cap, [{ transform: "translate(820px,-120px) rotate(0deg)" }, { transform: "translate(760px,300px) rotate(-200deg)", offset: 0.5 },
                     { transform: "translate(800px,735px) rotate(-360deg)" }], { duration: 2400, easing: "ease-in" });
    sfx.thud();
    await sleep(1400);
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
