<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scSmugi", "scTrunk", "scRoom", "scBoot", "scDrive", "scAlma", "scHouse"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    y: { el: "syn", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 130, vPitch: 0.6, vRate: 1.15 },
    r: { el: "rSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 210, vPitch: 0.95, vRate: 1.2 },
    s: { el: "sSt", img: true, x: 0, y: 0, s: 1, head: 300, pitch: 90, vPitch: 0.2, vRate: 1.15 },
    u: { el: "ubij", x: 0, y: 0, s: 1, head: 300, pitch: 150, vPitch: 0.55, vRate: 1.1, mouthO: "uMouthO", mouthC: "uMouthC" }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
