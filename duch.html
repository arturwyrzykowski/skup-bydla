<style>

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;

  .btn { font:inherit; font-weight:bold; font-size:clamp(20px,2.6vw,36px); padding:.4em 1.2em;
    color:#000; background:#ffd23f; border:4px solid #000; border-radius:14px;
    box-shadow:5px 5px 0 #000; cursor:pointer; }
  .btn:focus-visible { outline:4px solid #fff; outline-offset:4px; }
  [hidden] { display:none !important; }
</style>

<script src="intro.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx / 2}px,${-h}px)` }, { transform: `translate(${dx}px,20px)`, opacity: 0.2 }],
              { duration: 700, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  function shake(power = 14, dur = 420){
    return anim($("world"), [
      { transform: "translate(0,0)" }, { transform: `translate(${-power}px,${power * .6}px)` }, { transform: `translate(${power}px,${-power * .5}px)` },
      { transform: `translate(${-power * .6}px,${power * .3}px)` }, { transform: `translate(${power * .4}px,0)` }, { transform: "translate(0,0)" }], { duration: dur });
  }
  async function fadeTo(fn){
    await anim($("fade"), [{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
    fn();
    await sleep(150);
    await anim($("fade"), [{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
  }
  function scene(id){ ["scNight", "scShop"].forEach(s => $(s).style.display = s === id ? "" : "none"); }

  // ---------- aktorzy ----------
  // pozycja stop (x, y), skala; img = postac-obrazek (saperzy), head = wysokosc glowy nad stopami (do dymka)
  const who = {
    s1: { el: "rideS1", img: true, x: 0, y: 800, s: 1, head: 345, pitch: 170, vPitch: 0.7, vRate: 1.0 },
    s2: { el: "rideS2", img: true, x: 0, y: 800, s: 1, head: 400, pitch: 210, vPitch: 0.95, vRate: 1.05 }
  };

  const actT = (w, x = w.x, y = w.y) => `translate(${x}px,${y}px) scale(${w.s})`;
  function place(k, x, y = who[k].y){ const w = who[k]; w.x = x; w.y = y; $(w.el).style.transform = actT(w); $(w.el).style.display = ""; }
  function hide(k){ $(who[k].el).style.display = "none"; }
  // saper w busie = jego glowa w oknie
  function inBus(k, on){ $(k === "s1" ? "busS1" : "busS2").style.display = on ? "" : "none"; if (on) hide(k); }

  // chod: saperzy bujaja sie calym obrazkiem, Mirek macha konczynami
  const gaits = {};
  function gait(k, on, step = 0.4){
    (gaits[k] || []).forEach(a => a.cancel()); gaits[k] = [];
    if (!on) return;
    const o = { duration: step * 1000, direction: "alternate", iterations: Infinity, easing: "ease-in-out" };
    if (who[k].img){
      gaits[k].push($(who[k].el).querySelector(".bob").animate(
        [{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], o));
    } else {
      const swing = (id, a) => $(id) && gaits[k].push($(id).animate([{ transform: `rotate(${a}deg)` }, { transform: `rotate(${-a}deg)` }], o));
      swing("zLegR", -24);
    }
  }
  async function walkTo(k, x, dur, step){
    const w = who[k], from = actT(w);
    gait(k, true, step);
    await anim($(w.el), [{ transform: from }, { transform: actT(w, x) }], { duration: dur, easing: "linear" });
    w.x = x; gait(k, false);
    $(w.el).style.transform = actT(w);
  }
  async function hop(k, h = 60, dur = 380){
    const w = who[k];
    await anim($(w.el), [{ transform: actT(w) }, { transform: actT(w, w.x, w.y - h) }, { transform: actT(w) }], { duration: dur, easing: "ease-out" });
  }

  // ---------- dymki (jak w odc. 1) ----------
  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");
    const tail = document.createElementNS(NS, "path");
    const rect = document.createElementNS(NS, "rect");
    const patch = document.createElementNS(NS, "path");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("font-size", "40"); text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", '"Comic Sans MS","Chalkboard SE",sans-serif'); text.setAttribute("fill", "#111");
    g.append(tail, rect, patch, text);
    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  // ---------- glos (synteza mowy przegladarki, fallback: bla-bla) ----------
  const tts = window.speechSynthesis;
  let plVoice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^pl/i.test(v.lang));
    plVoice = vs.find(v => /zosia|ewa|krzysztof|google/i.test(v.name)) || vs[0] || null;
  }
  if (tts){ pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
  function unlockSpeech(){
    if (!tts) return;
    tts.cancel(); pickVoice();
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; tts.speak(u);
  }
  // nagrane kwestie (kierowca): odtwarzane wolniej i bez zachowania wysokosci = bardzo niski, gruby glos
  const CLIPS = {};

  const DEEP = 0.55;
  const clipEls = {};
  function clipFor(text){
    const src = CLIPS[text];
    if (!src) return null;
    if (!clipEls[src]){
      const a = new Audio(src); a.preload = "auto";
      a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
      clipEls[src] = a;
    }
    return clipEls[src];
  }
  function unlockClips(){
    Object.keys(CLIPS).forEach(t => { const a = clipFor(t); a.muted = true;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); });
  }
  function playClip(a){
    return new Promise(res => {
      a.currentTime = 0; a.playbackRate = DEEP;
      a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
      const guard = setTimeout(res, 8000);
      a.onended = a.onerror = () => { clearTimeout(guard); res(); };
      a.play().catch(() => { clearTimeout(guard); res(); });
    });
  }
  function speak(text, w, { pitch, rate } = {}){
    const clip = clipFor(text);
    if (clip) return playClip(clip);
    if (!tts || !plVoice) return null;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = plVoice; u.lang = plVoice.lang;
      u.pitch = pitch ?? w.vPitch; u.rate = rate ?? w.vRate;
      const guard = setTimeout(res, 800 + text.length * 140);
      u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      tts.speak(u);
    });
  }

  // mowienie: saperzy podskakuja w rytm, rysowani ruszaja ustami
  function talking(k, on){
    const w = who[k];
    if (w.img){
      if (on) w._talk = $(w.el).querySelector(".bob").animate(
        [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(-8px) scaleY(1.02)" }],
        { duration: 160, direction: "alternate", iterations: Infinity });
      else if (w._talk){ w._talk.cancel(); w._talk = null; }
      return;
    }
    clearInterval(w._talk);
    let open = false;
    if (on) w._talk = setInterval(() => {
      open = !open;
      $(w.mouthO).style.display = open ? "" : "none";
      $(w.mouthC).style.display = open ? "none" : "";
    }, 110);
    else { $(w.mouthO).style.display = "none"; $(w.mouthC).style.display = ""; }
  }

  async function say(k, lines, shift = 0, { instant = false, pitch, rate } = {}){
    const w = who[k], tx = w.x, ty = w.y - w.head;
    const b = makeBubble(tx, ty, lines, shift);
    await anim(b.g, [{ transform: `translate(${tx}px,${ty}px) scale(0)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }],
               { duration: 200, easing: "cubic-bezier(.3,1.6,.6,1)" });
    if (instant){ b.spans.forEach((s, i) => s.textContent = lines[i]); return b; }
    talking(k, true);
    const spoken = speak(lines.join(" "), w, { pitch, rate });
    for (let i = 0; i < lines.length; i++){
      for (const ch of lines[i]){
        b.spans[i].textContent += ch;
        if (ch !== " " && !spoken) sfx.voice(w.pitch);
        await sleep(spoken ? 45 : 58);
      }
    }
    if (spoken) await spoken;
    talking(k, false);
    return b;
  }
  async function unsay(b){
    await anim(b.g, [{ transform: `translate(${b.tipX}px,${b.tipY}px) scale(1)` }, { transform: `translate(${b.tipX}px,${b.tipY}px) scale(0)` }], { duration: 150 });
    b.g.remove();
  }
  async function line(k, lines, hold = 1600, shift = 0, opts){
    const b = await say(k, lines, shift, opts);
    await sleep(hold); await unsay(b); await sleep(250);
  }

  // ---------- rekwizyty ----------
  let wheelAnims = [];
  function spinWheels(dir, period = 0.5){
    wheelAnims.forEach(a => a.cancel()); wheelAnims = [];
    if (!dir) return;
    document.querySelectorAll("#bus .bw").forEach(w => wheelAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${dir * 360}deg)` }],
                { duration: period * 1000, iterations: Infinity })));
  }
  let busX = 1750;
  async function busDrive(x, dur, easing = "cubic-bezier(.2,.7,.35,1)", y = 494){
    const from = busT(busX, y); busX = x;
    await anim($("bus"), [{ transform: from }, { transform: busT(x, y) }], { duration: dur, easing });
  }
  function exhaust(y = 494){ return setInterval(() => puff(busX + 600, y + 250, { r: 18, dur: 1000, dx: 50, dy: -40, color: "#9a9a9a" }), 140); }

  // wykrywacz: pierscienie przy talerzu wykrywacza + pisk, coraz szybciej
  async function detector(times){
    const hx = who.s2.x + 86, hy = who.s2.y - 26;
    for (let i = 0; i < times; i++){
      sfx.beep();
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", hx); c.setAttribute("cy", hy); c.setAttribute("r", 20);
      c.setAttribute("fill", "none"); c.setAttribute("stroke", "#ffd23f"); c.setAttribute("stroke-width", "6");
      c.style.transformOrigin = `${hx}px ${hy}px`;
      $("detFx").append(c);
      c.animate([{ transform: "scale(.4)", opacity: 1 }, { transform: "scale(3)", opacity: 0 }], { duration: 600, fill: "forwards" })
       .finished.then(() => c.remove()).catch(() => {});
      await sleep(Math.max(90, 520 - i * 38));
    }
  }

  // papierosy: czubek wzgledem stop postaci
  const CIG_TIP = { s1: [32, -252], s2: [16, -285], m: [36, -270] };
  let cigSmoke = null;
  function smokeCigs(on, ks = ["s1", "s2"]){
    clearInterval(cigSmoke);
    ["s1", "s2", "m"].forEach(k => $(who[k].el).querySelector(".cig").style.display = on && ks.includes(k) ? "" : "none");
    if (!on) return;
    cigSmoke = setInterval(() => ks.forEach(k => {
      const [dx, dy] = CIG_TIP[k];
      puff(who[k].x + dx, who[k].y + dy - 6, { r: 7, dur: 1600, dx: 10 + Math.random() * 20, dy: -90, color: "#cfcfcf" });
    }), 380);
  }
  function burp(){ const a = ac(), t = a.currentTime;
    tone(95 + Math.random() * 30, 0.55, "sawtooth", 0.12, 55); noise(0.45, { freq: 260, q: 4, vol: 0.25 }); }
  function gulp(){ tone(180, 0.09, "sine", 0.15, 90); }
  // przesuniecie puszki do ust [dx, dy, obrot]: wieczko przy ustach, dno do gory
  const SIP = { s1: [20, -212, 110], s2: [-40, -194, -110], m: [-21, -186, -110] };
  async function drink(ks){
    const up = k => `translate(${SIP[k][0]}px,${SIP[k][1]}px) rotate(${SIP[k][2]}deg)`;
    const rest = "translate(0,0) rotate(0deg)";
    await Promise.all(ks.map(k => anim($(who[k].el).querySelector(".can"), [{ transform: rest }, { transform: up(k) }], { duration: 450, easing: "ease-out" })));
    for (let i = 0; i < 4; i++){ gulp(); await sleep(260); }
    await Promise.all(ks.map(k => anim($(who[k].el).querySelector(".can"), [{ transform: up(k) }, { transform: rest }], { duration: 400 })));
  }
  function lighter(){ noise(0.06, { freq: 5000, q: 2, vol: 0.15 }); tone(300, 0.2, "sine", 0.02); }


  // ---------- skladak ----------
  let bikeX = 1900, bikeRaf = null;
  const bikeT = x => `translate(${x}px,812px)`;
  function setBike(x){
    bikeX = x; $("bike").style.transform = bikeT(x);
    who.s1.x = x - 5; who.s1.y = 812; who.s2.x = x + 80; who.s2.y = 812;
  }
  let pedalAnims = [];
  function pedal(period){
    pedalAnims.forEach(a => a.cancel()); pedalAnims = [];
    if (!period) return;
    pedalAnims.push($("crank").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: period * 1000, iterations: Infinity }));
    document.querySelectorAll("#bike .bw2").forEach(w => pedalAnims.push(
      w.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: period * 600, iterations: Infinity })));
    pedalAnims.push($("rideS1").querySelector(".bob").animate([{ transform: "translateY(0)" }, { transform: "translateY(-6px)" }],
      { duration: period * 500, direction: "alternate", iterations: Infinity }));
  }
  // jazda: plynny ruch klatka po klatce (pozycja potrzebna do ognia i dymkow)
  function ride(x1, ms, ease = t => t, onFrame){
    const x0 = bikeX, t0 = performance.now();
    return new Promise(res => {
      const step = now => {
        const t = Math.min(1, (now - t0) / ms);
        setBike(x0 + (x1 - x0) * ease(t));
        if (onFrame) onFrame(t);
        if (t < 1) bikeRaf = requestAnimationFrame(step); else res();
      };
      bikeRaf = requestAnimationFrame(step);
    });
  }
  function flame(x, y){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 10 + Math.random() * 12);
    c.setAttribute("fill", ["#ffd23f", "#ff8a1f", "#e34b2b"][Math.floor(Math.random() * 3)]);
    c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("bikeFx").append(c);
    c.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${120 + Math.random() * 120}px,${-30 - Math.random() * 50}px) scale(.2)`, opacity: 0 }],
              { duration: 500, fill: "forwards" }).finished.then(() => c.remove()).catch(() => {});
  }
  function speedLine(){
    const l = document.createElementNS(NS, "line"), y = 500 + Math.random() * 360, w = 80 + Math.random() * 160;
    l.setAttribute("x1", bikeX + 200); l.setAttribute("y1", y); l.setAttribute("x2", bikeX + 200 + w); l.setAttribute("y2", y);
    l.setAttribute("stroke", "#f4f4f2"); l.setAttribute("stroke-width", "4"); l.setAttribute("stroke-linecap", "round");
    $("bikeFx").append(l);
    l.animate([{ opacity: 0.9 }, { opacity: 0, transform: "translateX(200px)" }], { duration: 400, fill: "forwards" })
     .finished.then(() => l.remove()).catch(() => {});
  }
  function creak(){ tone(900 + Math.random() * 200, 0.08, "triangle", 0.03, 700); }
  function crickets(){
    return setInterval(() => { for (let i = 0; i < 3; i++) setTimeout(() => tone(4300, 0.03, "sine", 0.02), i * 70); }, 900);
  }
  function ghostSound(){ const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain(), l = a.createOscillator(), lg = a.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(420, t); o.frequency.linearRampToValueAtTime(260, t + 3.5);
    l.frequency.value = 6; lg.gain.value = 18; l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.6); g.gain.linearRampToValueAtTime(0.0001, t + 4);
    o.connect(g); g.connect(a.destination); o.start(t); l.start(t); o.stop(t + 4.1); l.stop(t + 4.1); }

  async function typeTitle(text){
    const el = $("titleTxt"); el.textContent = "";
    for (const ch of text){ el.textContent += ch; if (ch !== " ") tone(1400, 0.02, "square", 0.02); await sleep(70); }
  }

  function reset(){
    if (tts) tts.cancel();
    cancelAnimationFrame(bikeRaf);
    document.getAnimations().forEach(a => a.cancel());
    pedalAnims = [];
    Object.keys(gaits).forEach(k => gaits[k] = []);
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = ""; $("bikeFx").innerHTML = "";
    scene("scNight");
    $("s1").style.display = "none"; $("s2").style.display = "none";
    Object.assign(who.s1, { el: "rideS1", head: 345 }); Object.assign(who.s2, { el: "rideS2", head: 410 });
    $("bike").style.display = "none"; setBike(1900);
    $("rideS1").style.display = ""; $("rideS2").style.display = ""; $("rideS2").style.transform = "";
    $("ghost").style.display = "none";
    document.querySelectorAll(".cig, .can").forEach(e => e.style.display = "none");
    $("titleCard").style.display = "none";
    $("fade").style.opacity = 0; $("flash").style.opacity = 0;
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    await ziomkiIntro("DUCH NA BŁONIACH", 4);

    // plansza: "Na błoniach stadionu, 25 lat temu..."
    $("titleCard").style.display = "";
    await sleep(500);
    const narr = speak("Na błoniach stadionu, dwadzieścia pięć lat temu…", { vPitch: 0.6, vRate: 0.85 });
    await typeTitle("Na błoniach stadionu, 25 lat temu…");
    if (narr) await narr;
    await sleep(1200);
    await anim($("titleCard"), [{ opacity: 1 }, { opacity: 0 }], { duration: 1200 });
    $("titleCard").style.display = "none"; $("titleCard").style.opacity = 1;

    // jada skladakiem przez blonia; w tle kosciol, boisko, cmentarz
    const crk = crickets();
    const flick = $("znicze").animate([{ opacity: 1 }, { opacity: 0.55 }], { duration: 300, direction: "alternate", iterations: Infinity });
    $("bike").style.display = ""; setBike(1900);
    pedal(0.9);
    const squeak = setInterval(creak, 900);
    await ride(980, 6500, t => t);
    clearInterval(squeak);

    // duch nad boiskiem: od cmentarza do kosciola
    const g = $("ghost"); g.style.display = "";
    const bob = $("ghostBob").animate([{ transform: "translateY(0) rotate(-4deg)" }, { transform: "translateY(-14px) rotate(4deg)" }],
      { duration: 700, direction: "alternate", iterations: Infinity });
    ghostSound();
    const flight = anim(g, [
      { transform: "translate(1420px,480px) scale(0.4)", opacity: 0 },
      { transform: "translate(1300px,420px) scale(0.7)", opacity: 0.95, offset: 0.15 },
      { transform: "translate(800px,360px) scale(0.9)", opacity: 0.95, offset: 0.55 },
      { transform: "translate(260px,380px) scale(0.6)", opacity: 0.9, offset: 0.9 },
      { transform: "translate(200px,420px) scale(0.3)", opacity: 0 }], { duration: 11000, easing: "linear" });
    const slow = ride(840, 2500, t => 1 - (1 - t) * (1 - t));
    await sleep(900);
    pedal(0);
    await line("s2", ["Zobacz,", "co tam jest?"], 700, 60);
    await line("s1", ["O kurwa…", "duch!"], 600, -230);
    await slow;
    await line("s1", ["Spierdalamy!!!"], 200, 60, { pitch: 1.3, rate: 1.4 });

    // ucieczka: ogien z kol i pedalow, pasazer wygiety od wiatru
    pedal(0.12);
    anim($("rideS2"), [{ transform: "rotate(0deg)" }, { transform: "rotate(38deg)" }], { duration: 500, easing: "ease-out" });
    const roar = engine(); roar.set(90, 0.08, 0.3);
    noise(2.6, { freq: 900, q: 0.8, vol: 0.3, sweepTo: 2400 });
    await ride(-500, 2600, t => t * t, () => {
      flame(bikeX - 80, 800); flame(bikeX + 80, 800); flame(bikeX, 772);
      if (Math.random() < 0.6) speedLine();
    });
    roar.stop(0.3); pedal(0);
    await flight;
    bob.cancel(); flick.cancel(); clearInterval(crk);

    // pod sklepem ALMA w nocy
    await fadeTo(() => {
      scene("scShop");
      $("bikeFx").innerHTML = "";
      $("rideS1").style.display = "none"; $("rideS2").style.display = "none"; $("rideS2").style.transform = "";
      setBike(1330);
      Object.assign(who.s1, { el: "s1", head: 440 }); Object.assign(who.s2, { el: "s2", head: 425 });
      place("s1", 960, 800); place("s2", 1150, 800);
    });
    const hum = crickets();
    // zdyszani
    const pant = [$("s1"), $("s2")].map(e => e.querySelector(".bob").animate(
      [{ transform: "translateY(0)" }, { transform: "translateY(-6px)" }], { duration: 300, direction: "alternate", iterations: Infinity }));
    await sleep(1600);
    pant.forEach(a => a.cancel());
    await line("s1", ["Widziałeś to,", "kurwa?"], 800, -40);
    await line("s2", ["Widziałem…", "ale nikt nam nie uwierzy."], 1800, 40);
    await sleep(1200);
    clearInterval(hum);
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
</html>
