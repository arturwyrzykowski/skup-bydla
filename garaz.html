<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },

    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);

    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });

    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.13, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    [f, f * 1.5, f * 2].forEach(fr => { const o = a.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = Math.random() * 8 - 4; o.connect(ws); o.start(t); o.stop(t + dur + 0.02); });
    ws.connect(lp); lp.connect(g); g.connect(a.destination);
  }
  async function intro(){
    const tc = $("titleCard"); tc.style.display = ""; tc.style.opacity = 1;
    document.querySelectorAll("#ziomki .zl").forEach((l, k) => l.animate(
      [{ transform: "translateY(-600px)", opacity: 0 }, { transform: "translateY(30px)", opacity: 1, offset: 0.7 }, { transform: "translateY(0)", opacity: 1 }],
      { duration: 500, delay: 120 + k * 170, fill: "both", easing: "ease-in" }));
    const heads = [...document.querySelectorAll("#ziomHeads .zh")].map((h, k) => h.animate([{ transform: "translateY(0)" }, { transform: "translateY(-24px)" }],
      { duration: 333, direction: "alternate", iterations: Infinity, delay: k * 111 }));
    const spin = $("guitar").animate([{ transform: "rotate(-12deg)" }, { transform: "rotate(12deg)" }], { duration: 667, direction: "alternate", iterations: Infinity, easing: "ease-in-out" });
    const a = ac(), T = a.currentTime + 0.1, beat = 60 / 90;
    const scratchTimes = [];
    for (let bar = 0; bar < 2; bar++){
      const b0 = T + bar * 4 * beat;
      [0, 2, 2.5].forEach(x => kick(b0 + x * beat));
      [1, 3].forEach(x => snare(b0 + x * beat));
      for (let e = 0; e < 8; e++) hat(b0 + e * beat / 2);
      [[0, 55], [1.5, 65], [2, 49], [3, 58]].forEach(([x, f]) => bass(b0 + x * beat, f, beat * 0.9));
      [1.25, 3.25].forEach(x => { scratch(b0 + x * beat, bar === 1 && x > 3 ? 6 : 4); scratchTimes.push((b0 + x * beat - a.currentTime) * 1000); });
      // riff gitary (przester, akordy kwintowe)
      [[0, 82.4, 0.5], [0.5, 82.4, 0.5], [1, 98, 0.5], [2, 110, 0.5], [2.5, 110, 0.5], [3, bar ? 123.5 : 98, 0.9]].forEach(([x, f, d]) => guitar(b0 + x * beat, f, d * beat));
    }
    // napis podryguje w rytm skreczy, plyta sie cofa
    scratchTimes.forEach(ms => setTimeout(() => {
      anim($("titleTxtG"), [{ transform: "translateX(0)" }, { transform: "translateX(-26px)" }, { transform: "translateX(22px)" }, { transform: "translateX(-14px)" }, { transform: "translateX(0)" }], { duration: 440 });
      anim($("guitar"), [{ transform: "rotate(0deg) scale(1)" }, { transform: "rotate(-25deg) scale(1.08)" }, { transform: "rotate(0deg) scale(1)" }], { duration: 440 });
    }, ms));
    anim($("titleTxtG"), [{ transform: "scale(0.3)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1 }, { transform: "scale(1)" }], { duration: 700 });
    await sleep(8 * beat * 1000 + 300);
    await anim(tc, [{ opacity: 1 }, { opacity: 0 }], { duration: 600 });
    spin.cancel(); heads.forEach(h => h.cancel()); tc.style.display = "none"; tc.style.opacity = 1;
  }

  // ---------- rolnik: tupniecie ----------
  async function stomp(big){
    const leg = $("uLegR"), u = who.u;
    await anim(leg, [{ transform: "rotate(0deg)" }, { transform: "rotate(-40deg)" }], { duration: 220, easing: "ease-out" });
    await anim(leg, [{ transform: "rotate(-40deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(0deg)" }], { duration: 110, easing: "ease-in" });
    sfx.thud();
    puff(u.x + 40, u.y, { r: 16, dur: 700, dx: 50, dy: -40, color: "#b09a6c" });
    puff(u.x + 10, u.y, { r: 16, dur: 700, dx: -40, dy: -40, color: "#b09a6c" });
    if (big) shake(14, 380);
  }
  const ghostAnims = {};
  function showGhost(id){
    Object.entries(ghostAnims).forEach(([k, a]) => { a.cancel(); $(k).style.opacity = 0.35; });
    const g = $(id); g.style.display = ""; g.style.opacity = 1;
    const a = g.animate([{ opacity: 0.55 }, { opacity: 1 }], { duration: 700, direction: "alternate", iterations: Infinity });
    ghostAnims[id] = a;
    anim(g, [{ transform: "scale(0.9)" }, { transform: "scale(1)" }], { duration: 300 });
    tone(880, 0.15, "sine", 0.06); setTimeout(() => tone(1320, 0.2, "sine", 0.05), 120);
    return a;
  }

  function reset(){
    if (tts) tts.cancel();
    document.getAnimations().forEach(a => a.cancel());
    Object.keys(gaits).forEach(k => gaits[k] = []);
    Object.values(who).forEach(w => { clearInterval(w._talk); w._talk = null; });
    $("bubbles").innerHTML = ""; $("fx").innerHTML = "";
    Object.keys(who).forEach(k => $(who[k].el).style.display = "none");
    document.querySelectorAll(".cig, .can").forEach(e => e.style.display = "none");
    $("crack").style.display = "none"; $("houseDoor").setAttribute("fill", "#6e5a3a");
    $("uArmPush").style.display = "none"; $("uArmsWave").style.display = "none";
    $("uArmPocketL").style.display = ""; $("uArmPocketR").style.display = "";
    $("fade").style.opacity = 0; $("flash").style.opacity = 0;
  }

  async function play(){
    reset(); ac();
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    await ziomkiIntro("GARAŻ", 7);

    // na podworku: rolnik i ekipa
    place("u", 960, 800); place("a", 1120, 800); place("r", 1260, 800); place("s", 1420, 800);
    const hens = setInterval(() => { if (Math.random() < 0.5) tone(900 + Math.random() * 300, 0.08, "square", 0.02, 600); }, 1500);
    await sleep(900);
    await line("u", ["No to gdzie ten garaż", "stawiamy, panowie?"], 500, 60);
    await stomp();
    await line("u", ["Tu, przy stodole!", "Tu jest twardo!"], 500, 60);
    await stomp();
    await line("s", ["Panie, pod lasem.", "Blaszak i po sprawie."], 500, -60);
    await line("a", ["Nie no, murowany,", "na dwa auta, z kanałem!"], 500, 0);
    await line("r", ["A ja bym dał pod domem,", "wjazd prosto z drogi."], 500, -40);
    await line("u", ["Jaki kanał?! Jaki blaszak?!", "Przy stodole, mówię!"], 300, 60, { rate: 1.3 });
    await stomp();
    // wszyscy naraz
    const chaos = [["a", ["Murowany!"]], ["s", ["Blaszak, mówię!"]], ["r", ["Pod domem!"]], ["u", ["Przy stodole!"]], ["a", ["Z kanałem!"]], ["r", ["Pod domem, kurwa!"]]];
    for (const [k, l] of chaos){
      const b = await say(k, l, 0, { instant: true });
      if (k === "s") speak(l[0], who.s); else speak(l[0], who[k], { rate: 1.4 });
      hop(k, 20, 200);
      await sleep(650); unsay(b);
    }
    await sleep(600);

    // syn rolnika na tarasie
    $("houseDoor").setAttribute("fill", "#2a2018"); sfx.door();
    place("syn", 455, 600);
    await anim($("syn"), [{ transform: actT(who.syn, 455) }, { transform: actT(who.syn, 520) }], { duration: 600 });
    who.syn.x = 520; $("syn").style.transform = actT(who.syn);
    $("houseDoor").setAttribute("fill", "#6e5a3a");
    anim($("synArm"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-60deg)" }, { transform: "rotate(-30deg)" }, { transform: "rotate(-60deg)" }, { transform: "rotate(0deg)" }], { duration: 2400 });
    const synSmoke = setInterval(() => puff(who.syn.x + 58 * who.syn.s, who.syn.y - 348 * who.syn.s, { r: 6, dur: 1500, dx: 14, dy: -70, color: "#cfcfcf" }), 350);
    await line("syn", ["Na chuj tu pod domem garaż?", "Człowieku, ruszyć się tu", "nie będzie można!"], 1200, 200);

    // rolnik konczy temat: tupniecie, ziemia peka
    await sleep(400);
    await line("u", ["A chuj z tym garażem!", "Nie będzie garażu!"], 300, 60, { pitch: 0.6, rate: 1.2 });
    await anim($("uLegR"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-55deg)" }], { duration: 350, easing: "ease-out" });
    await anim($("uLegR"), [{ transform: "rotate(-55deg)" }, { transform: "rotate(8deg)" }, { transform: "rotate(0deg)" }], { duration: 130, easing: "ease-in" });
    sfx.thud(); tone(45, 1.4, "sine", 0.7, 25); noise(1.2, { freq: 300, type: "lowpass", vol: 0.6, sweepTo: 80 });
    anim($("flash"), [{ opacity: 0.6 }, { opacity: 0 }], { duration: 300 });
    shake(26, 900);
    const cr = $("crack"); cr.style.display = "";
    const len = cr.getTotalLength ? cr.getTotalLength() : 3000;
    cr.style.strokeDasharray = len;
    anim(cr, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 700, easing: "ease-out" });
    for (let i = 0; i < 12; i++) puff(300 + Math.random() * 1000, 830 + Math.random() * 60, { r: 20, dur: 1200, dx: Math.random() * 80 - 40, dy: -80, color: "#b09a6c" });
    await Promise.all(["a", "r", "s"].map(k => hop(k, 70, 400)));
    await sleep(900);
    // idzie do domu
    await walkTo("u", 680, 1500, 0.4);
    const up = [actT(who.u, 680, 800), actT(who.u, 600, 640)];
    await anim($("ubij"), [{ transform: up[0] }, { transform: up[1] }], { duration: 700 });
    Object.assign(who.u, { x: 600, y: 640 });
    await walkTo("u", 455, 900, 0.4);
    $("houseDoor").setAttribute("fill", "#2a2018"); sfx.door();
    hide("u");
    await sleep(300); $("houseDoor").setAttribute("fill", "#6e5a3a"); sfx.door();
    await sleep(600);
    // syn tez wraca
    clearInterval(synSmoke); hide("syn"); sfx.door();
    await sleep(1600);
    clearInterval(hens);
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
