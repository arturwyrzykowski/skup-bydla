<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- dzwiek (generowany, bez plikow) ----------
  let actx = null;
  function ac(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, glideTo){
    const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { freq = 1000, q = 1, vol = 0.3, type = "bandpass", sweepTo } = {}){
    const a = ac(), t = a.currentTime, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
  }
  function engine(){
    const a = ac(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 45; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.0001;
    o.connect(f); f.connect(g); g.connect(a.destination); o.start();
    return {
      set(freq, vol, ramp = 0.3){ const t = a.currentTime; o.frequency.linearRampToValueAtTime(freq, t + ramp); g.gain.linearRampToValueAtTime(vol, t + ramp); },
      stop(ramp = 0.4){ const t = a.currentTime; g.gain.linearRampToValueAtTime(0.0001, t + ramp); o.stop(t + ramp + 0.05); }
    };
  }
  const sfx = {
    beep(){ tone(1750, 0.07, "square", 0.04); },
    dig(){ noise(0.18, { freq: 500, type: "lowpass", vol: 0.45 }); noise(0.1, { freq: 3000, q: 3, vol: 0.08 }); },
    thud(){ tone(110, 0.3, "sine", 0.5, 40); noise(0.2, { freq: 300, type: "lowpass", vol: 0.35 }); },
    clank(){ tone(620 + Math.random() * 200, 0.25, "triangle", 0.08, 480); noise(0.08, { freq: 4000, q: 2, vol: 0.12 }); },
    door(){ noise(0.12, { freq: 600, type: "lowpass", vol: 0.4 }); tone(95, 0.12, "square", 0.08, 60); },
    brake(){ noise(0.5, { freq: 1400, q: 1.5, vol: 0.14 }); },
    screech(){ noise(1.6, { freq: 2700, q: 9, vol: 0.4, sweepTo: 1700 }); tone(1900, 1.5, "sawtooth", 0.025, 1250); },
    spit(){ noise(0.16, { freq: 2500, q: 1.2, vol: 0.35, sweepTo: 900 }); },
    ding(){ tone(1320, 0.5, "sine", 0.1); },
    dial(){ tone(425, 0.9, "sine", 0.08); },
    boom(){
      noise(2.6, { freq: 900, type: "lowpass", vol: 0.9, sweepTo: 80 });
      tone(90, 1.8, "sine", 0.7, 25); tone(55, 2.2, "sawtooth", 0.15, 20);
    },
    voice(pitch){ tone(pitch * (0.8 + Math.random() * 0.45), 0.07, "square", 0.045); }
  };

  // ---------- animacja ----------
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished.catch(() => {});
  const busT = (x, y = 494) => `translate(${x}px,${y}px)`;

  function puff(x, y, { r = 26, dur = 1100, dx = 0, dy = -80, color = "#dcdcdc" } = {}){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", color); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "4");
    c.style.transformOrigin = `${x}px ${y}px`;
    $("fx").append(c);
    c.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 },
               { transform: `translate(${dx}px,${dy}px) scale(1.6)`, opacity: 0 }],
              { duration: dur, easing: "ease-out", fill: "forwards" })
     .finished.then(() => c.remove()).catch(() => {});
  }
  // gruda ziemi lecaca po luku
  function clod(x, y, dx, h){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 9 + Math.random() * 8);
    c.setAttribute("fill", "#6b5230"); c.setAttribute("stroke", "#141414"); c.setAttribute("stroke-width", "3");
    $("fx").append(c);

  function makeBubble(tipX, tipY, lines, shift = 0){
    const g = document.createElementNS(NS, "g");

    const patch = document.createElementNS(NS, "path");

    g.style.transform = `translate(${tipX}px,${tipY}px) scale(0)`;
    $("bubbles").append(g);

    const spans = lines.map(() => { const t = document.createElementNS(NS, "tspan"); text.append(t); return t; });
    let maxW = 0;
    spans.forEach((s, i) => { s.textContent = lines[i]; maxW = Math.max(maxW, s.getComputedTextLength()); });
    const lh = 50, padX = 34, padY = 26;
    const W = maxW + padX * 2, H = lines.length * lh + padY * 2 - 10;
    let left = Math.max(20, Math.min(1580 - W, tipX + shift - W / 2));
    const bx = left - tipX, by = -38 - H;
    const tb = Math.min(Math.max(0, bx + 34), bx + W - 54);
    Object.entries({ x: bx, y: by, width: W, height: H, rx: 26, fill: "#fff", stroke: "#111", "stroke-width": 5 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    tail.setAttribute("d", `M${tb - 18} -46 L0 0 L${tb + 22} -46 Z`);
    tail.setAttribute("fill", "#fff"); tail.setAttribute("stroke", "#111"); tail.setAttribute("stroke-width", "5");
    patch.setAttribute("d", `M${tb - 13} -38 L${tb + 17} -38`); patch.setAttribute("stroke", "#fff"); patch.setAttribute("stroke-width", "7");
    spans.forEach((s, i) => { s.setAttribute("x", bx + padX); s.setAttribute("y", by + padY + 34 + i * lh); s.textContent = ""; });
    return { g, spans, lines, tipX, tipY };
  }

  };

  const DEEP = 0.55;

  function clipFor(text){
    const src = CLIPS[text];

    if (!clipEls[src]){

  }

  }
  function playClip(a){
    return new Promise(res => {
      a.currentTime = 0; a.playbackRate = DEEP;

    await runAway(1600, 4200);

    // ===== zul =====
    place("z1", 1750, 800);
    const zs = $("zul1").querySelector(".bob").animate([{ transform: "rotate(-9deg)" }, { transform: "rotate(9deg)" }], { duration: 900, direction: "alternate", iterations: Infinity, easing: "ease-in-out" });
    legs("z1", "walk");
    await anim($("zul1"), [{ transform: actT(who.z1) }, { transform: actT(who.z1, 1250) }], { duration: 3000, easing: "ease-in-out" });
    who.z1.x = 1250; legs("z1", null);
    await line("r", ["Patrzta,", "jak mu zajebię."], 400, -40);
    await walkIn("r", 760, 900);
    legs("z1", "walk");
    await anim($("zul1"), [{ transform: actT(who.z1) }, { transform: actT(who.z1, 1080) }], { duration: 1200, easing: "ease-in-out" });
    who.z1.x = 1080; legs("z1", null); zs.cancel();
    // przewraca sie do tylu, na tyl glowy
    await anim($("zul1").querySelector(".fall"), [{ transform: "rotate(0deg)" }, { transform: "rotate(20deg)", offset: 0.4 }, { transform: "rotate(92deg)" }], { duration: 900, easing: "ease-in" });
    sfx.thud(); tone(60, 0.3, "sine", 0.4, 30); shake(10, 300);
    const blood = document.createElementNS(NS, "ellipse");
    blood.setAttribute("cx", 1080 + 360 * 0.85 + camX); blood.setAttribute("cy", 806); blood.setAttribute("rx", 60); blood.setAttribute("ry", 14);
    blood.setAttribute("fill", "#b01818"); blood.setAttribute("stroke", "#141414"); blood.setAttribute("stroke-width", "3");
    blood.style.transformOrigin = `${1080 + 360 * 0.85 + camX}px 806px`;
    $("streetFx").append(blood);
    anim(blood, [{ transform: "scale(0.1)" }, { transform: "scale(1)" }], { duration: 2400 });
    await sleep(1400);
    await line("a", ["O kurwa…", "nie żyje."], 500, -60);
    await line("r", ["Dzwonimy", "po karetkę?"], 400, -40);
    await line("s", ["Co ty, pojebało cię?", "Jeszcze będzie na nas."], 600, 40);
    await sleep(500);
    // zul wstaje i odchodzi
    await anim($("zul1").querySelector(".fall"), [{ transform: "rotate(92deg)" }, { transform: "rotate(0deg)" }], { duration: 900, easing: "ease-out" });
    const zs2 = $("zul1").querySelector(".bob").animate([{ transform: "rotate(-9deg)" }, { transform: "rotate(9deg)" }], { duration: 900, direction: "alternate", iterations: Infinity });
    legs("z1", "walk");
    await anim($("zul1"), [{ transform: actT(who.z1) }, { transform: actT(who.z1, 1900) }], { duration: 3200, easing: "ease-in" });
    zs2.cancel(); legs("z1", null); hide("z1");
    await line("r", ["Kurwa, dobrze,", "że mu nie zajebałem."], 800, -40);
    await walkIn("r", 530, 700);

    // ===== okno nr 2 i poscig =====
    await walkCam(600, 2400);                                   // camX 2900
    await Promise.all([walkIn("a", 760, 1200), walkIn("r", 920, 1200), walkIn("s", 1080, 1200)]);
    await throwAt("a", "winB");
    // ktos wybiega z domu
    const door = $("doorB"); door.setAttribute("fill", "#ffd966");
    const cx0 = +door.getAttribute("x") + 30 - camX;
    place("c", cx0, 800);
    legs("c", "run");
    const shout = (async () => { await sleep(300); await line("c", ["Gówniarze jebane,", "ja wam dam!!!"], 600, 60, { pitch: 0.6, rate: 1.4 }); })();
    await runAway(1600, 5200, t => {
      // prawie ich dogania, potem odpada
      const x = t < 0.6 ? cx0 + (690 - cx0) * (t / 0.6) : 690 - (t - 0.6) / 0.4 * 900;
      who.c.x = x; $("chaser").style.transform = actT(who.c);
    });
    legs("c", null); hide("c"); door.setAttribute("fill", "#6e5a3a");
    await shout;

    // ===== zul z siekiera spod stodoly =====
    await walkCam(500, 2200);                                  // camX 5000
    const barnX = 200 + 8 * 620 + 230 - camX;
    place("z2", barnX, 700);
    $("zul2").style.opacity = 0.25;
    await sleep(900);
    anim($("zul2"), [{ opacity: 0.25 }, { opacity: 1 }], { duration: 400 });
    $("zul2").style.opacity = 1;
    await line("z2", ["AAAAAAA!!!"], 100, 60, { pitch: 0.3, rate: 1.2 });
    legs("z2", "run");
    await Promise.all(TRIO.map(k => hop(k, 60, 300)));
    const z2y0 = 700;
    await runAway(1200, 3600, t => {
      const x = barnX + t * 520, y = z2y0 + Math.min(1, t * 3) * 100;
      who.z2.x = x; who.z2.y = y; $("zul2").style.transform = actT(who.z2);
      if (t > 0.55 && !who.z2._fell){
        who.z2._fell = true; legs("z2", null);
        anim($("zul2").querySelector(".fall"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-95deg)" }], { duration: 400, easing: "ease-in" })
          .then(() => { sfx.thud(); shake(8, 250); });
      }
    });
    who.z2._fell = false;
    await sleep(600);

    // ===== pod sklepem ALMA =====
    await fadeTo(() => { hide("z2"); chimneys(false); scene("scShop"); trioAt([700, 880, 1060]); });
    await sleep(900);
    await line("a", ["Kurwa, jak my", "do domu wrócimy?"], 1200, -40);

    // ===== po zamarznietej rzece, po krzakach =====
    await fadeTo(() => { scene("scRiver"); trioAt([-450, -300, -150]); });
    const slip = async k => { await anim($(who[k].el).querySelector(".bob"), [{ transform: "rotate(0deg)" }, { transform: "rotate(-14deg)" }, { transform: "rotate(10deg)" }, { transform: "rotate(0deg)" }], { duration: 700 }); };
    const crossing = Promise.all([walkIn("a", 1700, 7000), walkIn("r", 1850, 7000), walkIn("s", 2000, 7000)]);
    await sleep(2200); slip("r"); tone(300, 0.4, "triangle", 0.06, 120);
    await sleep(1800); noise(0.4, { freq: 1500, q: 3, vol: 0.2 }); slip("a"); slip("s");
    await crossing;

    // ===== w domu: gile, Tatra, fajki, FIFA 06 =====
    snowfall(false); clearInterval(wind);
    await fadeTo(() => { scene("scRoom"); trioAt([-450, -300, -150]); document.querySelectorAll(".gil").forEach(e => e.style.display = ""); });
    sfx.door();
    await Promise.all([walkIn("a", 420, 2600), walkIn("r", 620, 2600), walkIn("s", 820, 2600)]);
    const shiver = TRIO.map(k => $(who[k].el).querySelector(".bob").animate([{ transform: "translateX(-3px)" }, { transform: "translateX(3px)" }], { duration: 60, direction: "alternate", iterations: 30 }));
    await sleep(1400);
    // Tatra
    for (const k of TRIO){ $(who[k].el).querySelector(".can").style.display = ""; noise(0.25, { freq: 4000, q: 1, vol: 0.25, sweepTo: 1500 }); await sleep(450); }
    await sleep(400);
    // papierosy
    for (const k of TRIO){ noise(0.06, { freq: 5000, q: 2, vol: 0.15 }); $(who[k].el).querySelector(".cig").style.display = ""; await sleep(350); }
    const smoke = setInterval(() => TRIO.forEach(k => puff(who[k].x + 30 * 0.9, who[k].y - 400, { r: 9, dur: 1600, dx: 20, dy: -90, color: "#cfcfcf" })), 420);
    await sleep(1200);
    // wlaczaja komputer
    tone(1000, 0.08, "square", 0.05); $("crtScreen").setAttribute("fill", "#cfe6ff");
    await sleep(900);
    clearInterval(smoke);
    const fu = $("fifaUI"); fu.style.display = "";
    await anim(fu, [{ opacity: 0 }, { opacity: 1 }], { duration: 500 });
    tone(80, 0.3, "sine", 0.2);
    await sleep(500);
    await anim($("fifaScreen"), [{ opacity: 0 }, { opacity: 1 }], { duration: 900 });
    [[262, 330, 392], [294, 370, 440], [330, 415, 494], [392, 494, 587]].forEach((ch, i) => setTimeout(() => ch.forEach(f => tone(f, 0.5, "sawtooth", 0.03)), i * 380));
    anim($("fifaLogo"), [{ transform: "scale(0.6)", opacity: 0 }, { transform: "scale(1.08)", opacity: 1 }, { transform: "scale(1)" }], { duration: 900 });
    $("fifaLogo").style.transformOrigin = "800px 300px";
    const blink = $("pressStart").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, direction: "alternate", iterations: Infinity });
    await sleep(3500);
    blink.cancel();
    $("endScreen").hidden = false; $("againBtn").focus();
  }

  const start = () => { unlockSpeech(); unlockClips(); play(); };
  $("playBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
</script>
</body>
